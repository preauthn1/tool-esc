<!DOCTYPE html>
<html>
    <head>
        <title>RazorPay</title>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="/static/common/css/bootstrap.min.css">
        <link rel="stylesheet" href="/static/common/css/font-awesome.min.css">
        {if $setting.logo}
        <link rel="shortcut icon" href="{$setting.logo|toMedia}">
        {/if}
    </head>
    <body>
        <div class="container text-center">
            <br>
            <br>
            <br>
            <br>
            <br>
            <br>
            <br>
            <br>
            <br>
            <button id="rzp-button1" class='btn btn-primary btn-block btn-lg'><i class="fa fa-rupee"></i>{:lang('立即支付')}</button>
            <br>
            <a class="btn btn-info btn-block btn-lg" href="{:url('index/index')}"><i class="fa fa-home"></i>{:lang('返回首页')}</a>
        </div>
        <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
        <script>
        var options = {
            "key": "{$config.app_id}", // Enter the Key ID generated from the Dashboard
            "amount": "{$raz_order.amount}", // Amount is in currency subunits. Default currency is INR. Hence, 50000 refers to 50000 paise
            "currency": "{$raz_order.currency}",
            "name": "{$setting.title}",
            "description": "",
            "image": "{$setting.logo|toMedia}",
            "order_id": "{$raz_order.id}",
//            "handler": function (response){
//                alert(response.razorpay_payment_id);
//                alert(response.razorpay_order_id);
//                alert(response.razorpay_signature)
//            },
            "callback_url": "{$config.notify_url}",
            "prefill": {
                "name": "{$user.true_name}",
//                "email": "{$user.mobile}",
                "contact": "{$user.mobile}"
            },
            "theme": {
                hide_topbar:true,
                "color": "#3399cc"
            },
            modal: {
                backdropclose:false,
                escape:true,
                handleback:true,
            }
        };
        var rzp1 = new Razorpay(options);
        rzp1.open();
        document.getElementById('rzp-button1').onclick = function(e){
            rzp1.open();
            e.preventDefault();
        }
        </script>
    </body>
</html>
