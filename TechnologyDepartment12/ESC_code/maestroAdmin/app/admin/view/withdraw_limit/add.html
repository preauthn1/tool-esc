{include file="header" /}
<div class="row">
    <div class="col-sm-12">
        <div class="ibox float-e-margins">
            <div class="ibox-title">
                <h5>添加</h5>
            </div>
            <div class="ibox-content">
                <form class="form-horizontal m-t" id="dataForm" method="post" action="{:url('add')}">
                    <input type="hidden" name="id" value="{$info.id}"/>
                    <div class="form-group">
                        <label class="col-sm-3 control-label">用户ID或手机号码：</label>
                        <div class="input-group col-sm-4">
                            <input type="text" class="form-control" placeholder="填写用户ID或手机号码" name="user_id" required="" aria-required="true" value="{$info.user_id}" />
                        </div>
                    </div>
                    <div class="form-group">
                        <label class="col-sm-3 control-label">备注：</label>
                        <div class="input-group col-sm-4">
                            <input type="text" class="form-control" value="{$info.remark}" name="remark" required />
                        </div>
                    </div>
                    <div class="form-group">
                        <label class="col-sm-3 control-label">状态：</label>
                        <div class="input-group col-sm-4">
                            <select class="form-control" name="status">
                                <option value="1" {if $info.status eq 1} selected {/if}>启用</option>
                                <option value="0" {if $info.status neq 1} selected {/if}>停用</option>
                            </select>
                        </div>
                    </div>
                    <div class="form-group">
                        <div class="col-sm-4 col-sm-offset-6">
                            <button class="btn btn-primary" type="submit">提交</button>
                        </div>
                    </div>
                </form>
            </div>
        </div>

    </div>
</div>
<script>
    $("#level_id").on('change', function(){
        var amount = $(this).find("option:selected").data('amount');
        if (amount) {
            $("#amount").val(amount);
        }else{
            $("#amount").val('');
        }
    })
</script>
{include file="footer" /}
