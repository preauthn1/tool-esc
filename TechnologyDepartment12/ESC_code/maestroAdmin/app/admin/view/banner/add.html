    {include file="header" /}
    <div class="row">
        <div class="col-sm-10">
            <div class="ibox float-e-margins">
                <div class="ibox-title">
                    <h5>{:lang("编辑")}</h5>
                </div>
                <div class="ibox-content">
                    <form class="form-horizontal m-t" id="dataForm" method="post" action="{:url('banner/add')}">
                        <input type="hidden" name="id" value="{$info.id}">
                        <div class="form-group">
                            <label class="col-sm-3 control-label">{:lang("排序")}：</label>
                            <div class="input-group col-sm-4">
                                <input id="sort" type="text" class="form-control" name="sort" required="" aria-required="true" value="{$info.sort}">
                                <p class="help-block">{:lang("数字越小的排在前面")}</p>
                            </div>
                        </div>
                        <div class="form-group">
                            <label class="col-sm-3 control-label">{:lang("语言")}：</label>
                            <div class="input-group col-sm-4">
                                <select name='lang' class="form-control">
                                    {volist name='langs' id='lang'}
                                    <option value="{$lang.lang}" {if $info.lang eq $lang.lang} selected{/if}>{$lang.title}</option>
                                    {/volist}
                                </select>
                            </div>
                        </div>
                        <div class="form-group">
                            <label class="col-sm-3 control-label">{:lang("幻灯名称")}：</label>
                            <div class="input-group col-sm-4">
                                <input id="name" type="text" class="form-control" name="name" required="" aria-required="true" value="{$info.name}">
                            </div>
                        </div>
                        <div class="form-group">
                            <label class="col-sm-3 control-label">{:lang("链接")}：</label>
                            <div class="input-group col-sm-4">
                                <input id="link" type="text" class="form-control" name="link" required="" aria-required="true" value="{$info.link}">
                            </div>
                        </div>
                        <div class="form-group">
                            <label class="col-sm-3 control-label">{:lang("区域编码")}：</label>
                            <div class="input-group col-sm-4">
                                <select name='region' class="form-control">
                                    <option value="">{:lang("请选择")}</option>
                                    {volist name='areas' id='area'}
                                    <option value="{$area.index}" {if $info.region eq $area.index} selected{/if}>{$area.name}</option>
                                    {/volist}
                                </select>
                            </div>
                        </div>
                        <div class="form-group">
                            <label class="col-sm-3 control-label">{:lang("缩略图")}：</label>
                            <input name="pic" id="img" type="hidden" value="{$info['pic']}" />
                            <div class="form-inline">
                                <div class="input-group col-sm-2">
                                    <button type="button" class="layui-btn" id="uploader">
                                        <i class="layui-icon">&#xe67c;</i>{:lang("上传图片")}
                                    </button>
                                </div>
                                <div class="input-group col-sm-3">
                                    <div id="sm">
                                        <img src="{$info.pic|toMedia}" style="max-height: 40px;"/>
                                    </div>
                                </div>
                            </div>
                        </div>
                        <div class="form-group">
                            <label class="col-sm-3 control-label">{:lang("是否启用")}：</label>
                            <div class="input-group col-sm-4">
                                {foreach name='status' item='vo' key='key'}
                                <div class="radio i-checks col-sm-4">
                                    {if condition="$key == $info['status'] " }
                                    <label><input type="radio" value="{$key}" checked name="status"> <i></i> {$vo}</label>
                                    {else}
                                    <label><input type="radio" value="{$key}" name="status"> <i></i> {$vo}</label>
                                    {/if}
                                </div>
                                {/foreach}
                            </div>
                        </div>
                        <div class="form-group">
                            <div class="col-sm-4 col-sm-offset-6">
                                <!--<input type="button" value="提交" class="btn btn-primary" id="postform"/>-->
                                <button class="btn btn-primary" type="submit">{:lang("提交")}</button>
                            </div>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
{include file="footer" /}
