    {include file="header" /}
    <div class="row">
        <div class="col-sm-12">
            <div class="ibox float-e-margins">
                <div class="ibox-title">
                    <h5>{:lang("添加")}</h5>
                </div>
                <div class="ibox-content">
                    <form class="form-horizontal m-t" id="dataForm" method="post" action="{:url('add')}">
                        <input type="hidden" name="id" value="{$info.id|default=0}"/>
                        <div class="form-group">
                            <label class="col-sm-3 control-label">{:lang("文字")}：</label>
                            <div class="input-group col-sm-4">
                                <input type="text" class="form-control" value="{$info.title|default=''}" name="title" required>
                            </div>
                            <div style="text-align: center;margin-top: 5px">
                                <button type="button" class="layui-btn layui-btn-primary" id="translate" lay-on="translate">一键翻译</button>
                                <br>
                                <span style="color: red">如果翻译内容过大耐心等待，如果一直报错请到谷歌翻译网站进行翻译</span><br>
                                <a target="_blank" href="https://translate.google.com/">谷歌翻译网址：https://translate.google.com/</a>
                            </div>
                        </div>
                        {volist name='langs' id='row'}
                        <div class="form-group">
                            <label class="col-sm-3 control-label">{$row.title|lang}：</label>
                            <div class="input-group col-sm-4">
                                <input id="{$row.lang}" type="text" class="form-control" value="{$details[$row.id]??''}" name="newlang[{$row.id}]" placeholder="{$row.remark}" required />
                            </div>
                        </div>
                        {/volist}
                        <div class="form-group">
                            <label class="col-sm-3 control-label">{:lang("图片")}：</label>
                            <div class="form-inline">
                                <div class="input-group col-sm-2">
                                    <button type="button" class="layui-btn" id="uploaderFile">
                                        <i class="layui-icon">&#xe67c;</i>{:lang("上传图片")}
                                    </button>
                                </div>
                                <div class="input-group col-sm-3">
                                </div>
                            </div>
                        </div>
                        <div class="form-group">
                            <div class="col-sm-4 col-sm-offset-6">
                                <button class="btn btn-primary" type="submit">{:lang("提交")}</button>
                            </div>
                        </div>
                    </form>
                </div>
            </div>

        </div>
    </div>
<script type="text/javascript">
    function uploadDone(res) {
        layer.prompt({
            title:'文件地址',
            value:res.data.src,
        },function(value, index, elem){
            layer.close(index);
        });
    }
</script>
{include file="footer" /}
<script type="text/javascript">
    // 单张上传图片
    layui.use(['upload', 'util'], function(){
        var upload = layui.upload;
        var util = layui.util;
        upload.render({
            elem: '#uploaderFile' //绑定元素
            ,accept: 'file'
            ,exts:'jpg|png|gif|bmp|jpeg|mp4'
            ,url: "{:url('upload/upload')}" //上传接口
            ,done: function(res){
                //上传完毕回调
                if (typeof uploadDone === 'function') {
                    uploadDone(res);
                }else{
                    $("#img").val(res.data.path);
                    $("#sm").html('<img src="' + res.data.src + '" style="height: 40px;"/>');
                }
            }
        });

        util.on({
            translate: function (othis) {
                let title = $('input[name=title]').val()
                // 发起翻译请求
                let url = "{:url('articles/translate')}"
                index = layer.load(0);
                $.ajax({
                    type: 'POST',
                    url: url,
                    data:{text:title},
                    dataType: 'json',
                    success: function (res) {
                        layer.closeLast('loading');
                        // 循环语言
                        for (let key in res.data) {
                            $('#'+key).val(res.data[key])
                        }
                    },
                    error: function (xhr, type) {
                        layer.closeLast('loading');
                    }
                });
            },
        });
    });
</script>
