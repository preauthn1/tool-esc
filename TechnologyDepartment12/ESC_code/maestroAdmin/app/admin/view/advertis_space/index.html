{include file="header" /}
    <!-- Panel Other -->
    <div class="ibox float-e-margins">
        <div class="ibox-title">
            <h5>图表设置</h5>
        </div>
        <div class="ibox-content">
            <div class="form-group clearfix col-sm-1" style="display: flex;justify-content: space-around;width: 275px;">
                    {if authCheck('advertis_space/add') }
                        <a id="add" href="{:url('advertis_space/add')}">
                            <button class="btn btn-outline btn-primary" type="button">{:lang("添加图表数据")}</button>
                        </a>
                    {/if}
                    {if authCheck('advertis_space/update_stock') }
                        <a id="update" href="{:url('advertis_space/update_stock')}">
                            <button class="btn btn-outline btn-primary" type="button">{:lang("更新库存数量")}</button>
                        </a>
                    {/if}
            </div>
            <!--搜索框开始-->
            <form id='commentForm' role="form" method="post" class="form-inline pull-right">
                <div class="content clearfix m-b">
                    <div class="form-group">
                        <label>{:lang("库存名称")}：</label>
                        <input type="text" class="form-control" id="name" name="name">
                    </div>
                    <div class="form-group">
                        <button class="btn btn-primary" type="button" style="margin-top:5px" id="search"><strong>{:lang('搜索')}</strong>
                        </button>
                    </div>
                </div>
            </form>
            <!--搜索框结束-->
            <div class="example-wrap">
                <div class="example">
                    <table id="cusTable">
                        <thead>
                        <th data-field="advertis_name">{:lang("库存名称")}</th>
                        <th data-field="exposure">{:lang("总曝光量")}</th>
                        <th data-field="turnover">{:lang("成交量")}</th>
                        <th data-field="turnover_num">{:lang("成交笔数")}</th>
                        <th data-field="turnover_money">{:lang("成交金额")}</th>
                        <th data-field="cpm_cost_money">{:lang("CPM千次曝光平均成本")}</th>
                        <th data-field="create_time">{:lang("添加时间")}</th>
                        <th data-field="operate">{:lang("操作")}</th>
                        </thead>
                    </table>
                </div>
            </div>
            <!-- End Example Pagination -->
        </div>
    </div>
<script type="text/javascript">
    $(document).ready(function () {
        initTable();
        //当点击查询按钮的时候执行
        $("#search").bind("click", initTable);
    });
    function queryParams(params) {   //设置查询参数
        params.searchText = $('#name').val()
        return params;
    }
    function stateFormatter(value, row, index) {
        if (row.thumb) {
            return '<img src="'+row.thumb+'" style="height:16px;" /> ' + value;
        }
        console.log(row)
        return value;
    }
    function onLoadSuccess(res) {
        $("#add").on('click',function (e){
            add(e.currentTarget.href,'添加/编辑')
            return false;
        });
        $("#update").on('click',function (e){
            add(e.currentTarget.href,'更新库存数量')
            return false;
        });
         $("td a").on('click', function (e) {
            if (e.currentTarget.href.indexOf('javascript') === -1) {
                add(e.currentTarget.href)
                return false;
            }
            return true;
        });
    }
    function add(url,title){
        // 在此处输入 layer 的任意代码
        layer.open({
            type: 2,
            area: ['100%', '100%'],
            title: title,
            maxmin: true, // 允许全屏最小化
            anim: 0, // 0-6 的动画形式，-1 不开启
            content: url
        });
    }
</script>
{include file="footer" /}
