{include file="header" /}
    <!-- Panel Other -->
    <div class="ibox float-e-margins">
        <div class="ibox-title">
            <h5>{$title|lang}</h5>
        </div>
        <div class="ibox-content">
            <div class="form-group clearfix col-sm-1">
                {if authCheck('articles/add')}
                <a id="add" href="{:url('articles/add')}"><button class="btn btn-outline btn-primary" type="button">{:lang("添加文章")}</button></a>
                {/if}
            </div>
            <!--搜索框开始-->
            <form id='commentForm' role="form" method="post" class="form-inline pull-right">
                <div class="content clearfix m-b">
                    <div class="form-group">
                        <label>{:lang("文章类型")}：</label>
                        <select class="form-control" id="type" name="type">
                            <option value="">所有</option>
                            {volist name='article_types' id='text'}
                            <option value="{$key}">{$text|lang}</option>
                            {/volist}
                        </select>
                    </div>
                    <div class="form-group">
                        <label>{:lang("文章标题")}：</label>
                        <input type="text" class="form-control" id="title" name="title">
                    </div>
                    <div class="form-group">
                        <button class="btn btn-primary" type="button" style="margin-top:5px" id="search"><strong>{:lang('搜索')}</strong>
                        </button>
                    </div>
                </div>
            </form>
            <!--搜索框结束-->

            <div class="example-wrap">
                <div class="example">
                    <table id="cusTable">
                        <thead>
                            <th data-field="sort">{:lang("排序")}</th>
                            <th data-field="lang">{:lang("语言")}</th>
                            <th data-field="title" data-formatter="stateFormatter">{:lang("文章标题")}</th>
                            <th data-field="status">{:lang("状态")}</th>
                            <th data-field="type">{:lang("文章类型")}</th>
                            <th data-field="create_time">{:lang("添加时间")}</th>
                            <th data-field="update_time">{:lang("更新时间")}</th>
                            <th data-field="operate">{:lang("操作")}</th>
                        </thead>
                    </table>
                </div>
            </div>
            <!-- End Example Pagination -->
        </div>
    </div>
<script type="text/javascript">
    $(document).ready(function () {
        initTable();
        //当点击查询按钮的时候执行
        $("#search").bind("click", initTable);
    });
    function queryParams(params) {   //设置查询参数
        params.searchText = $('#title').val();
        params.lang = $('#lang').val();
        params.type = $('#type').val();
        return params;
    }
    function stateFormatter(value, row, index) {
        if (row.thumb) {
            return '<img src="'+row.thumb+'" style="height:16px;" /> ' + value;
        }
        console.log(row)
        return value;
    }
    function del(id){
        layer.confirm('确认删除?', {icon: 3, title:'提示'}, function(index){
            //do something
            $.getJSON("{:url('articles/del')}", {'id' : id}, function(res){
                if(1 == res.code){
                    layer.alert(res.msg, {title: "{:lang('友情提示')}", icon: 1, closeBtn: 0}, function(inx){
                        layer.close(inx);
                        initTable();
                    });
                }else if(111 == res.code){
                    window.location.reload();
                }else{
                    layer.alert(res.msg, {title: "{:lang('友情提示')}", icon: 2});
                }
            });

            layer.close(index);
        })
    }
    function onLoadSuccess(res) {
        $("#add").on('click',function (e){
            add(e.currentTarget.href)
            return false;
        });
         $("td a").on('click', function (e) {
            if (e.currentTarget.href.indexOf('javascript') === -1) {
                add(e.currentTarget.href)
                return false;
            }
            return true;
        });
    }
    function add(url){
        // 在此处输入 layer 的任意代码
        layer.open({
            type: 2,
            area: ['100%', '100%'],
            title: '添加/编辑',
            maxmin: true, // 允许全屏最小化
            anim: 0, // 0-6 的动画形式，-1 不开启
            content: url
        });
    }
</script>
{include file="footer" /}
