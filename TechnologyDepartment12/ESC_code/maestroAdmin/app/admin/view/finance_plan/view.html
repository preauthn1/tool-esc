{include file="header" /}
    <!-- Panel Other -->
    <div class="ibox float-e-margins">
        <div class="ibox-title">
            <h5>{:lang("计划任务详情")}</h5>
        </div>
        <div class="ibox-content">
            <div class="form-group clearfix col-sm-12">
                <a href="javascript:add('');">
                    <button class="btn btn-outline btn-primary" type="button">{:lang("添加")}</button>
                </a>
                <a href="javascript:delAll();">
                    <button class="btn btn-outline btn-danger" type="button">{:lang("删除")}</button>
                </a>
            </div>
            <!--搜索框开始-->
            <form id='commentForm' role="form" method="post" class="form-inline pull-right">
                <div class="content clearfix m-b">
                    <div class="form-group">
                        <label>{:lang("排序")}：</label>
                        <input type="text" class="form-control" id="sort" name="sort">
                    </div>
<!--                    <div class="form-group">-->
<!--                        <label>{:lang("选择时间")}：</label>-->
<!--                        <input type="text" class="form-control" id="start_time" name="startTime" value="{:getYesterdayStr()}" placeholder="yyyy-MM-dd" lay-key="1" autocomplete="off">-->
<!--                        - -->
<!--                        <input type="text" class="form-control" id="end_time" name="endTime" value="{:getDateStr()}" placeholder="yyyy-MM-dd" lay-key="2" autocomplete="off">-->
<!--                    </div>-->
                    <div class="form-group">
                        <button class="btn btn-primary" type="button" style="margin-top:5px" id="search"><strong>{:lang('搜索')}</strong>
                        </button>
                    </div>
                </div>
            </form>
            <!--搜索框结束-->
            <div class="example-wrap">
                <div class="example">
                    <table id="cusTable">
                        <thead>
                        <th data-checkbox="true"></th><!--复选框-->
                        <th data-field="id">{:lang("ID")}</th>
                        <th data-field="sort">{:lang("排序")}</th>
                        <th data-field="cycle">{:lang("投资天数")}</th>
                        <th data-field="profit">{:lang("每日收益率")}%</th>
                        <th data-field="rate">{:lang("占余额比例")}%</th>
                        <th data-field="create_time">{:lang("添加时间")}</th>
                        <th data-field="operate">{:lang("操作")}</th>
                        </thead>
                    </table>
                </div>
            </div>
        </div>
    </div>
<script type="text/javascript">
    tableCheckbox = true;
    index_url = "{:url('view')}";
    $(document).ready(function () {
        initTable();
        //当点击查询按钮的时候执行
        $("#search").bind("click", initTable);
    });
    function queryParams(params) {   //设置查询参数
        params.plan_id = "{$plan_id}";
        params.sort = $('#sort').val();
        params.startTime = $('#start_time').val();
        params.endTime = $('#end_time').val();
        return params;
    }
    function add(id=''){
        layer.open({
            type: 2,
            shade: false,
            area: ['800px', '550px'],//自定义文本域宽高
            maxmin: true,
            content: "{:url('addItem')}?id="+id+"&plan_id="+"{$plan_id}",
            zIndex: layer.zIndex, //重点1
            success: function(layero){
                layer.setTop(layero); //重点2
            }
        });
    }
    function delAll(){
        var getSelectRows = $("#cusTable").bootstrapTable('getSelections', function (row) {
            return row;
        });
        var ids = new Array();  // 定义js数组用于存放自己所需的值
        for(var i=0;i<getSelectRows.length;i++){
            ids[i] = getSelectRows[i].id;
        }
        if (ids.length <= 0) {
            layer.msg('请选择要操作的计划');
            return;
        }
        layer.confirm('确认操作吗?', {icon: 3, title:'提示'}, function(index){
            $.getJSON("{:url('finance_plan/delItem')}", {'id' : ids}, function(res){
                if(1 == res.code){
                    layer.alert(res.msg, {title: "{:lang('友情提示')}", icon: 1, closeBtn: 0}, function(inx){
                        layer.close(inx);
                        initTable();
                    });
                }else if(111 == res.code){
                    window.location.reload();
                }else{
                    layer.alert(res.msg, {title: "{:lang('友情提示')}", icon: 2});
                }
            });

            layer.close(index);
        })
    }
</script>
{include file="footer" /}
