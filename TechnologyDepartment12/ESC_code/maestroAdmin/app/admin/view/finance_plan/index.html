{include file="header" /}
    <!-- Panel Other -->
    <div class="ibox float-e-margins">
        <div class="ibox-title">
            <h5>{:lang("计划任务")}</h5>
        </div>
        <div class="ibox-content">
            <div class="form-group clearfix col-sm-7">
                <a id="add" href="{:url('finance_plan/add')}">
                    <button class="btn btn-outline btn-primary" type="button">{:lang("添加")}</button>
                </a>
                <a href="javascript:;" onclick="delAll();">
                    <button class="btn btn-outline btn-danger" type="button">{:lang("删除")}</button>
                </a>
            </div>
            <!--搜索框开始-->
            <form id='commentForm' role="form" method="post" class="form-inline pull-right">
                <div class="content clearfix m-b">
                    <div class="form-group">
                        <label>{:lang("计划名称")}：</label>
                        <input type="text" class="form-control" id="name" name="name">
                    </div>
                    <div class="form-group">
                        <label>{:lang("选择时间")}：</label>
                        <input type="text" class="form-control" id="start_time" name="startTime" value="" placeholder="yyyy-MM-dd" lay-key="1" autocomplete="off">
                        -
                        <input type="text" class="form-control" id="end_time" name="endTime" value="" placeholder="yyyy-MM-dd" lay-key="2" autocomplete="off">
                    </div>
                    <div class="form-group">
                        <button class="btn btn-primary" type="button" style="margin-top:5px" id="search"><strong>{:lang('搜索')}</strong>
                        </button>
                    </div>
                </div>
            </form>
            <!--搜索框结束-->
            <div class="example-wrap">
                <div class="example">
                    <table id="cusTable">
                        <thead>
                        <th data-checkbox="true"></th><!--复选框-->
                        <th data-field="id">{:lang("ID")}</th>
                        <th data-field="name" >{:lang("名称")}</th>
                        <th data-field="type_str">{:lang("类型")}</th>
                        <th data-field="cycle">{:lang("投资天数")}</th>
                        <th data-field="num">{:lang("广告位个数")}</th>
                        <th data-field="profit">{:lang("每日收益率")}%</th>
                        <th data-field="rate">{:lang("占余额比例")}%</th>
                        <th data-field="start_time">{:lang("开始时间")}</th>
                        <th data-field="end_time">{:lang("结束时间")}</th>
                        <th data-field="create_time">{:lang("添加时间")}</th>
                        <th data-field="status" data-formatter="statusFormatter">{:lang("状态")}</th>
                        <th data-field="operate">{:lang("操作")}</th>
                        </thead>
                    </table>
                </div>
            </div>
        </div>
    </div>
<script type="text/javascript">
  function statusFormatter(value, row, index) {
    let checkbox = '';
    let checked = row.status ? 'checked' : ''
    checkbox = '  <div class="layui-form"><input type="checkbox" name="agreement" value="1" title="开启|关闭" lay-skin="switch" data-type="status" data-id="'+row.id+'" data-val="'+row.status+'" lay-filter="changeStatus"'+ checked +'></div>';
    return [
      checkbox
    ].join('');
  }
    tableCheckbox = true;
    $(document).ready(function () {
        initTable();
        //当点击查询按钮的时候执行
        $("#search").bind("click", initTable);

      layui.use(['laydate', 'form'], function(){
        var form = layui.form;
        var laydate = layui.laydate;
        laydate.render({
          elem: '#start_time'
          ,trigger: 'click'
        });
        laydate.render({
          elem: '#end_time'
          ,trigger: 'click'
        });

        // checkbox 事件
        form.on('switch(changeStatus)', function(data){
          var elem = data.elem; // 获得 checkbox 原始 DOM 对象
          let type = elem.dataset.type
          let id = elem.dataset.id
          let val = elem.dataset.val

          // 发起请求
          let url = "{:url('changeStatus')}"
          index = layer.load(0);
          $.ajax({
            type: 'POST',
            url: url,
            data: {
              id:id,
              type: type,
              val: val
            },
            dataType: 'json',
            success: function (res) {
              layer.closeLast('loading');
              // 循环语言
              layer.msg(res.msg)
            },
            error: function (xhr, type) {
              layer.closeLast('loading');
            }
          });
        });
      });
    });
    function queryParams(params) {   //设置查询参数
        params.name = $('#name').val();
        params.startTime = $('#start_time').val();
        params.endTime = $('#end_time').val();
        params.loop = $('#loop').val();
        return params;
    }

    function delAll(){
        var getSelectRows = $("#cusTable").bootstrapTable('getSelections', function (row) {
            return row;
        });
        var ids = new Array();  // 定义js数组用于存放自己所需的值
        for(var i=0;i<getSelectRows.length;i++){
            ids[i] = getSelectRows[i].id;
        }
        if (ids.length <= 0) {
            layer.msg('请选择要操作的计划');
            return;
        }
        layer.confirm('确认操作吗?', {icon: 3, title:'提示'}, function(index){
            $.getJSON("{:url('finance_plan/del')}", {'id' : ids}, function(res){
                if(1 == res.code){
                    layer.alert(res.msg, {title: "{:lang('友情提示')}", icon: 1, closeBtn: 0}, function(inx){
                        layer.close(inx);
                        initTable();
                    });
                }else if(111 == res.code){
                    window.location.reload();
                }else{
                    layer.alert(res.msg, {title: "{:lang('友情提示')}", icon: 2});
                }
            });

            layer.close(index);
        })
    }

    function onLoadSuccess(res) {
        $("#add").on('click',function (e){
            add(e.currentTarget.href)
            return false;
        });
        $("td a").on('click',function (e){
            add(e.currentTarget.href)
            return false;
        });
    }
    function add(url){
        // 在此处输入 layer 的任意代码
        layer.open({
            type: 2,
            area: ['100%', '100%'],
            title: '添加/编辑',
            maxmin: true, // 允许全屏最小化
            anim: 0, // 0-6 的动画形式，-1 不开启
            content: url
        });
    }
</script>
{include file="footer" /}
