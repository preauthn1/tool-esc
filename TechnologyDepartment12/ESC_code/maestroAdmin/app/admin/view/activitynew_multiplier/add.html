    {include file="header" /}
    <div class="row">
        <div class="col-sm-12">
            <div class="ibox float-e-margins">
                <div class="ibox-title">
                    <h5>{:lang("添加")}</h5>
                </div>
                <div class="ibox-content">
                    <form class="form-horizontal m-t" id="dataForm" method="post">
                        <input type="hidden" name="id" value="{$info.id}"/>
                        <div class="form-group">
                            <label class="col-sm-3 control-label">{:lang("用户 ID")}：</label>
                            <div class="input-group col-sm-4">
                                <input type="text" class="form-control" value="{$info.id}" name="id" id="id" required />
                            </div>
                        </div>
                        <div class="form-group">
                            <label class="col-sm-3 control-label">{:lang("倍数")}：</label>
                            <div class="input-group col-sm-4">
                                <input type="number" class="form-control" value="{$info.reward_multiplier}" name="reward_multiplier" id="reward_multiplier" step="0.1" min="1" required />
                                <span class="input-group-addon">倍</span>
                            </div>
                        </div>
                        <div class="form-group">
                            <div class="col-sm-4 col-sm-offset-6">
                                <button class="btn btn-primary" type="submit">{:lang("提交")}</button>
                                <a href="{:url('index')}" class="btn btn-default">{:lang("返回")}</a>
                            </div>
                        </div>
                    </form>
                </div>
            </div>

        </div>
    </div>
<script type="text/javascript">
    $(document).ready(function(){
        $('#dataForm').on('submit', function(e){
            e.preventDefault();
            var id = $('#id').val();
            var reward_multiplier = $('#reward_multiplier').val();
            
            if (!id) {
                layer.msg('{:lang("请选择用户")}', {icon: 2});
                return false;
            }
            
            if (!reward_multiplier || reward_multiplier <= 1) {
                layer.msg('{:lang("请填写倍数大于 1")}', {icon: 2});
                return false;
            }
            
            var loading = layer.load(2);
            $.ajax({
                url: "{:url('add')}",
                type: 'POST',
                data: $(this).serialize(),
                dataType: 'json',
                success: function(res){
                    layer.close(loading);
                    if(res.code == 1){
                        layer.msg(res.msg, {icon: 1, time: 1000}, function(){
                            var index = parent.layer.getFrameIndex(window.name);
                            parent.location.reload();
                            parent.layer.close(index);
                        });
                    }else{
                        layer.msg(res.msg, {icon: 2});
                    }
                },
                error: function(){
                    layer.close(loading);
                    layer.msg('{:lang("请求失败")}', {icon: 2});
                }
            });
            return false;
        });
    });
</script>

{include file="footer" /}
