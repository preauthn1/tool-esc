{include file="header" /}
<!-- Panel Other -->
<div class="ibox float-e-margins">
    <div class="ibox-title">
        <h5>用户收益</h5>
    </div>
<div class="ibox-content">
    <div id="toolbar">
        <div id="stats" style=' float: left; padding: 8px 12px'></div>
    </div>
<form id='commentForm' role="form" method="post" class="form-inline pull-right" target="_blank" onkeydown="if (event.keyCode == 13) { return false; }">
<div class="content clearfix m-b">
    <div class="form-group">
        <label>{:lang("选择时间")}：</label>
        <div class="layui-inline" id="ID-laydate-range">
            <input type="text" class="form-control" id="start_time" name="startTime" placeholder="yyyy-MM-dd HH:mm:ss"
                   autocomplete="off">
            -
            <input type="text" class="form-control" id="end_time" name="endTime" placeholder="yyyy-MM-dd HH:mm:ss"
                   autocomplete="off">
        </div>
    </div>
<div class="form-group layui-form">
    <label>{:lang("所属代理")}：</label>
<div class="layui-inline">
<select lay-search="" id="leader1" name="leader1">
    <option value="">所有</option>
{foreach name="agent" item="vo"}
<option value="{$vo.id}">{$vo.id}/{$vo.user_name}{$vo.remark? '('.$vo.remark.')' : ''}
</option>
{/foreach}
</select>
</div>
</div>

<div class="form-group">
<label>{:lang("用户类型")}：</label>
<select class="form-control" id="is_xuni" name="is_xuni">
    <option value="-1">{:lang("所有")}</option>
<option value="1">{:lang("虚拟用户")}</option>
    <option value="0">{:lang("真实用户")}</option>
</select>
</div>
<div class="form-group">
<label>{:lang("用户名称")}：</label>
    <input type="text" class="form-control" id="user_name" name="user_name" value=""
           placeholder="{:lang('用户名')}">
</div>
<div class="form-group">
<label>{:lang("用户ID")}：</label>
    <input type="text" class="form-control" id="user_id" name="user_id" value=""
    placeholder="{:lang('用户ID')}">
</div>
<div class="form-group">
    <input type="hidden" value="1" name="export"/>
    <button class="btn btn-primary" type="button" style="margin-top:5px" id="search"><strong>{:lang('搜索')}</strong>
    </button>
<button class="btn btn-danger" type="submit" style="margin-top:5px" id="export"><strong>{:lang("导出")}</strong>
</button>
</div>
</div>
</form>
<div class="example-wrap">
<div class="example">
<table id="cusTable">
<thead>
<th data-field="id">{:lang("ID")}</th>
<th data-field="user_name">{:lang("用户名")}</th>
<th data-field="top_leader_remark">{:lang("所属代理")}</th>
<th data-field="day_invite_income">{:lang("当日直推奖励")}</th>
<th data-field="week_invite_income">{:lang("当周直推奖励")}</th>
<th data-field="month_invite_money">{:lang("当月直推奖励")}</th>
<th data-field="day_active_income">{:lang("直推任务")}</th>
<th data-field="sign_in_income">{:lang("签到奖励")}</th>
<th data-field="balance_income">{:lang("AI智能托管收益")}</th>
<th data-field="is_xuni">{:lang("虚拟账户")}</th>
</thead>
</table>
</div>
</div>
    <!-- End Example Pagination -->
</div>
</div>

<script type="text/javascript">
index_url = "{:url('income')}"

function queryParams(params) {   //设置查询参数
    params.type = $('#type').val();
    params.user_name = $('#user_name').val();
    params.user_id = $('#user_id').val();
    params.user_type = $('#user_type').val();
    params.leader1 = $('#leader1').val();
    params.is_xuni = $('#is_xuni').val();
    params.startTime = $('#start_time').val();
    params.endTime = $('#end_time').val();
    return params;
}

function onLoadSuccess(res) {
    var stathtml = '';
    if (res.stat) {
        $.each(res.stat, function (i, v) {
            stathtml += '<span class="label label-success">' + v.text + '：' + v.total + '</span> ';
        });
    }
    $("#stats").html(stathtml);

}

$(document).ready(function () {
layui.use('laydate', function () {
    var laydate = layui.laydate;
    // 日期范围 - 左右面板独立选择模式
    laydate.render({
        elem: '#ID-laydate-range',
        range: ['#start_time', '#end_time'],
        rangeLinked: true, // 开启日期范围选择时的区间联动标注模式 ---  2.8+ 新增
        type: 'datetime',
    });
});
    initTable();
    $("#search").on("click", function () {
        initTable();
    });
});
</script>
{include file="footer" /}
