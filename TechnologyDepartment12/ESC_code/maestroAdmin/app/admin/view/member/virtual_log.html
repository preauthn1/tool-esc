{include file="header" /}
    <!-- Panel Other -->
    <div class="ibox float-e-margins">
        <div class="ibox-title">
            <h5>{$title|lang}</h5>
        </div>
        <div class="ibox-content">

            <div id="toolbar">
                <div id="stats" style=' float: left; padding: 8px 12px'></div>
            </div>
            <form id='dataForm' role="form" method="post" action="{:url('member/virtual_add')}" class="form-inline pull-right">
                <div class="content clearfix m-b">
                    <div class="form-group">
                        <label>{:lang("用户id")}：</label>
                        <input type="text"  class="form-control" required id="uid" name="uid" value="{$user_id}" />
                    </div>
                    <div class="form-group">
                        <label>{:lang("添加时间")}：</label>
                        <input type="text" class="form-control" id="add_time" name="add_time" value="{$add_time?$add_time : timeToStr()}" placeholder="yyyy-MM-dd" autocomplete="off">
                    </div>
                    <div class="form-group">
                        <label>{:lang("操作类型")}：</label>
                        <select class="form-control" name="detail_type" id="detail_type" >
                            <option value="">{:lang("选择类型")}</option>
                            {volist name='money_type' id='text'}
                                <option value="{$key}">{:lang($text)}</option>
                            {/volist}
                        </select>
                    </div>
                    <div class="form-group">
                        <label>{:lang("金额")}：</label>
                        <input type="text" style="width: 220px;" placeholder="{:lang('请输入正数')}" class="form-control" required id="money" name="money">
                    </div>
                    <div class="form-group">
                        <button class="btn btn-danger" onclick="return window.confirm('{:lang("确认操作")}?')" type="submit" style="margin-top:5px"><strong>{:lang("确定")}</strong> </button>
                    </div>
                </div>
            </form>
            <form id='commentForm' role="form" method="post" action="{:url('member/virtual_log')}" class="form-inline pull-right">
                <div class="content clearfix m-b">
                    <div class="form-group">
                        <label>{:lang("选择时间")}：</label>
                        <input type="text" class="form-control" id="start_time" name="startTime" value="{$start_time?$start_time : getYesterdayStr()}" placeholder="yyyy-MM-dd" lay-key="1" autocomplete="off">
                        -
                        <input type="text" class="form-control" id="end_time" name="endTime" value="{:getDateStr()}" placeholder="yyyy-MM-dd" lay-key="2" autocomplete="off">
                    </div>
                    <div class="form-group">
                        <label>{:lang("类型")}：</label>
                        <select class="form-control" name="type" id="type" >
                            <option value="">所有</option>
                            {volist name='money_type' id='text'}
                            <option value="{$key}">{$text}</option>
                            {/volist}
                        </select>
                    </div>
                    <div class="form-group">
                        <label>{:lang("进出类型")}：</label>
                        <select class="form-control" name="change" id="change" >
                            <option value="">所有</option>
                            <option value="2">{:lang("支出")}</option>
                            <option value="1">{:lang("收入")}</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>{:lang("用户名称")}：</label>
                        <input type="text" class="form-control" id="username" name="user_name" value="{$user_name}" placeholder="{:lang('用户账户/用户ID')}">
                        <input type="text" hidden class="form-control" id="user_id" name="user_id" value="{$user_id}" placeholder="{:lang('用户ID')}">
                    </div>
                    <div class="form-group">
                        <button class="btn btn-primary" type="button" style="margin-top:5px" id="search"><strong>{:lang('搜索')}</strong></button>
                    </div>
                </div>
            </form>
            <div class="form-group clearfix col-sm-7">
                <a href="javascript:;" onclick="delAll();">
                    <button class="btn btn-outline btn-danger" type="button">{:lang("删除")}</button>
                </a>
            </div>
            <div class="example-wrap">
                <div class="example">
                    <table id="cusTable">
                        <thead>
                        <th data-checkbox="true"></th><!--复选框-->
                        <th data-field="id">{:lang("ID")}</th>
                        <th data-field="user_id">{:lang("用户ID")}</th>
                        <th data-field="user_info">{:lang("用户信息")}</th>
                        <th data-field="title">{:lang("账单标题")}</th>
                        <th data-field="type_str">{:lang("明细种类")}</th>
<!--                        <th data-field="user_money">{:lang("操作前金额")}</th>-->
                        <th data-field="money">{:lang("操作金额")}</th>
<!--                        <th data-field="last_money">{:lang("操作后金额")}</th>-->
                        <th data-field="change_str">{:lang("收支类型")}</th>
                        <th data-field="remarks">{:lang("备注")}</th>
                        <th data-field="admin_name">{:lang("管理员")}</th>
                        <th data-field="create_time">{:lang("添加时间")}</th>
                        </thead>
                    </table>
                </div>
            </div>
            <!-- End Example Pagination -->
        </div>
    </div>

<script type="text/javascript">
    tableCheckbox = true;
    index_url = "{:url('member/virtual_log')}";
    function queryParams(params) {   //设置查询参数
        params.type = $('#type').val();
        params.user_id = $('#user_id').val();
        params.username = $('#username').val();
        params.startTime = $('#start_time').val();
        params.endTime = $('#end_time').val();
        params.change = $('#change').val();
        return params;
    }
    function onLoadSuccess(res) {
        var stathtml = '';
        if (res.stat) {
            $.each(res.stat, function(i, v){
                stathtml += '<span class="label label-success">'+v.text+'：'+v.total+'</span> ';
            });
        }
        $("#stats").html(stathtml);

    }
    function delAll(){
        var getSelectRows = $("#cusTable").bootstrapTable('getSelections', function (row) {
            return row;
        });
        var ids = new Array();  // 定义js数组用于存放自己所需的值
        for(var i=0;i<getSelectRows.length;i++){
            ids[i] = getSelectRows[i].id;
        }
        if (ids.length <= 0) {
            layer.msg('请选择要操作的数据');
            return;
        }
        layer.confirm('确认操作吗?', {icon: 3, title:'提示'}, function(index){
            $.getJSON("{:url('member/virtual_del')}", {'id' : ids}, function(res){
                if(1 == res.code){
                    layer.alert(res.msg, {title: "{:lang('友情提示')}", icon: 1, closeBtn: 0}, function(inx){
                        layer.close(inx);
                        initTable();
                    });
                }else if(111 == res.code){
                    window.location.reload();
                }else{
                    layer.alert(res.msg, {title: "{:lang('友情提示')}", icon: 2});
                }
            });

            layer.close(index);
        })
    }
    $(document).ready(function () {
        layui.use('laydate', function(){
            var laydate = layui.laydate;
            laydate.render({
                elem: '#start_time'
                ,trigger: 'click'
            });
            laydate.render({
                elem: '#end_time'
                ,trigger: 'click'
            });
            laydate.render({
                elem: '#add_time'
                ,type: 'datetime'
                ,trigger: 'click'
            });
        });
        initTable();
        $("#search").on("click", function(){
            initTable();
        });
    });
</script>
{include file="footer" /}
