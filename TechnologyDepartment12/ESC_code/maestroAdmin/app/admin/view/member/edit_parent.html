    {include file="header" /}
    <div class="row">
        <div class="col-sm-8">
            <div class="ibox float-e-margins">
                <div class="ibox-title">
                    <h5>{:lang("修改上级ID")}</h5>
                </div>
                <div class="ibox-content">
                    <form class="form-horizontal m-t" id="dataForm2" method="post" action="{:url('edit_parent')}">
                        <input type="hidden" name="userid" value="{$user.id}">
                        <div class="form-group">
                            <label class="col-sm-3 control-label">{:lang("用户信息")}：</label>
                            <div class="input-group col-sm-4">
                                <p class="form-control-static">
                                    ID：{$user.id}<br>
                                    {:lang("用户名")}：{$user.user_name}
                                </p>
                            </div>
                        </div>
                        <div class="form-group">
                            <label class="col-sm-3 control-label">{:lang("上级信息")}：</label>
                            <div class="input-group col-sm-4">
                                <p class="form-control-static">ID：{$user.leader1}{if $user.parent}<br>{:lang("用户名")}：{$user.parent.user_name}{/if}</p>
                            </div>
                        </div>
                        <div class="form-group">
                            <label class="col-sm-3 control-label" style="color: red; font-weight: bold;">{:lang("影响用户数")}：</label>
                            <div class="input-group col-sm-4">
                                <p class="form-control-static" style="color: red; font-weight: bold;">{$child_count}</p>
                            </div>
                        </div>
                        <div class="form-group">
                            <label class="col-sm-3 control-label">{:lang("修改上级id")}：</label>
                            <div class="input-group col-sm-4">
                                <input type="text" class="form-control" name="leader1" required="" aria-required="true" value="">
                                <p class="help-block" style="color: red;">{:lang("请谨慎修改,修改后将影响该用户整条线")}</p>
                            </div>
                        </div>
                        <div class="form-group">
                            <div class="col-sm-4 col-sm-offset-6">
                                <button class="btn btn-primary" type="submit">{:lang("提交")}</button>
                            </div>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
{include file="footer" /}
<script>
$(document).ready(function(){
    // 提交订单
    $('#dataForm2').submit(function(){
        if (!window.confirm('{:lang("确定提交")}？')) {
            return false;
        }
        $(this).ajaxSubmit(formSubmitOptions);
        return false;
    });
});
</script>
