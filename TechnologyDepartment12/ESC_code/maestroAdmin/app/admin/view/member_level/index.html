    {include file="header" /}
    <!-- Panel Other -->
        <div class="ibox float-e-margins">
            <div class="ibox-title">
                <h5>升级记录</h5>
            </div>
            <div class="ibox-content">
                <!--搜索框开始-->
                <form id='commentForm' role="form" method="post" class="form-inline pull-left">

                    <div class="content clearfix m-b">
                        <div class="form-group">
                            <label>{:lang("用户id")}：</label>
                            <input type="text" class="form-control" id="user_id" name="user_id">
                        </div>
                        <div class="form-group">
                            <label>用户账号：</label>
                            <input type="text" class="form-control" id="user_name" name="user_name" value="{$user_name}" placeholder="用户账号">
                        </div>
                        <div class="form-group">
                            <label>添加时间：</label>
                            <input type="text" class="form-control" id="start_time" name="startTime" placeholder="yyyy-MM-dd"
                                   lay-key="1" autocomplete="off">
                            -
                            <input type="text" class="form-control" id="end_time" name="endTime" placeholder="yyyy-MM-dd"
                                   lay-key="2" autocomplete="off">
                        </div>

                        <div class="form-group">
                            <button class="btn btn-primary" type="button" style="margin-top:5px" id="search"><strong>搜 索</strong>
                            </button>
                        </div>
                    </div>
                </form>
                <!--搜索框结束-->
                <div class="example-wrap">
                    <div class="example">
                        <table id="cusTable">
                            <thead>
                            <th data-field="id">id</th>
                            <th data-field="user_name">用户信息</th>
                            <th data-field="from_level">原等级</th>
                            <th data-field="to_level">升级后等级</th>
                            <th data-field="money">花费金额</th>
{/*                            <th data-field="level_time">有效天数</th>*/}
                            <th data-field="level_type">有效类型</th>
                            <th data-field="level_end_time">到期时间</th>
                            <th data-field="create_time">添加时间</th>
                            </thead>
                        </table>
                    </div>
                </div>
                <!-- End Example Pagination -->
            </div>
        </div>

    <div id="ip-count-modal" style="display: none">
        <table id="ip-count" lay-filter="ip-count"></table>
    </div>

    <script type="text/html" id="toolEventDemo">
        <a class="layui-btn layui-btn-xs" lay-event="detail">查看</a>
    </script>
<script type="text/javascript">
    $(document).ready(function () {
      layui.use(['laydate', 'form', 'table'], function () {
        var form = layui.form;
        var laydate = layui.laydate;
          var table = layui.table;


        laydate.render({
          elem: '#start_time'
          , trigger: 'click'
        });
        laydate.render({
          elem: '#end_time'
          , trigger: 'click'
        });

          //单元格工具事件
          table.on('tool(ip-count)', function(obj){
              var data = obj.data; //获得当前行数据
              var layEvent = obj.event; //获得 lay-event 对应的值（也可以是表头的 event 参数对应的值）
              var tr = obj.tr; //获得当前行 tr 的 DOM 对象（如果有的话）

              if(layEvent === 'detail'){ //查看
                  layer.closeAll('page')
                  //do somehing
                  $('#user_name').val(data.user_name)
                  initTable()
              }
          })

      })
        initTable();
        //当点击查询按钮的时候执行
        $("#search").bind("click", initTable);




    });
    function queryParams(params) {   //设置查询参数
        params.user_name = $('#user_name').val()
        params.user_id = $('#user_id').val()
        params.ip = $('#ip').val()
        params.type = $('#type').val()
        params.startTime = $('#start_time').val();
        params.endTime = $('#end_time').val();
        return params;
    }


</script>
