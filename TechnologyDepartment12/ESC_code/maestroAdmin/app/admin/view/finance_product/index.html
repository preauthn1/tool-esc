{include file="header" /}
    <!-- Panel Other -->
    <div class="ibox float-e-margins">
        <div class="ibox-title">
            <h5>{:lang("投资产品")}</h5>
        </div>
        <div class="ibox-content">
            <div class="form-group clearfix col-sm-1">
                {if authCheck('finance_product/add') }
                <a id="add" href="{:url('finance_product/add', ['level_id' => $level_id])}">
                    <button class="btn btn-outline btn-primary" type="button">{:lang("新增")}</button>
                </a>
                {/if}
            </div>
            <!--搜索框开始-->
            <form id='commentForm' role="form" method="post" class="form-inline pull-right">
                <div class="content clearfix m-b">
                    <div class="form-group">
                        <label>{:lang("理财名称")}：</label>
                        <input type="text" class="form-control" id="product_name" name="product_name">
                    </div>
                    <div class="form-group">
                        <button class="btn btn-primary" type="button" style="margin-top:5px" id="search"><strong>{:lang('搜索')}</strong></button>
                    </div>
                </div>
            </form>
            <!--搜索框结束-->
            <div class="example-wrap">
                <div class="example">
                    <table id="cusTable"
                           data-total-field="total"
                           data-data-field="data">
                        <thead>
                        <th data-field="id">{:lang("id")}</th>
                        <th data-field="image">{:lang("产品图片")}</th>
                        <th data-field="product_name">{:lang("产品名称")}</th>
                        <th data-field="amount">{:lang("投资金额")}</th>
                        <th data-field="cycle">{:lang("投资天数")}</th>
                        <th data-field="profit">{:lang("每日收益率")}</th>
<!--                        <th data-field="profit_type">{:lang("收益类型")}</th>-->
                        <th data-field="level_id">{:lang("VIP等级")}</th>
<!--                        <th data-field="sales_status" data-formatter="salesStatusFormatter">{:lang("销售状态")}</th>-->
                        <th data-field="status" data-formatter="statusFormatter">{:lang("状态")}</th>
                        <th data-field="sort">{:lang("排序")}</th>
<!--                        <th data-field="rebate_type">{:lang("派息类型")}</th>-->
<!--                        <th data-field="rebate_time">{:lang("派息时间")}</th>-->
<!--                        <th data-field="is_shortly_rebate" data-formatter="isShortlyRebateFormatter">{:lang("立马派息")}</th>-->
                        <th data-field="operate">{:lang("操作")}</th>
                        </thead>
                    </table>
                </div>
            </div>
            <!-- End Example Pagination -->
        </div>
    </div>
<!-- End Panel Other -->
<script type="text/javascript">

    function salesStatusFormatter(value, row, index) {
        let checkbox = '';
        let checked = row.sales_status ? 'checked' : ''
        checkbox = '  <div class="layui-form"><input type="checkbox" name="sales_status" value="1" title="开启|关闭" lay-skin="switch" data-type="sales_status" data-id="'+row.id+'" data-val="'+row.sales_status+'" lay-filter="changeStatus"'+ checked +'></div>';
        return [
            checkbox
        ].join('');
    }
    function statusFormatter(value, row, index) {
        let checkbox = '';
        let checked = row.status ? 'checked' : ''
        checkbox = '  <div class="layui-form"><input type="checkbox" name="status" value="1" title="开启|关闭" lay-skin="switch" data-type="status" data-id="'+row.id+'" data-val="'+row.status+'" lay-filter="changeStatus"'+ checked +'></div>';
        return [
            checkbox
        ].join('');
    }
    function isShortlyRebateFormatter(value, row, index) {
        let checkbox = '';
        let checked = row.status ? 'checked' : ''
        checkbox = '  <div class="layui-form"><input type="checkbox" name="is_shortly_rebate" value="1" title="开启|关闭" lay-skin="switch" data-type="is_shortly_rebate" data-id="'+row.id+'" data-val="'+row.is_shortly_rebate+'" lay-filter="changeStatus"'+ checked +'></div>';
        return [
            checkbox
        ].join('');
    }
    function queryParams(params) {
        params.product_name = $('#product_name').val();
        params.level_id = "{$level_id}";
        return params;
    }
    $(document).ready(function () {
        initTable();
        $("#search").bind("click", initTable);

        layui.use(['util', 'form'], function() {
            var util = layui.util;
            var form = layui.form;

            // checkbox 事件
            form.on('switch(changeStatus)', function(data){
                var elem = data.elem; // 获得 checkbox 原始 DOM 对象
                let type = elem.dataset.type
                let id = elem.dataset.id
                let val = elem.dataset.val

                // 发起请求
                let url = "{:url('changeStatus')}"
                index = layer.load(0);
                $.ajax({
                    type: 'POST',
                    url: url,
                    data: {
                        id:id,
                        type: type,
                        val: val
                    },
                    dataType: 'json',
                    success: function (res) {
                        layer.closeLast('loading');
                        // 循环语言
                        layer.msg(res.msg)
                    },
                    error: function (xhr, type) {
                        layer.closeLast('loading');
                    }
                });
            });
        });
    });
    function onLoadSuccess(res) {
        $("#add").on('click',function (e){
            add(e.currentTarget.href)
            return false;
        });
        $("td a").on('click', function (e) {
            if (e.currentTarget.href.indexOf('javascript') === -1) {
                add(e.currentTarget.href)
                return false;
            }
            return true;
        });
    }
    function add(url){
        // 在此处输入 layer 的任意代码
        layer.open({
            type: 2,
            area: ['100%', '100%'],
            title: '添加/编辑',
            maxmin: true, // 允许全屏最小化
            anim: 0, // 0-6 的动画形式，-1 不开启
            content: url
        });
    }

    function financeProductDel(id) {
        layer.confirm('确认删除此理财?', {icon: 3, title: '提示'}, function (index) {
            //do something
            $.getJSON("{:url('finance_product/financeProductDel')}", {'id': id}, function (res) {
                if (1 == res.code) {
                    layer.alert(res.msg, {title: "{:lang('友情提示')}", icon: 1, closeBtn: 0}, function (inx) {
                        layer.close(inx);
                        initTable();
                    });
                } else if (111 == res.code) {
                    window.location.reload();
                } else {
                    layer.alert(res.msg, {title: "{:lang('友情提示')}", icon: 2});
                }
            });
            layer.close(index);
        })
    }
</script>
{include file="footer" /}
