<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>设置广告位编码</title>
    <link rel="shortcut icon" href="{$admin_icon|toMedia}">
    <link href="/static/admin/css/bootstrap.min.css?v=3.3.6" rel="stylesheet">
    <link href="/static/admin/css/font-awesome.min.css?v=4.4.0" rel="stylesheet">
    <link href="/static/admin/css/animate.min.css" rel="stylesheet">
    <link href="/static/admin/css/style.min.css?v=4.1.0" rel="stylesheet">
    <link href="/static/admin/js/plugins/bootstrap-tagsinput/bootstrap-tagsinput.css" rel="stylesheet">
    <link href="/static/admin/js/layui/css/layui.css" rel="stylesheet">
    <style>
        .password-item {
            margin-bottom: 15px;
            padding: 15px;
            border: 1px solid #ddd;
            border-radius: 4px;
            background-color: #f9f9f9;
        }

        .password-item:hover {
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        }

        .mt-10 {
            margin-top: 10px;
        }

        .mb-20 {
            margin-bottom: 20px;
        }

        .expire-time-group {
            margin-top: 10px;
        }
    </style>
</head>
<body>
<form class="form-horizontal" role="form" method="post">
    <div class="ibox float-e-margins">
        <div class="ibox-title">
            <h5>{:lang('广告位编码设置')}</h5>
        </div>
        <div class="ibox-content">
            <!-- 编码设置列表 -->
            <div class="form-group mb-20">
                <div class="password-container">
                    {volist name="typeGroups" id="group" key="index"}
                    <div class="password-item">
                        <div class="row">
                            <div class="col-sm-4">
                                <label>{:lang('广告位类型')}：</label>
                                <div class="input-group">
                                    <span class="input-group-addon">{$group.type_name}</span>
                                    <input type="hidden" name="type[]" value="{$group.type}">
                                    <input type="text" id="invest_password_{$group.type}"
                                           class="form-control password-input" name="password[]"
                                           value="{$group.invest_password|default=''}" placeholder="{:lang('6位数字编码')}"
                                           maxlength="6" pattern="\d{6}" readonly>
                                    <span class="input-group-btn">
                                        <button type="button" class="btn btn-info generate-password"
                                                style="display: none;">{:lang('生成编码')}</button>
                                    </span>
                                </div>
                                {if $group['type'] == 0}
                                <div>
                                    <span style="color: red;">解锁广告位购买页面</span>
                                </div>
                                {/if}
                                <div class="expire-time-group">
                                    <label style="display: none;">{:lang('编码到期时间')}：</label>
                                    <div class="input-group" style="display: none;">
                                        <span class="input-group-addon"><i class="fa fa-calendar"></i></span>
                                        <input type="text" class="form-control expire-time-input" name="expire_time[]"
                                               value="{$group.password_expire_time|default=''}"
                                               placeholder="{:lang('选择编码到期时间')}" readonly>
                                    </div>
                                    <label>{:lang('编码有效期')}：</label>
                                    <div class="input-group mt-10">
                                        <input type="number" class="form-control minutes-input" name="minutes[]" min="1"
                                               id="password_refresh_frequency_{$group.type}"
                                               value="{$group.password_refresh_frequency|default=''}"
                                               placeholder="{:lang('输入编码有效期')}">
                                        <span class="input-group-addon">{:lang('分钟')}</span>
                                    </div>
                                    <!-- 添加倒计时显示 -->
                                    <div class="mt-10 countdown-display" data-type="{$group.type}">
                                        <label>{:lang('倒计时')}：</label>
                                        <span class="label label-warning countdown-timer"
                                              id="expire_time_str_{$group.type}"></span>
                                    </div>
                                    <div class="mt-10">
                                        <button type="button" id="up_password_{$group.type}"
                                                class="btn btn-success save-single-item" data-type="{$group.type}">
                                            {:lang('更新')}
                                        </button>
                                    </div>
                                </div>
                            </div>
                            <div class="col-sm-8">
                                <label>{:lang('包含广告位')}：</label>
                                <p>
                                    {volist name="group.levels" id="level"}
                                    <span class="label label-info">{$level.level_name}</span>
                                    {/volist}
                                </p>
                            </div>
                        </div>
                    </div>
                    {/volist}
                </div>
            </div>

            <!-- 提交按钮 -->
            <!-- <div class="form-group">
                <div class="col-sm-4 col-sm-offset-4">
                    <button type="button" id="submitBtn" class="btn btn-primary btn-lg">{:lang('保存配置')}</button>
                </div>
            </div> -->
        </div>
    </div>
</form>

<script src="/static/admin/js/jquery.min.js?v=2.1.4"></script>
<script src="/static/admin/js/layui/layui.js"></script>
<script type="text/javascript">
    // Store server timezone
    const serverTimezone = '{:config("app.default_timezone")}';

    $(function () {
        // 生成随机6位数编码
        function generateRandomPassword() {
            let password = '';
            for (let i = 0; i < 6; i++) {
                password += Math.floor(Math.random() * 10);
            }
            return password;
        }

        // 生成随机编码
        $(document).on('click', '.generate-password', function () {
            const password = generateRandomPassword();
            $(this).closest('.input-group').find('.password-input').val(password);
        });

        // 验证编码格式
        $(document).on('input', '.password-input', function () {
            this.value = this.value.replace(/\D/g, '').substr(0, 6);
        });

        // 初始化日期时间选择器
        layui.use('laydate', function () {
            var laydate = layui.laydate;

            // 为每个到期时间输入框初始化日期时间选择器
            $('.expire-time-input').each(function () {
                laydate.render({
                    elem: this,
                    type: 'datetime',
                    format: 'yyyy-MM-dd HH:mm:ss',
                    trigger: 'click'
                });
            });
        });

        // 单个项目保存
        $(document).on('click', '.save-single-item', function () {
            const type = $(this).data('type');
            const passwordItem = $(this).closest('.password-item');

            const minutes = passwordItem.find('.minutes-input').val();

            // 验证分钟数
            if (!isNaN(minutes) && minutes <= 0) {
                layer.msg('{:lang("请输入有效的编码有效期")}', {icon: 2});
                return;
            }

            // 生成新的随机6位数编码
            const password = generateRandomPassword();
            passwordItem.find('.password-input').val(password);

            // 验证编码
            if (password.length !== 6) {
                layer.msg('{:lang("编码必须是6位数字")}', {icon: 2});
                return;
            }
            const formattedDate = passwordItem.find('.expire-time-input').val()
            // 构建单项保存数据
            const formData = {
                type: [type],
                password: [password],
                expire_time: [formattedDate],
                minutes: [minutes]
            };

            // 显示加载提示
            var loadIndex = layer.load(1, {
                shade: [0.3, '#fff']
            });

            // 发送AJAX请求
            $.ajax({
                url: '{:url("level/level_password_update")}',
                type: 'POST',
                data: formData,
                dataType: 'json',
                success: function (res) {
                    layer.close(loadIndex);
                    if (res.code == 1) {
                        layer.msg(res.msg || '{:lang("保存成功")}', {icon: 1, time: 1500});
                        // 保存成功后重新初始化倒计时
                        // initAllCountdowns();
                    } else {
                        layer.msg(res.msg || '{:lang("保存失败")}', {icon: 2});
                    }
                },
                error: function () {
                    layer.close(loadIndex);
                    layer.msg('{:lang("网络错误，请稍后重试")}', {icon: 2});
                }
            });
        });

        getUpDate();
        setInterval(function () {
            getUpDate();
        }, 2000);

        function getUpDate() {
            $.ajax({
                url: '{:url("level/level_password")}',
                type: 'GET',
                data: [],
                dataType: 'json',
                success: function (res) {
                    // console.log(res.data[0].password_expire_time_str)
                    if (res.code == 1) {
                        for (var i = 0; i < res.data.length; i++) {
                            $("#invest_password_" + res.data[i].type).val(res.data[i].invest_password);
                            $("#expire_time_str_" + res.data[i].type).text(res.data[i].password_expire_time_str);
                            // $("#password_refresh_frequency_" + res.data[i].type).val(res.data[i].password_refresh_frequency);
                        }
                        // $("#invest_password_0").val(res.data[0].invest_password);
                        // $("#invest_password_1").val(res.data[1].invest_password);
                        // $("#invest_password_2").val(res.data[2].invest_password);
                        //
                        // $("#expire_time_str_0").text(res.data[0].password_expire_time_str)
                        // $("#expire_time_str_1").text(res.data[1].password_expire_time_str)
                        // $("#expire_time_str_2").text(res.data[2].password_expire_time_str)
                    }
                },
                error: function () {

                }
            });
        }
    });
</script>
</body>
</html>
