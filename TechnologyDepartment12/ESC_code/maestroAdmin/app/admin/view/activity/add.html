    {include file="header" /}
    <div class="row">
        <div class="col-sm-12">
            <div class="ibox float-e-margins">
                <div class="ibox-title">
                    <h5>{:lang("添加")}</h5>
                </div>
                <div class="ibox-content">
                    <form class="form-horizontal m-t" id="dataForm" method="post" action="{:url('add')}">
                        <input type="hidden" name="id" value="{$info.id}"/>
                        <div class="form-group">
                            <label class="col-sm-3 control-label">{:lang("活动标题")}：</label>
                            <div class="input-group col-sm-4">
                                <input type="text" class="form-control" value="{$info.title}" name="title" required />
                            </div>
                        </div>
                        <div class="form-group">
                            <label class="col-sm-3 control-label">{:lang("活动图片")}：</label>
                            <input name="thumb" id="img" value="{$info.thumb}" type="hidden" />
                            <div class="form-inline">
                                <div class="input-group col-sm-2">
                                    <button type="button" class="layui-btn" id="uploader">
                                        <i class="layui-icon">&#xe67c;</i>{:lang("上传图片")}
                                    </button>
                                </div>
                                <div class="input-group col-sm-3">
                                    <div id="sm">{if $info.thumb}<img src="{$info.thumb|toMedia}" style="width:40px; height: 40px;"/>{/if}</div>
                                </div>
                            </div>
                        </div>
                        <div class="form-group">
                            <label class="col-sm-3 control-label">{:lang("状态")}：</label>
                            <div class="input-group col-sm-4">
                                <select class="form-control" name="status">
                                    <option value="1" {if $info.status eq 1} selected {/if}>{:lang("启用")}</option>
                                    <option value="0" {if $info.status neq 1} selected {/if}>{:lang("停用")}</option>
                                </select>
                            </div>
                        </div>
                        <div class="form-group">
                            <label class="col-sm-3 control-label">{:lang("活动内容")}：</label>
                            <div class="input-group col-sm-7">
                                <script id="container" name="content" type="text/plain">{$info['content']|html_entity_decode}</script>
                            </div>
                        </div>
                        <div class="form-group">
                            <div class="col-sm-4 col-sm-offset-6">
                                <button class="btn btn-primary" type="submit">{:lang("提交")}</button>
                            </div>
                        </div>
                    </form>
                </div>
            </div>

        </div>
    </div>
<script type="text/javascript">
    $(document).ready(function(){
        var editor = UE.getEditor('container', {
            serverUrl:"{:url('articles/uploadimg')}",
        });
        layui.use('laydate', function(){
            var laydate = layui.laydate;
            laydate.render({
                elem: '#start_time'
                ,trigger: 'click'
            });
            laydate.render({
                elem: '#end_time'
                ,trigger: 'click'
            });
        });
    });
</script>

{include file="footer" /}
