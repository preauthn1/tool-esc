{include file="header" /}
<!-- Panel Other -->
<div class="ibox float-e-margins">
    <div class="ibox-title">
        <h5>{:lang("分享任务")}</h5>
    </div>
    <div class="ibox-content">
        <div class="form-group clearfix col-sm-7">
            <a href="javascript:;" onclick="checkAll(2);">
                <button class="btn btn-outline btn-primary" type="button">{:lang("通过")}</button>
            </a>
            <a href="javascript:;" onclick="checkAll(3);">
                <button class="btn btn-outline btn-danger" type="button">{:lang("拒绝")}</button>
            </a>
        </div>
        <!--搜索框开始-->
        <form id='commentForm' role="form" method="post" class="form-inline pull-right">
            <div class="content clearfix m-b">
                <div class="form-group">
                    <label>{:lang("账号类型")}：</label>
                    <select class="form-control" name="account_type" id="account_type">
                        <option value="">所有</option>
                        <!--                            1基础账户 3彩金账号 5佣金账号-->
                        <option value="1">{:lang("基础账户")}</option>
                        <option value="3">{:lang("彩金账号")}</option>
                        <option value="5">{:lang("佣金账号")}</option>
                    </select>
                </div>
                <div class="form-group">
                    <button class="btn btn-primary" type="button" style="margin-top:5px" id="search"><strong>{:lang('搜索')}</strong>
                    </button>
                </div>
            </div>
        </form>
        <div id="div_html" style="display: none">
            <form class="form-horizontal m-t">
                <div class="form-group">
                    <label class="col-sm-3 control-label"><span
                            class="x-red">*</span>{:lang("审核状态")}：</label>
                    <div class="input-group col-sm-6">
                        <div class="radio i-checks col-sm-4">
                            <label> <input type="radio" value="2" name="status" onchange="onStatus()">
                                <i></i>{:lang('通过')}</label>
                            <label> <input type="radio" value="3" name="status" onchange="onStatus()">
                                <i></i>{:lang('拒绝')}</label>
                        </div>
                    </div>
                </div>
                <div class="form-group">
                    <label class="col-sm-3 control-label">
                        <span class="x-red">*</span>{:lang("用户备注")}
                    </label>
                    <div class="input-group col-sm-4">
                        <input type="text" onchange="onExplain()" id="explain" name="explain"
                               value="" class="form-control">
                    </div>
                </div>
            </form>
        </div>
        <!--搜索框结束-->
        <div class="example-wrap">
            <div class="example">
                <table id="cusTable">
                    <thead>
                    <th data-checkbox="true"></th><!--复选框-->
                    <th data-field="id">{:lang("ID")}</th>
                    <th data-field="user_info">{:lang("用户信息")}</th>
                    <th data-field="remark">{:lang("用户备注")}</th>
                    <th data-field="img">{:lang("截图")}</th>
                    <th data-field="explain">{:lang("完成说明")}</th>
                    <th data-field="account_type_str">{:lang("奖励类型")}</th>
                    <th data-field="details">{:lang("奖励详情")}</th>
                    <th data-field="status_str">{:lang("审核状态")}</th>
                    <th data-field="create_time">{:lang("添加时间")}</th>
                    <th data-field="update_time">{:lang("最后更新时间")}</th>
                    <th data-field="check_time_str">{:lang("审核时间")}</th>
                    <th data-field="check_admin_str">{:lang("审核人")}</th>
                    </thead>
                </table>
            </div>
        </div>

    </div>
</div>
<script type="text/javascript">
    tableCheckbox = true;
    var open_html = $("#div_html").html();
    $("#div_html").remove();
    $(document).ready(function () {
        initTable();
        //当点击查询按钮的时候执行
        $("#search").bind("click", initTable);
    });

    function queryParams(params) {   //设置查询参数
        params.account_type = $('#account_type').val();
        return params;
    }

    function checkAll(status) {
        var getSelectRows = $("#cusTable").bootstrapTable('getSelections', function (row) {
            return row;
        });
        var ids = new Array();  // 定义js数组用于存放自己所需的值
        for (var i = 0; i < getSelectRows.length; i++) {
            ids[i] = getSelectRows[i].id;
        }
        if (ids.length <= 0) {
            layer.msg('请选择要操作的数据');
            return;
        }
        layer.prompt({
            formType: 0,
            value: '',
            title: ((status == 2) ? '通过审核' : '拒绝审核') + '--审核备注信息',
            area: ['600px', '350px'] //自定义文本域宽高
        }, function (value, index, elem) {
            $.getJSON("{:url('shareAudit/check')}", {'id': ids, 'remark': value, 'status': status}, function (res) {
                if (1 == res.code) {
                    layer.alert(res.msg, {title: "{:lang('友情提示')}", icon: 1, closeBtn: 0}, function (inx) {
                        layer.close(inx);
                        initTable();
                    });
                } else if (111 == res.code) {
                    window.location.reload();
                } else {
                    layer.alert(res.msg, {title: "{:lang('友情提示')}", icon: 2});
                }
            });
            layer.close(index);
        });
    }
</script>
{include file="footer" /}
