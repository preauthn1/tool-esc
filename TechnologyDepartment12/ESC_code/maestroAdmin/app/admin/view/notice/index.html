{include file="header" /}
    <!-- Panel Other -->
    <div class="ibox float-e-margins">
        <div class="ibox-title">
            <h5>{:lang("公告列表")}</h5>
        </div>
        <div class="ibox-content">
            <div class="form-group clearfix col-sm-1">
                {if authCheck('notice/add')}
                <a id="add" href="{:url('notice/add')}"><button class="btn btn-outline btn-primary" type="button">{:lang("添加公告")}</button></a>
                {/if}
            </div>

			<!--搜索框开始-->
			<form id='commentForm' role="form" method="post" class="form-inline pull-right">
			    <div class="content clearfix m-b">
			        <div class="form-group">
			            <label>{:lang("ID")}：</label>
			            <input type="text" class="form-control" id="id" name="id">
			        </div>
			        <div class="form-group">
			            <button class="btn btn-primary" type="button" style="margin-top:5px" id="search"><strong>{:lang('搜索')}</strong>
			            </button>
			        </div>
			    </div>
			</form>
			<!--搜索框结束-->


            <div class="example-wrap">
                <div class="example">
                    <table id="cusTable">
                        <thead>
                        <th data-field="id">{:lang("公告ID")}</th>
<!--                        <th data-field="lang">{:lang("语言")}</th>-->
<!--                        <th data-field="user_id">{:lang("用户ID")}</th>-->
                        <th data-field="content">{:lang("内容")}</th>
                        <th data-field="create_time">{:lang("添加时间")}</th>
                        <th data-field="status">{:lang("状态")}</th>
                        <th data-field="operate">{:lang("操作")}</th>
                        </thead>
                    </table>
                </div>
            </div>
            <!-- End Example Pagination -->
        </div>
    </div>
<script type="text/javascript">
    $(document).ready(function () {
        initTable();
        //当点击查询按钮的时候执行
        $("#search").bind("click", initTable);
    });
    function queryParams(params) {   //设置查询参数
        params.searchText = $('#id').val()
        return params;
    }
    function stateFormatter(value, row, index) {
        if (row.thumb) {
            return '<img src="'+row.thumb+'" style="height:16px;" /> ' + value;
        }
        console.log(row)
        return value;
    }
    function onLoadSuccess(res) {
        $("#add").on('click',function (e){
            add(e.currentTarget.href)
            return false;
        });
         $("td a").on('click', function (e) {
            if (e.currentTarget.href.indexOf('javascript') === -1) {
                add(e.currentTarget.href)
                return false;
            }
            return true;
        });
    }
    function add(url){
        // 在此处输入 layer 的任意代码
        layer.open({
            type: 2,
            area: ['100%', '100%'],
            title: '添加/编辑',
            maxmin: true, // 允许全屏最小化
            anim: 0, // 0-6 的动画形式，-1 不开启
            content: url
        });
    }
</script>
{include file="footer" /}
