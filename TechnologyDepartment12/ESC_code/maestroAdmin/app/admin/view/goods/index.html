{include file="header" /}
    <!-- Panel Other -->
    <div class="ibox float-e-margins">
        <div class="ibox-title">
            <h5>{:lang("商品列表")}</h5>
        </div>
        <div class="ibox-content">
            <div class="form-group clearfix col-sm-7">
                {if authCheck('goods/add') }
                <a id="add" href="{:url('goods/add')}">
                    <button class="btn btn-outline btn-primary" type="button">{:lang("添加商品")}</button>
                </a>
                {/if}
                {if authCheck('goods/checkstatus') }
                <a href="javascript:;" onclick="checkStatus(1, 1);">
                    <button class="btn btn-outline btn-primary" type="button">{:lang("批量上架")}</button>
                </a>
                <a href="javascript:;" onclick="checkStatus(2, 1);">
                    <button class="btn btn-outline btn-primary" type="button">{:lang("批量下架")}</button>
                </a>
                {/if}
            </div>
            <!--搜索框开始-->
            <form id='commentForm' role="form" method="post" class="form-inline pull-right">
                <div class="content clearfix m-b">
                    <div class="form-group">
                        <label>{:lang("可做VIP等级")}：</label>
                        <select class="form-control" name="level_id" id="levelId" >
                            <option value="">所有</option>
                            {volist name='level_list' id='v'}
                            <option value="{$key}">{$v}</option>
                            {/volist}
                        </select>
                    </div>
                    <div class="form-group">
                        <label>{:lang("商品名称")}：</label>
                        <input type="text" class="form-control" id="name" name="name">
                    </div>
                    <div class="form-group">
                        <button class="btn btn-primary" type="button" style="margin-top:5px" id="search"><strong>{:lang('搜索')}</strong>
                        </button>
                    </div>
                </div>
            </form>
            <!--搜索框结束-->
            <div class="example-wrap">
                <div class="example">
                    <table id="cusTable">
                        <thead>
                        <th data-checkbox="true"></th><!--复选框-->
                        <th data-field="id">{:lang("商品ID")}</th>
                        <th data-field="pic">{:lang("图片")}</th>
                        <th data-field="name" data-width='280'>{:lang("商品名称")}</th>
                        <th data-field="level_name">{:lang("可做VIP等级")}</th>
                        <th data-field="price">{:lang("价格")}</th>
                        <th data-field="status">{:lang("状态")}</th>
                        <th data-field="update_time">{:lang("更新时间")}</th>
                        <th data-field="sort">{:lang("排序")}</th>
                        <th data-field="operate">{:lang("操作")}</th>
                        </thead>
                    </table>
                </div>
            </div>
            <!-- End Example Pagination -->
        </div>
    </div>
<script type="text/javascript">
    tableCheckbox = true;
    $(document).ready(function () {
        initTable();
        //当点击查询按钮的时候执行
        $("#search").bind("click", initTable);
    });
    function queryParams(params) {   //设置查询参数
        params.name = $('#name').val();
        params.level_id = $('#levelId').val();
        return params;
    }

    function checkStatus(status, type = 0){
        var getSelectRows = $("#cusTable").bootstrapTable('getSelections', function (row) {
            return row;
        });
        var ids = new Array();  // 定义js数组用于存放自己所需的值
        for(var i=0;i<getSelectRows.length;i++){
            ids[i] = getSelectRows[i].id;
        }
        if (ids.length <= 0) {
            layer.msg('请选择要操作的商品');
            return;
        }
        layer.confirm('确认操作吗?', {icon: 3, title:'提示'}, function(index){
            $.getJSON("{:url('goods/checkStatus')}", {'id' : ids, 'status' : status, 'type' : type}, function(res){
                if(1 == res.code){
                    layer.alert(res.msg, {title: "{:lang('友情提示')}", icon: 1, closeBtn: 0}, function(inx){
                        layer.close(inx);
                        initTable();
                    });
                }else if(111 == res.code){
                    window.location.reload();
                }else{
                    layer.alert(res.msg, {title: "{:lang('友情提示')}", icon: 2});
                }
            });

            layer.close(index);
        })
    }
    function onLoadSuccess(res) {
        $("#add").on('click',function (e){
            add(e.currentTarget.href)
            return false;
        });
         $("td a").on('click', function (e) {
            if (e.currentTarget.href.indexOf('javascript') === -1) {
                add(e.currentTarget.href)
                return false;
            }
            return true;
        });
    }
    function add(url){
        // 在此处输入 layer 的任意代码
        layer.open({
            type: 2,
            area: ['100%', '100%'],
            title: '添加/编辑',
            maxmin: true, // 允许全屏最小化
            anim: 0, // 0-6 的动画形式，-1 不开启
            content: url
        });
    }
</script>
{include file="footer" /}
