<div class="form-group">
    <label class="col-sm-3 control-label">{:lang("开启自动存入余额宝")}：</label>
    <div class="input-group col-sm-4">
        <input type="text" class="form-control" name="auto_yuebao_current_open" value="{$config.auto_yuebao_current_open|default=0}">
        <p class="help-block">是否开启：0关闭，1用户当天抢单结束后N小时自动存入，2第二天凌晨N点自动存入</p>
    </div>
</div>
<div class="form-group">
    <label class="col-sm-3 control-label">{:lang("自动存入时间")}：</label>
    <div class="input-group col-sm-4">
        <input type="text" class="form-control" name="auto_yuebao_time" value="{$config.auto_yuebao_time|default='02:00'}">
        <p class="help-block">时间格式: 01:20,凌晨1点20分； 21:20,晚上21点20分；</p>
    </div>
</div>
<div class="form-group">
    <label class="col-sm-3 control-label">{:lang("自动存入余额宝ID")}：</label>
    <div class="input-group col-sm-4">
        <input type="text" class="form-control" name="auto_yuebao_rate_id" value="{$config.auto_yuebao_rate_id}">
        <p class="help-block">在余额宝设置界面获取</p>
    </div>
</div>
