<div class="form-group">
    <label class="col-sm-3 control-label">{:lang("欠款弹窗提醒内容")}：</label>
    <div class="input-group col-sm-4">
        <input type="text" class="form-control" name="repayment_reminder_content" value="{$config.repayment_reminder_content|default=''}">
        <p class="help-block">repayment_reminder_content：欠款弹窗提醒内容。</p>
    </div>
</div>
<div class="form-group">
    <label class="col-sm-3 control-label">{:lang("是否开启弹窗提醒")}：</label>
    <div class="input-group col-sm-4">
        <div class="layui-form">
            <input type="radio" name="repayment_reminder_status" value="1" title="是" {if array_key_exists('repayment_reminder_status', $config) && $config['repayment_reminder_status'] == 1}checked{/if}>
            <input type="radio" name="repayment_reminder_status" value="0" title="否" {if array_key_exists('repayment_reminder_status', $config) && $config['repayment_reminder_status'] == 0}checked{/if}>
        </div>
        <p class="help-block">repayment_reminder_status：是否开启弹窗提醒 1是，0否。</p>
    </div>
</div>
