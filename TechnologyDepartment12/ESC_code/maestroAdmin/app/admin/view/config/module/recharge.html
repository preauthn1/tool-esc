<div class="form-group">
    <label class="col-sm-3 control-label">{:lang("首充送款开关")}：</label>
    <div class="input-group col-sm-4">
        <div class="layui-form">
            <input type="radio" name="is_open_first_charge_rebate" value="1" title="开启" {if $config['is_open_first_charge_rebate'] == 1}checked{/if}>
            <input type="radio" name="is_open_first_charge_rebate" value="0" title="关闭" {if $config['is_open_first_charge_rebate'] == 0}checked{/if}>
        </div>
        <p class="help-block">is_open_first_charge_rebate：首充送款开关。</p>
    </div>
</div>

<div class="form-group">
    <label class="col-sm-3 control-label">{:lang("首充送款最低金额")}：</label>
    <div class="input-group col-sm-4">
        <input type="text" class="form-control" name="first_charge_rebate_min" value="{$config.first_charge_rebate_min|default=0}">
        <p class="help-block">first_charge_rebate_min：首充送款条件：充值金额大于等于x（最低要求），设置0不限制金额。</p>
    </div>
</div>

<div class="form-group">
    <label class="col-sm-3 control-label">{:lang("首充送款最高金额")}：</label>
    <div class="input-group col-sm-4">
        <input type="text" class="form-control" name="first_charge_rebate_max" value="{$config.first_charge_rebate_max|default=0}">
        <p class="help-block">first_charge_rebate_max：首充送款条件：充值金额小于等于x（最高要求）</p>
    </div>
</div>

<div class="form-group">
    <label class="col-sm-3 control-label">{:lang("首充送款比例")}：</label>
    <div class="input-group col-sm-4">
        <input type="text" class="form-control" name="first_charge_rebate_percent" value="{$config.first_charge_rebate_percent|default=0}">
        <p class="help-block">first_charge_rebate_percent：首充送款比例（例如 10% 设置 10 ）。</p>
    </div>
</div>

<div class="form-group">
    <label class="col-sm-3 control-label">{:lang("首充送款封顶")}：</label>
    <div class="input-group col-sm-4">
        <input type="text" class="form-control" name="first_charge_rebate_cap" value="{$config.first_charge_rebate_cap|default=0}">
        <p class="help-block">first_charge_rebate_cap：首充送款额度：单次封顶设置，可选0不封顶。</p>
    </div>
</div>
