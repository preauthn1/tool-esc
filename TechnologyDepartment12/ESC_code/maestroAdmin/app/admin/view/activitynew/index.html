{include file="header" /}
    <!-- Panel Other -->
    <div class="ibox float-e-margins">
        <div class="ibox-title">
            <h5>{$title|lang}</h5>
        </div>
        <div class="ibox-content">
            <div class="form-group clearfix col-sm-7">
                {if authCheck('activitynew/add')}
                <a id="add" href="{:url('add')}">
                    <button class="btn btn-outline btn-primary" type="button">{:lang("添加")}</button>
                </a>
                {/if}
            </div>
            <!--搜索框开始-->
            <form id='commentForm' role="form" method="post" class="form-inline pull-right">
                <div class="content clearfix m-b">
                    <div class="form-group">
                        <label>{:lang("关键词")}：</label>
                        <input type="text" class="form-control" id="title" name="title" placeholder="{:lang('名称/编码')}">
                    </div>
                    <div class="form-group">
                        <button class="btn btn-primary" type="button" style="margin-top:5px" id="search"><strong>{:lang('搜索')}</strong>
                        </button>
                    </div>
                </div>
            </form>
            <!--搜索框结束-->
            <div class="example-wrap">
                <div class="example">
                    <table id="cusTable">
                        <thead>
                        <th data-field="id">{:lang("ID")}</th>
                        <th data-field="title">{:lang("活动标题")}</th>
                        <th data-field="thumb">{:lang("活动图片")}</th>
                        <th data-field="type_str">{:lang("活动类型")}</th>
                        <th data-field="reward_type">{:lang("奖金类型")}</th>
                        <th data-field="reward" data-formatter="rewardFormatter">{:lang("奖金")}</th>
                        <th data-field="status">{:lang("状态")}</th>
                        <th data-field="start_time">{:lang("开始时间")}</th>
                        <th data-field="end_time">{:lang("结束时间")}</th>
                        <th data-field="operate">{:lang("操作")}</th>
                        </thead>
                    </table>
                </div>
            </div>
            <!-- End Example Pagination -->
        </div>
    </div>
<script type="text/javascript">
  function rewardFormatter(value, row, index) {
    console.warn(row)
    if (row.type == 8) {
      return ''
    }
    return value
  }
    $(document).ready(function () {
        initTable();
        //当点击查询按钮的时候执行
        $("#search").bind("click", initTable);
    });
    function queryParams(params) {   //设置查询参数
        params.title = $('#title').val()
        return params;
    }
    // Add onLoadSuccess function to handle dynamically added links
    function onLoadSuccess(res) {
      $("#add").on('click', function (e) {
        add(e.currentTarget.href)
        return false;
      });
      $("td a").on('click', function (e) {
        console.warn(e.currentTarget.href)
        if (e.currentTarget.href.indexOf('javascript') === -1) {
          add(e.currentTarget.href);
          return false;
        }
        return true;
      });
    }

    function add(url){
      // Use layer popup like in articles page
      layer.open({
        type: 2,
        area: ['100%', '100%'],
        title: '添加/编辑',
        maxmin: true, // 允许全屏最小化
        anim: 0, // 0-6 的动画形式，-1 不开启
        content: url
      });
    }
</script>
{include file="footer" /}
