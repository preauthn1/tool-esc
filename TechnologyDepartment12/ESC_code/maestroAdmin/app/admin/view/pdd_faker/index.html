<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>造假列表</title>
    <link rel="shortcut icon" href="{$admin_icon|toMedia}">
    <link href="/static/admin/css/bootstrap.min.css?v=3.3.6" rel="stylesheet">
    <link href="/static/admin/css/font-awesome.min.css?v=4.4.0" rel="stylesheet">
    <link href="/static/admin/css/plugins/bootstrap-table/bootstrap-table.min.css" rel="stylesheet">
    <link href="/static/admin/css/animate.min.css" rel="stylesheet">
    <link href="/static/admin/css/style.min.css?v=4.1.0" rel="stylesheet">
    <link href="/static/admin/js/layui/css/layui.css" rel="stylesheet">
    <link href="/static/admin/css/plugins/sweetalert/sweetalert.css" rel="stylesheet">
</head>
<body class="gray-bg">
<div class="wrapper wrapper-content animated fadeInRight">
    <!-- Panel Other -->
    <div class="ibox float-e-margins">
        <div class="ibox-title">
            <h5>{:lang("造假列表")}</h5>
        </div>
        <div class="ibox-content">
            <div class="form-group clearfix col-sm-7">
                <a id="add" href="{:url('pdd_faker/add')}">
                    <button class="btn btn-outline btn-primary" type="button">{:lang("添加造假")}</button>
                </a>
            </div>
            <!--搜索框开始-->
            <form id='commentForm' role="form" method="post" class="form-inline pull-right">
                <div class="content clearfix m-b">
                    <div class="form-group">
                        <label>{:lang("用户名称")}：</label>
                        <input type="text" class="form-control" id="searchText" name="searchText">
                    </div>
                    <div class="form-group">
                        <button class="btn btn-primary" type="button" style="margin-top:5px" id="search"><strong>{:lang('搜索')}</strong>
                        </button>
                    </div>
                </div>
            </form>
            <!--搜索框结束-->
            <div class="example-wrap">
                <div class="example">
                    <table id="cusTable">
                        <thead>
                        <th data-field="id">数据ID</th>
                        <th data-field="user_name">用户账号</th>
                        <th data-field="earnings">用户收益</th>
                        <th data-field="level_id">等级</th>
                        <th data-field="sort">排序</th>
                        <th data-field="update_time">{:lang("添加时间")}</th>
                        <th data-field="operate">操作</th>
                        </thead>
                    </table>
                </div>
            </div>
            <!-- End Example Pagination -->
        </div>
    </div>
</div>
<!-- End Panel Other -->
</div>
<script src="/static/admin/js/jquery.min.js?v=2.1.4"></script>
<script src="/static/admin/js/bootstrap.min.js?v=3.3.6"></script>
<script src="/static/admin/js/content.min.js?v=1.0.0"></script>
<script src="/static/admin/js/plugins/bootstrap-table/bootstrap-table.min.js"></script>
<script src="/static/admin/js/plugins/bootstrap-table/bootstrap-table-mobile.min.js"></script>
<script src="/static/admin/js/plugins/bootstrap-table/locale/bootstrap-table-zh-CN.min.js"></script>
<script src="/static/admin/js/plugins/suggest/bootstrap-suggest.min.js"></script>
<script src="/static/admin/js/plugins/layer/laydate/laydate.js"></script>
<script src="/static/admin/js/plugins/sweetalert/sweetalert.min.js"></script>
<script src="/static/admin/js/plugins/layer/layer.min.js"></script>
<script type="text/javascript">
    function initTable() {
        //先销毁表格
        $('#cusTable').bootstrapTable('destroy');
        //初始化表格,动态从服务器加载数据
        $("#cusTable").bootstrapTable({
            method: "get",  //使用get请求到服务器获取数据
            url: "./index", //获取数据的地址
            striped: true,  //表格显示条纹
            pagination: true, //启动分页
            pageSize: 10,  //每页显示的记录数
            pageNumber: 1, //当前第几页
            pageList: [5, 10, 15, 20, 25],  //记录数可选列表
            sidePagination: "server", //表示服务端请求
            paginationFirstText: "{:lang('首页')}",
            paginationPreText: "{:lang('上一页')}",
            paginationNextText: "{:lang('下一页')}",
            paginationLastText: "{:lang('尾页')}",
            queryParamsType: "undefined",
            clickToSelect: true,  // 是否启用点击选中行
            selectItemName: "ids",
            // uniqueId: "id",       // 每一行的唯一标识，一般为主键列
            // idField: "id",
            columns: [{
                checkbox: false,
                visible: false     // 是否显示复选框
            }],
            queryParams: function queryParams(params) {   //设置查询参数
                var param = {
                    pageNumber: params.pageNumber,
                    pageSize: params.pageSize,
                    user_id: $('#user_id').val()
                };
                return param;
            },
            onLoadSuccess: function (res) {  //加载成功时执行
                if (111 == res.code) {
                    window.location.reload();
                }
                $("#add").on('click', function (e) {
                    add(e.currentTarget.href)
                    return false;
                });
                $("#add").on('click', function (e) {
                    add(e.currentTarget.href)
                    return false;
                });
                $("td a").on('click', function (e) {
                    if (e.currentTarget.href.indexOf('javascript') === -1) {
                        add(e.currentTarget.href)
                        return false;
                    }
                    return true;
                });
                layer.msg("{:lang('加载成功')}", {time: 1000});
            },
            onLoadError: function () {  //加载失败时执行
                layer.msg("{:lang('加载数据失败')}");
            }
        });
    }

    $(document).ready(function () {
        //调用函数，初始化表格
        initTable();

        //当点击查询按钮的时候执行
        $("#search").bind("click", initTable);
    });

    function del(id) {
        layer.confirm('确认删除?', {icon: 3, title: '提示'}, function (index) {
            //do something
            $.getJSON("{:url('pdd_faker/del')}", {'id': id}, function (res) {
                if (1 == res.code) {
                    layer.alert(res.msg, {title: "{:lang('友情提示')}", icon: 1, closeBtn: 0}, function (inx) {
                        layer.close(inx);
                        initTable();
                    });
                } else if (111 == res.code) {
                    window.location.reload();
                } else {
                    layer.alert(res.msg, {title: "{:lang('友情提示')}", icon: 2});
                }
            });

            layer.close(index);
        })
    }

    function add(url) {
        // 在此处输入 layer 的任意代码
        layer.open({
            type: 2,
            area: ['100%', '100%'],
            title: '添加/编辑',
            maxmin: true, // 允许全屏最小化
            anim: 0, // 0-6 的动画形式，-1 不开启
            content: url
        });
    }
</script>
</body>
</html>
