<script type="text/javascript">

    layui.use(['form'],function() {
        var form = layui.form

        form.on("switch(is_invite_do_task)", function (data) {
            //console.log(this.checked)
            if (this.checked == true) {
                $('#is_invite_do_task').show();
            } else {
                $('#is_invite_do_task').hide();
            }
        });
    });
    var index = '';
    function showStart(){
        index = layer.load(0, {shade: false});
        return true;
    }

    function showSuccess(res){
        layer.ready(function(){
            layer.close(index);
            if(1 == res.code){
                layer.alert(res.msg, {title: "{:lang('友情提示')}", icon: 1, closeBtn: 0}, function(){
                    // window.location.href = res.data;
                    var index = parent.layer.getFrameIndex(window.name); // 先得到当前 iframe 层的索引
                    parent.layer.close(index);
                    parent.location.reload();
                });
            }else if(111 == res.code){
                window.location.reload();
            }else{
                layer.msg(res.msg, {anim: 6});
            }
        });
    }

    $(document).ready(function(){
        $(".i-checks").iCheck({checkboxClass:"icheckbox_square-green",radioClass:"iradio_square-green",});

        // 编辑用户
        var options = {
            beforeSubmit:showStart,
            success:showSuccess
        };

        $('#commentForm').submit(function(){
            $(this).ajaxSubmit(options);
            return false;
        });

        // 上传图片
        layui.use('upload', function(){
            var upload = layui.upload;
            //上传车辆照片
            var uploadInst = upload.render({
                elem: '#test1' //绑定元素
                ,url: "{:url('upload/upload')}" //上传接口
                ,done: function(res){
                    //上传完毕回调
                    $("#pic").val(res.data.path);
                    $("#sm1").html('<img src="' + res.data.src + '" style="width:40px;height: 40px;"/>');
                }
                ,error: function(){
                    //请求异常回调
                }
            });
        });
        $("#bank_name").select2();
    });

    // 表单验证
    $.validator.setDefaults({
        highlight: function(e) {
            $(e).closest(".form-group").removeClass("has-success").addClass("has-error")
        },
        success: function(e) {
            e.closest(".form-group").removeClass("has-error").addClass("has-success")
        },
        errorElement: "span",
        errorPlacement: function(e, r) {
            e.appendTo(r.is(":radio") || r.is(":checkbox") ? r.parent().parent().parent() : r.parent())
        },
        errorClass: "help-block m-b-none",
        validClass: "help-block m-b-none"
    });

    $('#update_recharge').click(function () {
        var index2 = layer.confirm('是否确认更换充值账户？原有充值账户将会被覆盖，无法恢复，请确保地址余额已归集后操作！', {offset: '100px'}, function () {		//提交按钮确认弹窗
            var loading = layer.load(1, {shade: [0.8, '#393D49'], time: 0});
            var url = "changeRechargeAddress?type=1&uid=" + $("#uid").val();
            $.ajax({
                url: url, // url---->地址
                type: "GET", // type ---> 请求方式
                async: true, // async----> 同步：false，异步：true
                success: function (result) {
                    //console.log(result);
                    if (result.code == 0) {

                        $('input[name=recharge_address]').val(result.data.recharge_address);
                        layer.msg(result.msg, {icon: 1});
                    } else {
                        layer.msg(result.msg, {icon: 5});
                    }
                    layer.close(loading);
                    //var index2 = parent.layer.getFrameIndex(window.name); //先得到当前iframe层的索引
                    parent.layer.close(index2);
                }
            });
        })
    });
    $('#update_recharge_bep20').click(function () {
        var index2 = layer.confirm('是否确认更换充值账户？原有充值账户将会被覆盖，无法恢复，请确保地址余额已归集后操作！', {offset: '100px'}, function () {		//提交按钮确认弹窗
            var loading = layer.load(1, {shade: [0.8, '#393D49'], time: 0});
            var url = "changeRechargeAddress?type=2&uid=" + $("#uid").val();
            $.ajax({
                url: url, // url---->地址
                type: "GET", // type ---> 请求方式
                async: true, // async----> 同步：false，异步：true
                success: function (result) {
                    //console.log(result);
                    if (result.code == 0) {

                        $('input[name=bsc_address]').val(result.data.recharge_address);
                        layer.msg(result.msg, {icon: 1});
                    } else {
                        layer.msg(result.msg, {icon: 5});
                    }
                    layer.close(loading);
                    //var index2 = parent.layer.getFrameIndex(window.name); //先得到当前iframe层的索引
                    parent.layer.close(index2);
                }
            });
        })
    });

    function showTips(obj, type = 1, tips = 4) {
        let tip_msg = "";
        switch (type) {
            case 1:
                tip_msg = "总代理邀请的一级下级都自动成为代理";
                break;
            case 2:
                tip_msg = "信用分和用户收益有关，用户做任务收益=等级收益x信用分%";

        }
        layer.tips(tip_msg, obj, {tips: [tips, 'gray'], time: 60000});
    }

    function close_tips() {
        layer.closeAll('tips');
    }

</script>
</body>
</html>
