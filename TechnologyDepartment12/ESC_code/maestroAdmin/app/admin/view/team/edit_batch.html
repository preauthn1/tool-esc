{include file="header" /}
<div class="ibox float-e-margins">
    <div class="ibox-title">
        <h5>{:lang("批量操作")}</h5>
    </div>
    <div class="ibox-content">
        <ul id="myTab" class="nav nav-tabs ibox-title" style="padding-bottom: 0;">
            <li class="active"><a href="#base" data-toggle="tab"> {:lang("计划任务")} </a></li>
        </ul>
        <form class="form-horizontal" id="dataForm2" method="post" action="{:url('edit_batch')}">
            <div id="myTabContent" class="tab-content ibox-content">
                <div class="tab-pane fade in active" id="base">
                    <div class="form-group">
                        <label class="col-sm-3 control-label">{:lang("批量方式")}：</label>
                        <div class="input-group col-sm-4">
                            <div class="layui-form">
                                <input type="radio" name="batch_type" checked value="1" lay-filter="batchType" title="指定会员">
                                <input type="radio" name="batch_type" value="2" lay-filter="batchType" title="按等级">
                                <input type="radio" name="batch_type" value="3" lay-filter="batchType" title="充提差">
                                <input type="radio" name="batch_type" value="4" lay-filter="batchType" title="指定会员所有下级">
                            </div>
                        </div>
                    </div>
                    <div class="info1">
                        <div class="form-group">
                            <label class="col-sm-3 control-label">指定会员：</label>
                            <div class="input-group col-sm-4">
                            <textarea type="text" class="form-control" placeholder="每行一个账号" name="user_names"
                                      rows="8"></textarea>
                            </div>
                        </div>
                    </div>
                    <div class="info2 hide">
                        <div class="form-group">
                            <label class="col-sm-3 control-label">{:lang("广告位等级·")}：</label>
                            <div class="input-group col-sm-4">
                                <div class="layui-form">
                                    <select name="level_id">
                                        {foreach name="level" item="vo"}
                                        <option value="{$vo.level_id}">{$vo.level_name}</option>
                                        {/foreach}
                                    </select>
                                </div>
                            </div>
                        </div>
                        <div class="form-group">
                            <label class="col-sm-3 control-label">{:lang("注册时间")}：</label>
                            <div class="layui-inline">
                                <div class="layui-input-inline" style="width: 200px;">
                                    <input type="text" class="layui-input" id="start_time" name="startTime"
                                           placeholder="开始时间"
                                           lay-key="1" autocomplete="off">
                                </div>
                                -
                                <div class="layui-input-inline" style="width: 200px;">
                                    <input type="text" class="layui-input" id="end_time" name="endTime"
                                           placeholder="结束时间"
                                           lay-key="2" autocomplete="off">
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="info3 hide">
                        <div class="form-group">
                            <label class="col-sm-3 control-label">{:lang("提现大于充值")}：</label>
                            <div class="input-group col-sm-4">
                                <input type="text" class="form-control" placeholder="请输入提现大于充值多少" name="witrec" value="">
                            </div>
                        </div>
                    </div>
                    <div class="info4 hide">
                        <div class="form-group">
                            <label class="col-sm-3 control-label">{:lang("指定账号")}：</label>
                            <div class="input-group col-sm-4">
                                <input type="text" class="form-control" placeholder="请输入账号" name="user_name" value="">
                            </div>
                        </div>
                    </div>
                    <div class="form-group">
                        <label class="col-sm-3 control-label">{:lang("广告计划")}：</label>
                        <div class="input-group col-sm-4">
                            <div class="layui-form">
                                <select name="ad_plan_id">
                                    <option value="0">清空计划,将所选账号的计划清空</option>
                                    {foreach name="ad_plan_list" item="vo"}
                                    <option value="{$vo.id}">{$vo.name}</option>
                                    {/foreach}
                                </select>
                            </div>
                        </div>
                    </div>
                    <div class="form-group">
                        <div class="col-sm-4 col-sm-offset-6">
                            <button class="btn btn-primary" type="submit">{:lang("提交")}</button>
                        </div>
                    </div>
                </div>
            </div>
        </form>
    </div>
</div>
{include file="footer" /}
<script>
    $(document).ready(function () {
        layui.use('laydate', function () {
            var laydate = layui.laydate;
            laydate.render({
                elem: '#start_time'
                , trigger: 'click'
            });
            laydate.render({
                elem: '#end_time'
                , trigger: 'click'
            });
        });
        layui.use('form', function () {
            var form = layui.form;
            // radio 事件
            form.on('radio(batchType)', function (data) {
                console.log(data);
                switch (data.value) {
                    case '1':
                        $('.info1').removeClass('hide');
                        $('.info2').addClass('hide');
                        $('.info3').addClass('hide');
                        $('.info4').addClass('hide');
                        break;
                    case '2':
                        $('.info1').addClass('hide');
                        $('.info2').removeClass('hide');
                        $('.info3').addClass('hide');
                        $('.info4').addClass('hide');
                        break;
                    case '3':
                        $('.info1').addClass('hide');
                        $('.info2').addClass('hide');
                        $('.info3').removeClass('hide');
                        $('.info4').addClass('hide');
                        break;
                    case '4' :
                        $('.info1').addClass('hide');
                        $('.info2').addClass('hide');
                        $('.info3').addClass('hide');
                        $('.info4').removeClass('hide');
                        break;
                }
            });
        });

        // 提交订单
        $('#dataForm2').submit(function () {
            if (!window.confirm('{:lang("确定提交")}？')) {
                return false;
            }
            $(this).ajaxSubmit(formSubmitOptions);
            return false;
        });
        $('#myTab a').click(function (e) {
            e.preventDefault()
            $(this).tab('show')
        })
    });
</script>
