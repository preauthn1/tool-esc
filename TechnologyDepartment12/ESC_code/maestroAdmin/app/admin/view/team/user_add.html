{include file="header" /}
<style>
    .layui-form-label {
        box-sizing: content-box;
    }
</style>
<div class="row">
    <div class="col-sm-8">
        <div>
            <div class="ibox-content">
                <form class="form-horizontal m-t layui-form" id="commentForm" method="post" action="{:url('member/useradd')}">
                    <div class="layui-form-item">
                        <label class="layui-form-label">用户类型</label>
                        <div class="layui-form">
                            <div class="layui-input-block">
                                <input type="radio" name="user_type" value="1" title="邮箱" checked>
                                <input type="radio" name="user_type" value="2" title="手机号">
                            </div>
                        </div>
                    </div>
                    <div class="layui-form-item">
                        <label class="layui-form-label">是否虚拟账号</label>
                        <div class="layui-form">
                            <div class="layui-input-block">
                                <input type="radio" name="is_xuni" value="0" title="否" checked>
                                <input type="radio" name="is_xuni" value="1" title="是">
                            </div>
                        </div>
                    </div>
                    <div class="layui-form-item">
                        <label class="layui-form-label">用户账号</label>
                        <div class="layui-input-inline layui-input-wrap">
                            <input type="text" name="user_name" lay-verify="required" autocomplete="off"
                                   lay-affix="clear" class="layui-input">
                        </div>
                    </div>
                    <div class="layui-form-item">
                        <label class="layui-form-label">用户密码</label>
                        <div class="layui-input-inline layui-input-wrap">
                            <input type="text" name="password" lay-verify="required" autocomplete="off"
                                   lay-affix="clear" class="layui-input">
                        </div>
                    </div>
<!--                    <div class="layui-form-item">-->
<!--                        <label class="layui-form-label">邀请码</label>-->
<!--                        <div class="layui-input-inline layui-input-wrap">-->
<!--                            <input type="text" name="invite_code" lay-verify="required" autocomplete="off"-->
<!--                                   lay-affix="clear" class="layui-input">-->
<!--                        </div>-->
<!--                    </div>-->
                    <input type="hidden" name="is_proxy" value="1" lay-verify="required" autocomplete="off">
                    <!--                                   lay-affix="clear" class="layui-input">-->
                    <div class="layui-form-item">
                        <label class="layui-form-label">语言类型</label>
                        <div class="layui-input-inline layui-input-wrap">
                            <select class="form-control" name="lang" id="lang">
                            {foreach $langs as $lang}
                            <option value="{$lang.lang}">{$lang.title}</option>
                            {/foreach}
                            </select>
                        </div>
                    </div>
                    <div class="form-group">
                        <div class="col-sm-4 col-sm-offset-6">
                            <!--<input type="button" value="提交" class="btn btn-primary" id="postform"/>-->
                            <button class="btn btn-primary" type="submit">{:lang("提交")}</button>
                        </div>
                    </div>
                </form>
            </div>
        </div>

    </div>
</div>

<script type="text/javascript">
    var index = '';

    function showStart() {
        index = layer.load(0, {shade: false});
        return true;
    }

    function showSuccess(res) {

        layer.ready(function () {
            layer.close(index);
            if (1 == res.code) {
                layer.alert(res.msg, {title: "{:lang('友情提示')}", icon: 1, closeBtn: 0}, function () {
                    var index = parent.layer.getFrameIndex(window.name); // 先得到当前 iframe 层的索引
                    parent.layer.close(index);
                    parent.location.reload();
                });
            } else if (111 == res.code) {
                window.location.reload();
            } else {
                layer.msg(res.msg, {anim: 6});
            }
        });
    }

    $(document).ready(function () {
        $(".i-checks").iCheck({checkboxClass: "icheckbox_square-green", radioClass: "iradio_square-green",});

        // 添加用户
        var options = {
            beforeSubmit: showStart,
            success: showSuccess
        };

        $('#commentForm').submit(function () {
            $(this).ajaxSubmit(options);
            return false;
        });
    });

    // 表单验证
    $.validator.setDefaults({
        highlight: function (e) {
            $(e).closest(".form-group").removeClass("has-success").addClass("has-error")
        },
        success: function (e) {
            e.closest(".form-group").removeClass("has-error").addClass("has-success")
        },
        errorElement: "span",
        errorPlacement: function (e, r) {
            e.appendTo(r.is(":radio") || r.is(":checkbox") ? r.parent().parent().parent() : r.parent())
        },
        errorClass: "help-block m-b-none",
        validClass: "help-block m-b-none"
    });

</script>
{include file="footer" /}
