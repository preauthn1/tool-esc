<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>添加收款账号</title>
    <link rel="shortcut icon" href="{$admin_icon|toMedia}">
    <link href="/static/admin/css/bootstrap.min.css?v=3.3.6" rel="stylesheet">
    <link href="/static/admin/css/font-awesome.min.css?v=4.4.0" rel="stylesheet">
    <link href="/static/admin/css/animate.min.css" rel="stylesheet">
    <link href="/static/admin/css/plugins/iCheck/custom.css" rel="stylesheet">
    <link href="/static/admin/css/style.min.css?v=4.1.0" rel="stylesheet">
    <link href="/static/admin/js/plugins/bootstrap-tagsinput/bootstrap-tagsinput.css" rel="stylesheet">
    <link href="/static/admin/js/layui/css/layui.css" rel="stylesheet">
</head>
<body class="gray-bg">
<div class="wrapper wrapper-content animated fadeInRight">
    <div class="row">
        <div class="col-sm-8">
            <div class="ibox float-e-margins">
                <div class="ibox-title">
                    <h5>{:lang("添加收款账号")}</h5>
                </div>
                <div class="ibox-content">
                    <form class="form-horizontal m-t" id="commentForm" method="post" action="{:url('add')}">
                        <input type="hidden" name="id" value="{$info.id|default=0}"/>
                        <div class="form-group">
                            <label class="col-sm-3 control-label">{:lang("收款类型")}：</label>
                            <div class="input-group col-sm-4">
                                {if $info.type == 2}
                                <input type="hidden" name="type" value="2"/>
                                <p class="form-control-static">支付宝</p>
                                {elseif $info.type == 3}
                                <p class="form-control-static">第三方支付</p>
                                <input type="hidden" name="type" value="3"/>
                                {elseif $info.type == 4}
                                <p class="form-control-static">USDT</p>
                                <input type="hidden" name="type" value="4"/>
                                {else}
                                <p class="form-control-static">银行卡</p>
                                <input type="hidden" name="type" value="1"/>
                                {/if}
                            </div>
                        </div>
                        <div class="form-group">
                            <label class="col-sm-3 control-label">{:lang("排序")}：</label>
                            <div class="input-group col-sm-4">
                                <input type="text" class="form-control" value="{$info.sort|default=0|intval}" name="sort" required="">
                                <p class="help-block">{:lang("数字越小的排在前面")}</p>
                            </div>
                        </div>
                        {if $info.type != 3}
                        {if $info.type == 4}
                        <div class="form-group">
                            <label class="col-sm-3 control-label">{:lang("收款地址")}：</label>
                            <div class="input-group col-sm-4">
                                <input id="account" type="text" class="form-control" value="{$info.account|default=''}" name="account" required="" aria-required="true">
                            </div>
                        </div>
                        <div class="form-group">
                            <label class="col-sm-3 control-label">{:lang("地址类型")}：</label>
                            <div class="input-group col-sm-4">
                                <select class="form-control" name="name">
                                    <option value="TRC20" {if $info.name eq 'TRC20'} selected{/if}>TRC20</option>
                                    <option value="ERC20" {if $info.name eq 'ERC20'} selected{/if}>ERC20</option>
                                    <option value="HECO" {if $info.name eq 'HECO'} selected{/if}>HECO</option>
                                    <option value="OMNI" {if $info.name eq 'OMNI'} selected{/if}>OMNI</option>
                                </select>
                            </div>
                        </div>
                        {else}
                        <div class="form-group">
                            <label class="col-sm-3 control-label">{:lang("收款账号")}：</label>
                            <div class="input-group col-sm-4">
                                <input id="account" type="text" class="form-control" value="{$info.account|default=''}" name="account" required="" aria-required="true">
                            </div>
                        </div>
                        <div class="form-group">
                            <label class="col-sm-3 control-label">{:lang("真实姓名")}：</label>
                            <div class="input-group col-sm-4">
                                <input id="name" type="text" class="form-control" value="{$info.name|default=''}" name="name" required="" aria-required="true">
                            </div>
                        </div>
                        {/if}

                        {if $info.type == 1}
                        <div class="form-group bank">
                            <label class="col-sm-3 control-label">{:lang("银行名称")}：</label>
                            <div class="input-group col-sm-4">
                                <input id="bank_name" type="text" class="form-control" value="{$info.bank_name|default=''}" name="bank_name" aria-required="true">
                            </div>
                        </div>
                        <div class="form-group bank">
                            <label class="col-sm-3 control-label">{:lang("支行信息")}：</label>
                            <div class="input-group col-sm-4">
                                <input id="bank_address" type="text" class="form-control" value="{$info.bank_address|default=''}" name="bank_address" aria-required="true">
                            </div>
                        </div>
                        {/if}
                        {else}
                        <div class="form-group">
                            <label class="col-sm-3 control-label">{:lang("支付渠道")}：</label>
                            <div class="input-group col-sm-4">
                                <select name="account" class="form-control">
                                    {volist name='pay' id='row'}
                                    <option value="{$key}" {if $key eq $info.account} selected{/if}>{$row.name}</option>
                                    {/volist}
                                </select>
                            </div>
                        </div>
                        <div class="form-group bank">
                            <label class="col-sm-3 control-label">{:lang("银行名称")}：</label>
                            <div class="input-group col-sm-4">
                                <input id="bank_name" type="text" class="form-control" value="{$info.bank_name|default=''}" name="bank_name" aria-required="true">
                            </div>
                        </div>
                        <div class="form-group">
                            <label class="col-sm-3 control-label">{:lang("银行编码")}：</label>
                            <div class="input-group col-sm-4">
                                <input id="name" type="text" class="form-control" value="{$info.name}" name="name" required="" aria-required="true">
                            </div>
                        </div>
                        <div class="form-group">
                            <label class="col-sm-3 control-label">{:lang("指定银行")}：</label>
                            <div class="input-group col-sm-4">
                                <input id="bank_address" type="text" class="form-control" value="{$info.bank_address}" name="bank_address" aria-required="true">
                            </div>
                        </div>
                        {/if}
                        <div class="form-group">
                            <label class="col-sm-3 control-label">{:lang("最小充值金额")}：</label>
                            <div class="input-group col-sm-4">
                                <input type="text" class="form-control" value="{$info.min_money|default=0|intval}" name="min_money" required="">
                            </div>
                        </div>
                        <div class="form-group">
                            <label class="col-sm-3 control-label">{:lang("最大充值金额")}：</label>
                            <div class="input-group col-sm-4">
                                <input type="text" class="form-control" value="{$info.max_money|default=0|intval}" name="max_money" required="">
                            </div>
                        </div>
                        <div class="form-group">
                            <label class="col-sm-3 control-label">{:lang("图片")}：</label>
                            <input name="logo" id="logo" value="{$info.logo|default=''}" type="hidden" />
                            <div class="form-inline">
                                <div class="input-group col-sm-2">
                                    <button type="button" class="layui-btn" id="test1">
                                        <i class="layui-icon">&#xe67c;</i>{:lang("上传图片")}
                                    </button>
                                </div>
                                <div class="input-group col-sm-3">
                                    <div id="sm">{if isset($info.logo) && $info.logo}<img src="{$info.logo|default=''|toMedia}" style="width:40px; height: 40px;"/>{/if}</div>
                                </div>
                            </div>
                        </div>
                        <div class="form-group">
                            <label class="col-sm-3 control-label">{:lang("状态")}：</label>
                            <div class="input-group col-sm-4">
                                <select class="form-control" name="status">
                                    <option value="0" {if $info.status eq 0} selected {/if}>{:lang("停用")}</option>
                                    <option value="1" {if $info.status neq 0} selected {/if}>{:lang("启用")}</option>
                                </select>
                            </div>
                        </div>
                        <div class="form-group">
                            <div class="col-sm-4 col-sm-offset-6">
                                <!--<input type="button" value="提交" class="btn btn-primary" id="postform"/>-->
                                <button class="btn btn-primary" type="submit">{:lang("提交")}</button>
                            </div>
                        </div>
                    </form>
                </div>
            </div>

        </div>
    </div>
</div>
<script src="/static/admin/js/jquery.min.js?v=2.1.4"></script>
<script src="/static/admin/js/bootstrap.min.js?v=3.3.6"></script>
<script src="/static/admin/js/content.min.js?v=1.0.0"></script>
<script src="/static/admin/js/plugins/bootstrap-tagsinput/bootstrap-tagsinput.min.js"></script>
<script src="/static/admin/js/plugins/webuploader/webuploader.min.js"></script>
<script src="/static/admin/js/plugins/validate/jquery.validate.min.js"></script>
<script src="/static/admin/js/plugins/validate/messages_zh.min.js"></script>
<script src="/static/admin/js/plugins/iCheck/icheck.min.js"></script>
<script src="/static/admin/js/plugins/layer/laydate/laydate.js"></script>
<script src="/static/admin/js/plugins/layer/layer.min.js"></script>
<script src="/static/admin/js/layui/layui.js"></script>
<script src="/static/admin/js/jquery.form.js"></script>
<script src="/static/admin/js/plugins/ueditor/ueditor.config.js"></script>
<script src="/static/admin/js/plugins/ueditor/ueditor.all.js"></script>
<script type="text/javascript">
    var index = '';
    function showStart(){
        index = layer.load(0, {shade: false});
        return true;
    }
    $("#typeeee").on("change", function() {
        $(this).val() == 1 ? $(".bank").show() : $(".bank").hide();
    })
    $("#typeeee").change();
    function showSuccess(res){
        layer.ready(function(){
            layer.close(index);
            if(1 == res.code){
               layer.alert(res.msg, {title: "{:lang('友情提示')}", icon: 1, closeBtn: 0}, function(){
                   window.location.href = res.data;
               });
            }else if(111 == res.code){
                window.location.reload();
            }else{
                layer.msg(res.msg, {anim: 6});
            }
        });
    }

    $(document).ready(function(){
        // 添加商品
        var options = {
            beforeSubmit:showStart,
            success:showSuccess
        };
        // 提交订单
        $('#commentForm').submit(function(){
            $(this).ajaxSubmit(options);
            return false;
        });
        // 单张上传图片
        layui.use('upload', function(){
            var upload = layui.upload;
            var uploadInst = upload.render({
                elem: '#test1' //绑定元素
                ,url: "{:url('upload/upload')}" //上传接口
                ,done: function(res){
                    //上传完毕回调
                    $("#logo").val(res.data.path);
                    $("#sm").html('<img src="' + res.data.src + '" style="width:40px;height: 40px;"/>');
                }
                ,error: function(){
                    //请求异常回调
                }
            });
        });
    });

    // 表单验证
    $.validator.setDefaults({
        highlight: function(e) {
            $(e).closest(".form-group").removeClass("has-success").addClass("has-error")
        },
        success: function(e) {
            e.closest(".form-group").removeClass("has-error").addClass("has-success")
        },
        errorElement: "span",
        errorPlacement: function(e, r) {
            e.appendTo(r.is(":radio") || r.is(":checkbox") ? r.parent().parent().parent() : r.parent())
        },
        errorClass: "help-block m-b-none",
        validClass: "help-block m-b-none"
    });

</script>
</body>
</html>
