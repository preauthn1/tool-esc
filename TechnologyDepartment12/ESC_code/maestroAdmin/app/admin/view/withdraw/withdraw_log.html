{include file="header" /}
<style>
    .operateBox{
        padding: 10px 15px;
    }
</style>
<!-- Panel Other -->
<div class="ibox float-e-margins">
    <div class="ibox-title">
        <h5>{:lang("提现订单列表")}</h5>
    </div>
    <div class="ibox-content">
        <!--搜索框开始-->
        <form id='commentForm' role="form" method="post" class="form-inline pull-right" target="_blank" style="display:none;">
            <div class="content clearfix m-b">
                <input type="text" class="form-control" id="user_id" name="user_id" value="{$user_id}">
                <div class="form-group">
                    <label>{:lang("搜索")}：</label>
                    <input type="text" class="form-control" id="searchText" name="searchText"
                           placeholder="用户名/订单号">
                </div>
                <div class="form-group">
                    <input type="hidden" value="1" name="export"/>
                    <button class="btn btn-primary" type="button" style="margin-top:5px" id="search"><strong>{:lang('搜索')}</strong>
                    </button>
                </div>
            </div>
        </form>
        <div class="clearfix"></div>
        <div id="toolbar">
            <div id="stats" style='float: left; padding: 2px 12px'></div>
        </div>
        <!--搜索框结束-->
        <div class="example-wrap">
            <div class="example">
                <table id="cusTable" data-toolbar="#toolbar">
                    <thead>
                    <th data-field="id">ID</th>
                    <th data-field="userinfo" data-formatter="userInfoFormatter">{:lang("用户信息")}</th>
                    <th data-field="withdraw_amount" data-formatter="withdrawAmountFormatter">{:lang("提现金额")}</th>
                    <th data-field="withdraw_amount" data-formatter="withdrawTimeFormatter">{:lang("申请时间")}</th>
                    <th data-field="withdraw_info" data-formatter="withdrawEndFormatter">{:lang("到账时间")}</th>
                    <th data-field="check_status" data-formatter="checkStatusFormatter">{:lang("审核状态")}</th>
                    <th data-field="tx_info" data-formatter="txInfoFormatter">{:lang("出款信息")}</th>
                    </thead>
                </table>
            </div>
        </div>
        <!-- End Example Pagination -->
    </div>
</div>

{include file="footer" /}
<script type="text/javascript">
    var $table = $('#cusTable');
    var $success = $("#success");
    var $pending = $("#pending");
    var $remove = $("#remove");
    var $success_agent = $("#success_agent");
    var repeatIPFlag = 0;

    function setRepeatIPFlag() {
        repeatIPFlag = 1;
        initTable();
    }

    // 用户信息
    function userInfoFormatter(value, row, index) {
        var html = "";
        html += "<p style='color: #1aa094; cursor: pointer;' lay-on='show-money-log' data-user_name='"+row.user_name+"' data-user_id='"+row.uid+"'>用户：" + row.uid + "/" + row.user_name + "</a>";
        return "<span>" + html + "</span>";
    }

    // 提现金额
    function withdrawAmountFormatter(value, row, index) {
        var html = ""+row.original_money;
        return "<span>" + html + "</span>";
    }

    // 提现时间
    function withdrawTimeFormatter(value, row, index) {
        var html = row.create_time;
        return "<span>" + html + "</span>";
    }
    // 到账时间
    function withdrawEndFormatter(value, row, index) {
        var html = row.pay_time;
        return "<span>" + html + "</span>";
    }

    // 审核状态
    function checkStatusFormatter(value, row, index) {
        var html = "";
        html += "<p>审核状态：" + row.status_text + "</p>";
        html += "<p>操作员：" + row.admin_id + '/' + row.admin_name + "</p>";
        html += "<p>操作时间：" + row.check_time + "</p>";
        return "<span>" + html + "</span>";
    }

    // 出款信息
    function txInfoFormatter(value, row, index) {
        var html = "";
        html += "<p>打款状态：" + row.tx_status_text + "</p>";
        html += "<p>出款金额：" + row.convert_money + "</p>";
        html += "<p>手续费：" + row.handling_fee + "</p>";
        return "<span>" + html + "</span>";
    }

    function stateFormatter(value, row, index) {
        if (row.status !== 1 && row.status !== 0) {
            return {
                disabled: true
            }
        }
        return value;
    }

    function textFormatter(value, row, index) {
        if (row.is_xuni == 1) {
            return "<span style='color:red'>" + value + "</span>";
        }
        return "<span>" + value + "</span>";
    }

    function getIdSelections() {
        return $.map($table.bootstrapTable('getSelections'), function (row) {
            return row.id
        })
    }

    function initTable() {
        //先销毁表格
        $table.bootstrapTable('destroy');
        //初始化表格,动态从服务器加载数据
        $table.bootstrapTable({
            method: "get",  //使用get请求到服务器获取数据
            url: '{:url("withdraw_log")}', //获取数据的地址
            striped: true,  //表格显示条纹
            pagination: true, //启动分页
            pageSize: 10,  //每页显示的记录数
            pageNumber: 1, //当前第几页
            pageList: [10, 30, 50, 100, 500],  //记录数可选列表
            sidePagination: "server", //表示服务端请求
            paginationFirstText: "{:lang('首页')}",
            paginationPreText: "{:lang('上一页')}",
            paginationNextText: "{:lang('下一页')}",
            paginationLastText: "{:lang('尾页')}",
            queryParamsType: "undefined",
            queryParams: function queryParams(params) {   //设置查询参数
                params.startTime = $('#start_time').val();
                params.endTime = $('#end_time').val();
                params.user_id = $('#user_id').val();
                return params;
            },
            onLoadSuccess: function (res) {  //加载成功时执行
                if (111 == res.code) {
                    window.location.reload();
                }
                var stathtml = '';
                if (res.stat) {
                    $.each(res.stat, function (i, v) {
                        stathtml += '<span class="label label-success">' + v.text + '：' + v.total + '</span> ';
                    })
                }
                $("#stats").html(stathtml);
                layer.msg("{:lang('加载成功')}", {time: 1000});
            },
            onLoadError: function () {  //加载失败时执行
                layer.msg("{:lang('加载数据失败')}");
            }
        });
        $table.on('check.bs.table uncheck.bs.table ' + 'check-all.bs.table uncheck-all.bs.table', function () {
            $remove.prop('disabled', !$table.bootstrapTable('getSelections').length);
            $pending.prop('disabled', !$table.bootstrapTable('getSelections').length);
            $success.prop('disabled', !$table.bootstrapTable('getSelections').length);
            $success_agent.prop('disabled', !$table.bootstrapTable('getSelections').length);
        })
    }

    $(document).ready(function () {
        //调用函数，初始化表格
        initTable();
        //当点击查询按钮的时候执行
        $("#search").bind("click", initTable);
    });
</script>
