    {include file="header" /}
    <div class="row">
        <div class="col-sm-12">
            <div class="ibox float-e-margins">
                <div class="ibox-title">
                    <h5>{:lang("添加")}</h5>
                </div>
                <div class="ibox-content">
                    <form class="form-horizontal m-t" id="dataForm" method="post" action="{:url('add')}">
                        <input type="hidden" name="id" value="{$info.id}"/>
                        <div class="form-group">
                            <label class="col-sm-3 control-label">{:lang("用户ID")}：</label>
                            <div class="input-group col-sm-4">
                                <input type="text" class="form-control" value="{$info.user_id}" name="user_id" required />
                            </div>
                        </div>
                        <div class="form-group">
                            <label class="col-sm-3 control-label">{:lang("活动")}：</label>
                            <div class="input-group col-sm-4">
                                <select class="form-control" name="activity_id" id="activity_id" >
                                    {volist name='activitys' id='item'}
                                    <option value="{$item.id}">{$item.title}</option>
                                    {/volist}
                                </select>
                            </div>
                        </div>
                        <div class="form-group">
                            <label class="col-sm-3 control-label">{:lang("状态")}：</label>
                            <div class="input-group col-sm-4">
                                <select class="form-control" name="status">
                                    <option value="0" {if $info.status eq 0} selected {/if}>{:lang("待审核")}</option>
                                    <option value="1" {if $info.status eq 1} selected {/if}>{:lang("活动中")}</option>
                                    <option value="2" {if $info.status eq 2} selected {/if}>{:lang("已完成")}</option>
                                </select>
                            </div>
                        </div>
                        <div class="form-group">
                            <div class="col-sm-4 col-sm-offset-6">
                                <button class="btn btn-primary" type="submit">{:lang("提交")}</button>
                            </div>
                        </div>
                    </form>
                </div>
            </div>

        </div>
    </div>
<script type="text/javascript">
    $(document).ready(function(){
        var editor = UE.getEditor('container', {
            serverUrl:"{:url('articles/uploadimg')}",
        });
        layui.use('laydate', function(){
            var laydate = layui.laydate;
            laydate.render({
                elem: '#start_time'
                ,trigger: 'click'
            });
            laydate.render({
                elem: '#end_time'
                ,trigger: 'click'
            });
        });
    });
</script>

{include file="footer" /}
