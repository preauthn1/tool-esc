{include file="header" /}
    <!-- Panel Other -->
    <div class="ibox float-e-margins">
        <div class="ibox-title">
            <h5>{:lang("活动记录")}</h5>
        </div>
        <div class="ibox-content">
            <div class="form-group pull-left">
                {if authCheck('activity/add')}
                <a href="{:url('add')}">
                    <button class="btn btn-outline btn-primary" type="button">{:lang("添加")}</button>
                </a>
                {/if}
            </div>
            <form id='commentForm' role="form" method="post" class="form-inline pull-right">
                <div class="content clearfix m-b">
                    <div class="form-group">
                        <label>{:lang("选择时间")}：</label>
                        <input type="text" class="form-control" id="start_time" name="startTime" placeholder="yyyy-MM-dd" lay-key="1" autocomplete="off">
                        -
                        <input type="text" class="form-control" id="end_time" name="endTime" placeholder="yyyy-MM-dd" lay-key="2" autocomplete="off">
                    </div>
                    <div class="form-group">
                        <label>{:lang("活动")}：</label>
                        <select class="form-control" name="activity_id" id="activity_id" >
                            <option value="">所有</option>
                            {volist name='activitys' id='item'}
                            <option value="{$item.id}">{$item.title}</option>
                            {/volist}
                        </select>
                    </div>
                    <div class="form-group">
                        <label>{:lang("用户名称")}：</label>
                        <input type="text" class="form-control" id="username" name="user_name" placeholder="{:lang('用户账户/用户ID')}">
                    </div>
                    <div class="form-group">
                        <button class="btn btn-primary" type="button" style="margin-top:5px" id="search"><strong>{:lang('搜索')}</strong>
                        </button>
                    </div>
                </div>
            </form>
            <div class="example-wrap">
                <div class="example">
                    <table id="cusTable">
                        <thead>
                        <th data-field="user_id">{:lang("用户ID")}</th>
                        <th data-field="activity_id">{:lang("活动")}</th>
                        <th data-field="status">{:lang("状态")}</th>
                        <th data-field="create_time">{:lang("时间")}</th>
                        <th data-field="operate">{:lang("操作")}</th>
                        </thead>
                    </table>
                </div>
            </div>
            <!-- End Example Pagination -->
        </div>
    </div>
    
<script type="text/javascript">
    function queryParams(params) {   //设置查询参数
        params.activity_id= $('#activity_id').val(); 
        params.username = $('#username').val(); 
        params.startTime = $('#start_time').val(); 
        params.endTime = $('#end_time').val();
        return params;
    }
    $(document).ready(function () {
        layui.use('laydate', function(){
            var laydate = layui.laydate;
            laydate.render({
                elem: '#start_time'
                ,trigger: 'click'
            });
            laydate.render({
                elem: '#end_time'
                ,trigger: 'click'
            });
        });
        initTable();
        $("#search").on("click", function(){
            initTable();
        });
    });
</script>
{include file="footer" /}
