{include file="header" /}
    <!-- Panel Other -->
    <div class="ibox float-e-margins">
        <div class="ibox-title">
            <h5>{:lang("分享任务")}</h5>
        </div>
        <div class="ibox-content">
            <div class="form-group clearfix col-sm-7">
                <a id="add" href="{:url('share/add')}">
                    <button class="btn btn-outline btn-primary" type="button">{:lang("添加")}</button>
                </a>
                <a href="javascript:;" onclick="delAll();">
                    <button class="btn btn-outline btn-danger" type="button">{:lang("删除")}</button>
                </a>
            </div>
            <!--搜索框开始-->
            <form id='commentForm' role="form" method="post" class="form-inline pull-right">
                <div class="content clearfix m-b">
                    <div class="form-group">
                        <label>{:lang("账号类型")}：</label>
                        <select class="form-control" name="account_type" id="account_type" >
                            <option value="">所有</option>
<!--                            1基础账户 3彩金账号 5佣金账号-->
                            <option value="1">{:lang("基础账户")}</option>
                            <option value="3">{:lang("彩金账号")}</option>
                            <option value="5">{:lang("佣金账号")}</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <button class="btn btn-primary" type="button" style="margin-top:5px" id="search"><strong>{:lang('搜索')}</strong>
                        </button>
                    </div>
                </div>
            </form>
            <!--搜索框结束-->
            <div class="example-wrap">
                <div class="example">
                    <table id="cusTable">
                        <thead>
                        <th data-checkbox="true"></th><!--复选框-->
                        <th data-field="id">{:lang("ID")}</th>
                        <th data-field="img" >{:lang("分享图片")}</th>
                        <th data-field="account_type_str">{:lang("奖励类型")}</th>
                        <th data-field="money">{:lang("佣金金额")}</th>
                        <th data-field="days">{:lang("奖励VIP天数")}</th>
                        <th data-field="level_id">{:lang("奖励VIP等级")}</th>
                        <th data-field="status_str">{:lang("状态")}</th>
                        <th data-field="award_str">{:lang("奖励次数")}</th>
                        <th data-field="sort">{:lang("排序")}</th>
                        <th data-field="create_time">{:lang("添加时间")}</th>
                        <th data-field="operate">{:lang("操作")}</th>
                        </thead>
                    </table>
                </div>
            </div>
        </div>
    </div>
<script type="text/javascript">
    tableCheckbox = true;
    $(document).ready(function () {
        initTable();
        //当点击查询按钮的时候执行
        $("#search").bind("click", initTable);
    });
    function queryParams(params) {   //设置查询参数
        params.account_type = $('#account_type').val();
        return params;
    }

    function delAll(){
        var getSelectRows = $("#cusTable").bootstrapTable('getSelections', function (row) {
            return row;
        });
        var ids = new Array();  // 定义js数组用于存放自己所需的值
        for(var i=0;i<getSelectRows.length;i++){
            ids[i] = getSelectRows[i].id;
        }
        if (ids.length <= 0) {
            layer.msg('请选择要操作的数据');
            return;
        }
        layer.confirm('确认操作吗?', {icon: 3, title:'提示'}, function(index){
            $.getJSON("{:url('share/del')}", {'id' : ids}, function(res){
                if(1 == res.code){
                    layer.alert(res.msg, {title: "{:lang('友情提示')}", icon: 1, closeBtn: 0}, function(inx){
                        layer.close(inx);
                        initTable();
                    });
                }else if(111 == res.code){
                    window.location.reload();
                }else{
                    layer.alert(res.msg, {title: "{:lang('友情提示')}", icon: 2});
                }
            });

            layer.close(index);
        })
    }
    function onLoadSuccess(res) {
        $("#add").on('click',function (e){
            add(e.currentTarget.href)
            return false;
        });
        $("td a").on('click',function (e){
            add(e.currentTarget.href)
            return false;
        });
    }
    function add(url){
        // 在此处输入 layer 的任意代码
        layer.open({
            type: 2,
            area: ['100%', '100%'],
            title: '添加/编辑',
            maxmin: true, // 允许全屏最小化
            anim: 0, // 0-6 的动画形式，-1 不开启
            content: url
        });
    }
</script>
{include file="footer" /}
