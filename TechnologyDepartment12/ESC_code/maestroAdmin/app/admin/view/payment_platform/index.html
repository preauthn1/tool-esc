{include file="header" /}
<!-- Panel Other -->
<div class="ibox float-e-margins">
    <div class="ibox-title">
        <h5>充提币种</h5>
    </div>
    <div class="ibox-content">
        <div class="form-group clearfix col-sm-7">
            {if authCheck('payment_platform/add')}
            <a id="add" href="{:url('add')}">
                <button class="btn btn-outline btn-primary" type="button">添加</button>
            </a>
            {/if}
            {if authCheck('payment_platform/offline_pay_account') }
            <a id="offline_pay_account" href="{:url('offline_pay_account')}">
                <button class="btn btn-outline btn-primary" type="button">{:lang("线下支付-支付方式配置")}</button>
            </a>
            {/if}
        </div>
        <!--搜索框开始-->
        <form id='commentForm' role="form" method="post" class="form-inline pull-right">
            <div class="content clearfix m-b">
                <div class="form-group">
                    <label>名称：</label>
                    <input type="text" class="form-control" id="name" name="name" placeholder="名称/编码">
                </div>
                <div class="form-group">
                    <button class="btn btn-primary" type="button" style="margin-top:5px" id="search"><strong>搜
                        索</strong>
                    </button>
                </div>
            </div>
        </form>

        <!--搜索框结束-->
        <div class="example-wrap">
            <div class="example">
                <table id="cusTable">
                    <thead>
                    <th data-field="id">ID</th>
                    <th data-field="name">显示名称</th>
                    <th data-field="currency_type_str">货币类型</th>
                    <th data-field="currency_code">通道代码</th>
                    <th data-field="sort">排序</th>
                    <th data-field="min_recharge_money">最小充值金额</th>
                    <th data-field="min_withdraw_money">最小提现金额</th>
                    <th data-field="max_withdraw_money">最大提现金额</th>
                    <th data-field="recharge_is_show" data-formatter="rechargeStatusFormatter">充值是否开启</th>
                    <th data-field="withdraw_is_show" data-formatter="withdrawStatusFormatter">提现是否开启</th>
                    <th data-field="is_first_charge" data-formatter="isFirstChargeFormatter">首充渠道</th>
                    <th data-field="exchange_rate">汇率</th>
                    <th data-field="exchange_update_time">汇率更新时间</th>
                    <th data-field="image">图片</th>
                    <th data-field="operate">操作</th>
                    </thead>
                </table>
            </div>
        </div>
        <!-- End Example Pagination -->
    </div>
</div>
<script type="text/javascript">
    function rechargeStatusFormatter(value, row, index) {
        let checkbox = '';
        let checked = row.recharge_is_show ? 'checked' : ''
        checkbox = '  <div class="layui-form"><input type="checkbox" name="agreement" value="1" title="开启|关闭" lay-skin="switch" data-type="recharge" data-id="' + row.id + '" data-val="' + row.recharge_is_show + '" lay-filter="changeStatus"' + checked + '></div>';
        return [
            checkbox
        ].join('');
    }

    function withdrawStatusFormatter(value, row, index) {
        let checkbox = '';
        let checked = row.withdraw_is_show ? 'checked' : ''
        checkbox = '  <div class="layui-form"><input type="checkbox" name="withdraw_is_show" value="1" title="开启|关闭" lay-skin="switch" data-type="withdraw"  data-id="' + row.id + '" data-val="' + row.withdraw_is_show + '" lay-filter="changeStatus" ' + checked + '></div>';
        return [
            checkbox
        ].join('');
    }

    function isFirstChargeFormatter(value, row, index) {
        let checkbox = '';
        let checked = row.is_first_charge ? 'checked' : ''
        checkbox = '  <div class="layui-form"><input type="checkbox" name="is_first_charge" value="1" title="开启|关闭" lay-skin="switch" data-type="is_first_charge"  data-id="' + row.id + '" data-val="' + row.is_first_charge + '" lay-filter="changeStatus" ' + checked + '></div>';
        return [
            checkbox
        ].join('');
    }

    $(document).ready(function () {
        initTable();
        //当点击查询按钮的时候执行
        $("#search").bind("click", initTable);

        layui.use(['util', 'form'], function () {
            var util = layui.util;
            var form = layui.form;

            // checkbox 事件
            form.on('switch(changeStatus)', function (data) {
                var elem = data.elem; // 获得 checkbox 原始 DOM 对象
                let type = elem.dataset.type
                let id = elem.dataset.id
                let val = elem.dataset.val

                // 发起请求
                let url = "{:url('changeStatus')}"
                index = layer.load(0);
                $.ajax({
                    type: 'POST',
                    url: url,
                    data: {
                        id: id,
                        type: type,
                        val: val
                    },
                    dataType: 'json',
                    success: function (res) {
                        layer.closeLast('loading');
                        // 循环语言
                        layer.msg(res.msg)
                    },
                    error: function (xhr, type) {
                        layer.closeLast('loading');
                    }
                });
            });
        });
    });

    function queryParams(params) {   //设置查询参数
        params.name = $('#name').val()
        return params;
    }

    function onLoadSuccess(res) {
        $("#add").on('click', function (e) {
            add(e.currentTarget.href)
            return false;
        });
        $("#offline_pay_account").on('click', function (e) {
            add(e.currentTarget.href)
            return false;
        });
        $("td a").on('click', function (e) {
            add(e.currentTarget.href)
            return false;
        });
    }

    function add(url) {
        // 在此处输入 layer 的任意代码
        layer.open({
            type: 2,
            area: ['100%', '100%'],
            title: '添加/编辑',
            maxmin: true, // 允许全屏最小化
            anim: 0, // 0-6 的动画形式，-1 不开启
            content: url
        });
    }
</script>
{include file="footer" /}
