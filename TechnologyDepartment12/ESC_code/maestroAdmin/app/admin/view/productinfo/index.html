{include file="header" /}
<!-- Panel Other -->
<div class="ibox float-e-margins">
    <div class="ibox-title">
        <h5>{:lang("产品列表")}</h5>
    </div>
    <div class="ibox-content">
        <div class="form-group clearfix col-sm-7">
            <a id="add" href="{:url('productinfo/add')}">
                <button class="btn btn-outline btn-primary" type="button">{:lang("添加")}</button>
            </a>
            <a href="javascript:;" onclick="delAll();">
                <button class="btn btn-outline btn-danger" type="button">{:lang("删除")}</button>
            </a>
        </div>
        <!--搜索框开始-->
        <form id='commentForm' role="form" method="post" class="form-inline pull-right">
            <div class="content clearfix m-b">
                <div class="form-group">
                    <div class="form-group">
                        <label>{:lang("产品名称")}：</label>
                        <input type="text" class="form-control" id="ptitle" name="ptitle">
                    </div>
                </div>
                <div class="form-group">
                    <button class="btn btn-primary" type="button" style="margin-top:5px" id="search"><strong>{:lang('搜索')}</strong>
                    </button>
                </div>
            </div>
        </form>
        <!--搜索框结束-->
        <div class="example-wrap">
            <div class="example">
                <table id="cusTable">
                    <thead>
                    <th data-checkbox="true"></th><!--复选框-->
                    <th data-field="proorder">{:lang("排序")}</th>
                    <th data-field="id">{:lang("编号")}</th>
                    <th data-field="logo">{:lang("图片")}</th>
                    <th data-field="ptitle">{:lang("交易对")}</th>
                    <th data-field="isopen_str">{:lang("状态")}</th>
                    <th data-field="rands">{:lang("随机值")}</th>
                    <th data-field="vol">{:lang("24H成交额")}</th>
                    <th data-field="open">{:lang("开盘价")}</th>
                    <th data-field="high">{:lang("最高价")}</th>
                    <th data-field="low">{:lang("最低价")}</th>
                    <th data-field="close">{:lang("最新价")}</th>
                    <th data-field="change_rate">{:lang("涨幅比例")}</th>
                    <th data-field="update_time">{:lang("更新时间")}</th>
                    <th data-field="operate">{:lang("操作")}</th>
                    </thead>
                </table>
            </div>
        </div>
    </div>
</div>
<script type="text/javascript">
    tableCheckbox = true;
    $(document).ready(function () {
        initTable();
        //当点击查询按钮的时候执行
        $("#search").bind("click", initTable);
    });

    function queryParams(params) {   //设置查询参数
        params.pix = $('#pix').val();
        return params;
    }

    function delAll() {
        var getSelectRows = $("#cusTable").bootstrapTable('getSelections', function (row) {
            return row;
        });
        var ids = new Array();  // 定义js数组用于存放自己所需的值
        for (var i = 0; i < getSelectRows.length; i++) {
            ids[i] = getSelectRows[i].id;
        }
        if (ids.length <= 0) {
            layer.msg('请选择要操作的数据');
            return;
        }
        layer.confirm('确认操作吗?', {icon: 3, title: '提示'}, function (index) {
            $.getJSON("{:url('productinfo/del')}", {'id': ids}, function (res) {
                if (1 == res.code) {
                    layer.alert(res.msg, {title: "{:lang('友情提示')}", icon: 1, closeBtn: 0}, function (inx) {
                        layer.close(inx);
                        initTable();
                    });
                } else if (111 == res.code) {
                    window.location.reload();
                } else {
                    layer.alert(res.msg, {title: "{:lang('友情提示')}", icon: 2});
                }
            });

            layer.close(index);
        })
    }

    function onLoadSuccess(res) {
        $("#add").on('click', function (e) {
            add(e.currentTarget.href)
            return false;
        });
        $("td a").on('click', function (e) {
            add(e.currentTarget.href)
            return false;
        });
    }

    function add(url) {
        // 在此处输入 layer 的任意代码
        layer.open({
            type: 2,
            area: ['100%', '100%'],
            title: '添加/编辑',
            maxmin: true, // 允许全屏最小化
            anim: 0, // 0-6 的动画形式，-1 不开启
            content: url
        });
    }
</script>
{include file="footer" /}
