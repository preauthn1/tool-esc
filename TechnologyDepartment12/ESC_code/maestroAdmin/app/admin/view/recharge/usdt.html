<!-- Panel Other -->
<div class="ibox float-e-margins">
    <div class="ibox-title">
        <h5>{:lang("充币订单")}</h5>
    </div>
    <div class="ibox-content">
        <div id="toolbar">
            {if authCheck('recharge/add') }
<!--            <a id="add" href="{:url('add')}">-->

            {/if}
            <div id="stats" style=' float: right; padding: 8px 12px'></div>
        </div>
        <ul class="nav nav-tabs">
            <li style="color: #000" onclick="selectType(3)"
                class="status{$type} {if $type === 3} active {/if}"><a>三方</a>
            </li>
            <li style="color: #000" onclick="selectType(2)"
                class="status{$type} {if $type === 2} active {/if}"><a>合约</a>
            </li>
            <li style="color: #000" onclick="selectType(1)"
                class="status{$type} {if $type === 1} active {/if}"><a>线下充值</a>
            </li>
            <li style="color: #000" onclick="selectType(0)"
                class="status{$type} {if $type === 0} active {/if}"><a>手动补单</a>
            </li>
        </ul>
        <!--搜索框开始-->
        <form id='commentForm' role="form" method="post" class="form-inline" target="_blank" onkeydown="if (event.keyCode == 13) { return false; }">
            <div class="content clearfix m-b">
                <div class="form-group">
                    <label>{:lang("选择时间")}：</label>
                    <select class="form-control" id="time_type" name="time_type">
                        <option value="0" selected>{:lang("申请时间")}</option>
                        <option value="1">{:lang("成功时间")}</option>
                    </select>
                    <div class="layui-inline" id="ID-laydate-range">
                        <input type="text" class="form-control" id="start_time" name="startTime" placeholder="yyyy-MM-dd HH:mm:ss"
                               lay-key="1" autocomplete="off">
                        -
                        <input type="text" class="form-control" id="end_time" name="endTime" placeholder="yyyy-MM-dd HH:mm:ss"
                               lay-key="2" autocomplete="off">
                    </div>
                </div>
                                <div class="form-group">
                                    <label>{:lang("状态")}：</label>
                                    <select class="form-control" name="searchStatus" id="status">
                                        <option value="">请选择</option>
                                        {if !empty($status)}
                                        {foreach name="status" item="vo"}
                                        <option value="{$key}">{$vo}</option>
                                        {/foreach}
                                        {/if}
                                    </select>
                                </div>
                <div class="form-group layui-form">
                    <label>{:lang("所属代理")}：</label>
                    <div class="layui-inline">
                        <select lay-search="" id="leader1" name="leader1">
                            <option value="">所有</option>
                            {foreach name="agent" item="vo"}
                            <option value="{$vo.id}">{$vo.id}/{$vo.user_name}{$vo.remark? '('.$vo.remark.')' : ''}</option>
                            {/foreach}
                        </select>
                    </div>
                </div>
                <!--                <div class="form-group">-->
                <!--                    <label>{:lang("用户")}：</label>-->
                <!--                    <select class="form-control" name="vuser" id="vuser">-->
                <!--                        <option value="-1">所有</option>-->
                <!--                        <option value="0">真实</option>-->
                <!--                        <option value="1">虚拟</option>-->
                <!--                    </select>-->
                <!--                </div>-->
                <!--                <div class="form-group">-->
                <!--                    <label>{:lang("渠道")}：</label>-->
                <!--                    <select class="form-control" name="pay_id" id="pay_id">-->
                <!--                        <option value="">所有</option>-->
                <!--                        {if !empty($paylist)}-->
                <!--                        {volist name='paylist' id='row'}-->
                <!--                        <option value="{$row.id}">-->
                <!--                            {if isset($pay[$row['account']])}-->
                <!--                            [{$pay[$row['account']]['name']}]-->
                <!--                            {else}-->
                <!--                            [{$row.account}]-->
                <!--                            {/if}-->
                <!--                            {$row.bank_name}-->
                <!--                        </option>-->
                <!--                        {/volist}-->
                <!--                        {/if}-->
                <!--                    </select>-->
                <!--                </div>-->
                <div class="form-group">
                    <label>{:lang("搜索")}：</label>
                    <input type="text" class="form-control" id="searchText" name="searchText"
                           placeholder="订单号/用户名/txid/三方订单号/归集订单号">
                </div>
                <div class="form-group">
                    <label>{:lang("UID")}：</label>
                    <input type="text" class="form-control" id="user_id" name="user_id"
                           placeholder="用户名ID">
                </div>
                <input type="hidden" name="type" value="{$type}">
                <div class="form-group">
                    <input type="hidden" value="1" name="export"/>
                    <button class="btn btn-primary" type="button" style="margin-top:5px" id="search"><strong>{:lang('搜索')}</strong>
                    </button>
<!--                    <button class="btn btn-default" type="button" style="margin-top:5px" onclick="resetSearch();"><strong>{:lang('重置')}</strong></button>-->
                    <button class="btn btn-danger" type="submit" style="margin-top:5px" id="export"><strong>{:lang("导出")}</strong>
                    </button>
                </div>
            </div>
        </form>
        <!--搜索框结束-->
        <div class="example-wrap">
            <div class="example">
                <table id="cusTable"
                       data-toolbar="#toolbar"
                >
                    <thead>
                    <th data-field="userinfo" data-formatter="userInfoFormatter">{:lang("用户信息")}</th>
                    <th data-field="recharge_amount" data-formatter="rechargeAmountFormatter">{:lang("充值金额")}</th>
                    <th data-field="recharge_time" data-formatter="rechargeTimeFormatter">{:lang("充值时间")}</th>
                    <!--                    <th data-field="collect_process" data-formatter="collectProcessFormatter">{:lang("归集进度")}</th>-->
                    <th data-field="collect_info" data-formatter="collectInfoFormatter">{:lang("归集信息")}</th>
<!--                    <th data-field="collect_tx" data-formatter="collectTxFormatter">{:lang("归集tx")}</th>-->
                    <th data-field="operate" data-formatter="operateFormatter">{:lang("操作")}</th>
                    </thead>
                </table>
            </div>
        </div>
        <!-- End Example Pagination -->
    </div>
</div>
{include file="footer" /}
<script type="text/javascript">
    var $table = $('#cusTable');
    var $success = $("#success");
    var $remove = $("#remove");
    $remove.click(function () {
        var ids = getIdSelections();
        console.log(ids);
        checkStatus(ids.join(","), 3);
    });
    $success.click(function () {
        var ids = getIdSelections();
        console.log(ids);
        checkStatus(ids.join(","), 2);
    });

    function stateFormatter(value, row, index) {
        if (row.status !== 1) {
            return {
                disabled: true
            }
        }
        return value;
    }

    function selectType(type) {
        $(".nav-tabs").find("li").removeClass('active');
        $(".type" + type).addClass('active');
        window.location.href = "{:url('index')}?type=" + type
    }

    function operateFormatter(value, row, index) {
        let button = '';
        if (row.batch_no) {
            switch (row.cd_status) {
                case 3: // 归集成功
                    break;
                case 4: // 归集失败
                    button = ' <button type="button" class="layui-btn layui-bg-blue layui-btn-sm" lay-on="swap" data-id="' + row.id + '" data-batch_no="' + row.batch_no + '">重新归集</button>';
                    break;
                case 1: // 归集中
                default:
                    button = ' <button type="button" class="layui-btn layui-bg-blue layui-btn-sm" lay-on="check" data-id="' + row.id + '" data-batch_no="' + row.batch_no + '">查询归集</button>';

                    break;
            }
        } else if (row.pay_id) {
            button = ' <button type="button" class="layui-btn layui-bg-blue layui-btn-sm" lay-on="swap" data-id="' + row.id + '" data-batch_no="' + row.batch_no + '">重新归集</button>';
        }
        return [
            button
        ].join('');
    }

    // 用户信息
    function userInfoFormatter(value, row, index) {
        var html = "";
        html += "<p style=''>用户：" + row.uid + "/" + row.user_name + "</a>";
        html += "<p>订单号：" + row.order_id + "</p>";
        html += "<p>三方订单号：" + row.trade_no + "</p>";
        html += "<p>发送地址：" + row.from_address + "</p>";
        html += "<p>接收地址：" + row.to_address + "</p>";
        if (Object.keys(row.top_leader).length > 0) {
            html += "<p style=''" +
                " data-user_name='"+row.top_leader.user_name+"' data-user_id='"+row.top_leader.id+"'" +
                ">顶级代理：" + row.top_leader.id + "/" +row.top_leader.user_name + (row.top_leader.remark? "（"+row.top_leader.remark+"）": '')+"</p>";
        }
        html += "<p>等级：" + row.tree_level + "</p>";
        if (row.is_xuni == 1) {
            return "<span style='color:red'>" + html + "</span>";
        }
        return "<span>" + html + "</span>";
    }

    // 充值金额
    function rechargeAmountFormatter(value, row, index) {
        var html = "";
        let channel_name = '未知';
        if (row.pay_id) {
            switch (row.channel.name) {
                case 'TRC20-USDT':
                    channel_name = '<span style="color: purple;">' + row.channel.name + '</span>'
                    break;
                case 'TRX':
                    channel_name = '<span style="color: green;">' + row.channel.name + '</span>'
                    break;
                case 'BEP20-USDT':
                    channel_name = '<span style="color: orange">' + row.channel.name + '</span>'
                    break;
                case 'BNB':
                    channel_name = '<span style="color: orangered;">' + row.channel.name + '</span>'
                    break;
                default:
            }
        }
        let is_first = row.is_first ? '<span style="color: #33e16eba;">首充</span>' : '<span style="color: #c8c2b6">累充</span>';
        html += "<p>币种/首充：" + channel_name + "/" + is_first + "</a>";
        html += "<p>原始金额：" + row.original_money + "</p>";
        html += "<p>汇率：" + row.exchange_rate + "</p>";
        html += "<p>充值金额：" + row.money + "</p>";
        return "<span>" + html + "</span>";
    }

    // 充值时间
    function rechargeTimeFormatter(value, row, index) {
        var html = "";
        html += "<p>账户类型：基础账户</a>";
        html += "<p>充值tx：" + row.txid + "</p>";
        html += "<p>充值时间：" + row.success_time + "</p>";
        html += "<p>tx时间：" + row.create_time + "</p>";
        return "<span>" + html + "</span>";
    }

    // 归集进度
    function collectProcessFormatter(value, row, index) {
        var html = "";
        html += "<p>归集进度：</a>";
        html += "<p>状态信息：</p>";
        html += "<p>购买能量：</p>";
        html += "<p>归集状态：</p>";
        return "<span>" + html + "</span>";
    }

    // 归集信息
    function collectInfoFormatter(value, row, index) {
        let collection_status = '';
        if (row.batch_no) {
            switch (row.cd_status) {
                case 3:
                    collection_status = '<span style="color: #33e16eba;">归集成功</span>';
                    break;
                case 4:
                    collection_status = '<span style="color: red;">归集失败</span>';
                    break;
                case 1:
                    collection_status = '<span style="color: #c8c2b6">处理中</span>';
                    break;
            }
        }
        var html = "";
        html += "<p>归集金额：" + row.cd_amount + "</a>";
        // html += "<p>tx手续费：</p>";
        html += "<p>发送地址：" + row.cd_from_address + "</p>";
        html += "<p>接收地址：" + row.cd_to_address + "</p>";
        html += "<p>归集状态：" + collection_status + "</p>";
        html += "<p>归集订单号：" + row.batch_no + "</p>";
        return "<span>" + html + "</span>";
    }

    // 归集信息
    function collectTxFormatter(value, row, index) {
        var html = "";
        html += "<p>txID：</a>";
        html += "<p>tx时间：</p>";
        html += "<p>操作员：</p>";
        html += "<p>操作时间：</p>";
        return "<span>" + html + "</span>";
    }

    function text2Formatter(value, row, index) {
        if (row.is_xuni == 1) {
            return "<span style='color:red'>" + value + "</span>";
        }
        return "<span>" + value + "</span>";
    }

    function getIdSelections() {
        return $.map($table.bootstrapTable('getSelections'), function (row) {
            return row.id
        })
    }

    function initTable() {
        //先销毁表格
        $table.bootstrapTable('destroy');
        //初始化表格,动态从服务器加载数据
        $table.bootstrapTable({
            method: "get",  //使用get请求到服务器获取数据
            url: "{:url('index')}", //获取数据的地址
            striped: true,  //表格显示条纹
            pagination: true, //启动分页
            pageSize: 100,  //每页显示的记录数
            pageNumber: 1, //当前第几页
            pageList: [10, 30, 50, 100, 500],  //记录数可选列表
            sidePagination: "server", //表示服务端请求
            paginationFirstText: "{:lang('首页')}",
            paginationPreText: "{:lang('上一页')}",
            paginationNextText: "{:lang('下一页')}",
            paginationLastText: "{:lang('尾页')}",
            queryParamsType: "undefined",
            queryParams: function queryParams(params) {   //设置查询参数
                params.user_id = $('#user_id').val();
                params.searchText = $('#searchText').val();
                params.searchStatus = $('#status').val();
                params.startTime = $('#start_time').val();
                params.endTime = $('#end_time').val();
                params.vuser = $('#vuser').val();
                params.pay_id = $('#pay_id').val();
                params.leader1 = $('#leader1').val();
                params.type = 2;
                params.time_type = $('#time_type').val();
                return params;
            },
            onLoadSuccess: function (res) {  //加载成功时执行
                if (111 == res.code) {
                    window.location.reload();
                }
                var stathtml = '';
                if (res.stat) {
                    $.each(res.stat, function (i, v) {
                        stathtml += '<span class="label label-success">' + v.text + '：' + v.total + '</span>';
                    })
                }
                $("#stats").html(stathtml);
                layer.msg("{:lang('加载成功')}", {time: 1000});
            },
            onLoadError: function () {  //加载失败时执行
                layer.msg("{:lang('加载数据失败')}");
            }
        });
        $table.on('check.bs.table uncheck.bs.table ' + 'check-all.bs.table uncheck-all.bs.table', function () {
            $remove.prop('disabled', !$table.bootstrapTable('getSelections').length);
            $success.prop('disabled', !$table.bootstrapTable('getSelections').length);
        })
    }

    // 重置搜索条件
    // function resetSearch() {
    // }
    $(document).ready(function () {
        layui.use(['laydate', 'util'], function () {
            var laydate = layui.laydate;
            var util = layui.util;

          // 日期范围 - 左右面板独立选择模式
            laydate.render({
              elem: '#ID-laydate-range',
              range: ['#start_time', '#end_time'],
              rangeLinked: true, // 开启日期范围选择时的区间联动标注模式 ---  2.8+ 新增
              type: 'datetime',
            });

            util.on({
                check: function (e) {
                    let id = e.data('id')
                    let batch_no = e.data('batch_no')
                    // 查询归集结果
                    let url = "{:url('recharge/swapCheck')}?id=" + id
                    index = layer.load(0);
                    $.ajax({
                        type: 'POST',
                        url: url,
                        dataType: 'json',
                        success: function (res) {
                            layer.closeLast('loading');
                            layer.msg(res.msg)
                            setTimeout(() => {
                                initTable();
                            }, 3000)
                        },
                        error: function (xhr, type) {
                            layer.closeLast('loading');
                        }
                    });
                },
                swap: function (e) {
                    let id = e.data('id')
                    let batch_no = e.data('batch_no')
                    let url = "{:url('recharge/swapSingle')}?id=" + id
                    index = layer.load(0);
                    $.ajax({
                        type: 'POST',
                        url: url,
                        dataType: 'json',
                        success: function (res) {
                            layer.closeLast('loading');
                            layer.msg(res.msg)
                            setTimeout(() => {
                                initTable();
                            }, 3000)
                        },
                        error: function (xhr, type) {
                            layer.closeLast('loading');
                        }
                    });
                },
            });
        });
        //调用函数，初始化表格
        initTable();
        //当点击查询按钮的时候执行
        $("#search").bind("click", initTable);
    });

    function checkStatus(id, status) {
        layer.open({
            title: "审核确认框",
            type: 1,
            content: $("#operateTmplate"),
            area: ['400px', '280px'],
            btn: ['确认审核' + (status == 2 ? '成功' : '失败'), '取消'],
            yes: function (index, layero) {
                var remark = layero.find(".remark").val();
                if (!remark) {
                    layer.msg('请填写备注');
                    return;
                }
                $.getJSON("{:url('recharge/checkStatus')}", {
                    'id': id,
                    'status': status,
                    remark: remark
                }, function (res) {
                    if (1 == res.code) {
                        layer.close(index);
                        layer.alert(res.msg, {title: "{:lang('友情提示')}", icon: 1, closeBtn: 0}, function (inx) {
                            layer.close(inx);
                            initTable();
                        });
                    } else if (111 == res.code) {
                        window.location.reload();
                    } else {
                        layer.msg(res.msg);
                    }
                });
            }
        });
    }

    function withdrawDel(id) {
        layer.confirm('确认删除此记录?', {icon: 3, title: '提示'}, function (index) {
            //do something
            $.getJSON("{:url('recharge/rechargeDel')}", {'id': id}, function (res) {
                if (1 == res.code) {
                    layer.alert(res.msg, {title: "{:lang('友情提示')}", icon: 1, closeBtn: 0}, function (inx) {
                        layer.close(inx);
                        initTable();
                    });
                } else if (111 == res.code) {
                    window.location.reload();
                } else {
                    layer.alert(res.msg, {title: "{:lang('友情提示')}", icon: 2});
                }
            });
            layer.close(index);
        })
    }

    $("#add").on('click', function (e) {
        add(e.currentTarget.href)
        return false;
    });

    function add(url) {
        // 在此处输入 layer 的任意代码
        layer.open({
            type: 2,
            area: ['100%', '100%'],
            title: '添加/编辑',
            maxmin: true, // 允许全屏最小化
            anim: 0, // 0-6 的动画形式，-1 不开启
            content: url
        });
    }
</script>
