    {include file="header" /}
    <div class="row">
        <div class="col-sm-12">
            <div class="ibox float-e-margins">
                <div class="ibox-title">
                    <h5>{:lang("手动补单")}</h5>
                </div>
                <div class="ibox-content">
                    <form class="form-horizontal m-t" id="dataForm" method="post" action="{:url('recharge/add', ['win' => $win])}">
                        <div class="form-group">
                            <label class="col-sm-4 control-label">用户ID或手机号码：</label>
                            <div class="input-group col-sm-8">
                                <input type="text" class="form-control" placeholder="填写用户ID或手机号码" name="user_id" required="" aria-required="true" value="{$user_id}">
                            </div>
                        </div>
                        <div class="form-group">
                            <label class="col-sm-4 control-label">充值金额：</label>
                            <div class="input-group col-sm-8">
                                <input type="text" class="form-control" autocomplete="off" name="money" required="" aria-required="true" value="">
                            </div>
                        </div>
                        <div class="form-group">
                            <div class="col-sm-4 col-sm-offset-6">
                                <button class="btn btn-primary" type="submit" onclick="return window.confirm('确认提交？')">提交</button>
                            </div>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
{include file="footer" /}
