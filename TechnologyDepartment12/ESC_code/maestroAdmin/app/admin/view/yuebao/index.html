<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>余额宝记录</title>
    <link rel="shortcut icon" href="{$admin_icon|toMedia}">
    <link href="/static/admin/css/bootstrap.min.css?v=3.3.6" rel="stylesheet">
    <link href="/static/admin/css/font-awesome.min.css?v=4.4.0" rel="stylesheet">
    <link href="/static/admin/css/plugins/bootstrap-table/bootstrap-table.min.css" rel="stylesheet">
    <link href="/static/admin/css/animate.min.css" rel="stylesheet">
    <link href="/static/admin/css/style.min.css?v=4.1.0" rel="stylesheet">
    <link href="/static/admin/css/plugins/sweetalert/sweetalert.css" rel="stylesheet">
</head>
<body class="gray-bg">
<div class="wrapper wrapper-content animated fadeInRight">
    <!-- Panel Other -->
    <div class="ibox float-e-margins">
        <div class="ibox-title">
            <h5>{:lang("余额宝记录")}</h5>
        </div>
        <div class="ibox-content">
            <!--搜索框开始-->
            <form id='commentForm' role="form" method="post" class="form-inline pull-right">
                <div class="content clearfix m-b">
                    <div class="form-group">
                        <label>{:lang("选择时间")}：</label>
                        <input type="text" class="form-control" id="start_time" name="startTime" placeholder="yyyy-MM-dd" lay-key="1" autocomplete="off">
                        -
                        <input type="text" class="form-control" id="end_time" name="endTime" placeholder="yyyy-MM-dd" lay-key="2" autocomplete="off">
                    </div>
                    <div class="form-group">
                        <label>{:lang("状态")}：</label>
                        <select class="form-control" name="status" id="status" >
                            <option value="">请选择</option>
                            {if !empty($status)}
                            {foreach name="status" item="vo"}
                            <option value="{$key}">{$vo}</option>
                            {/foreach}
                            {/if}
                        </select>
                    </div>
                    <div class="form-group">
                        <label>{:lang("用户类型")}：</label>
                        <select class="form-control" id="is_xuni" name="is_xuni">
                            <option value="-1">所有</option>
                            <option value="1">虚拟用户</option>
                            <option value="0">真实用户</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>{:lang("周期")}：</label>
                        <select class="form-control" name="days" id="days" >
                            <option value="">所有周期</option>
                            {foreach name="rate" item="vo"}
                            <option value="{$vo.days}">{$vo.days} 天</option>
                            {/foreach}
                        </select>
                    </div>
                    <div class="form-group">
                        <label>{:lang("用户账号")}：</label>
                        <input type="text" class="form-control" id="realname" name="realname">
                    </div>
                    <div class="form-group">
                        <button class="btn btn-primary" type="button" style="margin-top:5px" id="search"><strong>{:lang('搜索')}</strong>
                        </button>
                    </div>
                </div>
            </form>
            <!--搜索框结束-->
            <div class="example-wrap">
                <div class="example">
                    <div id="stats" style="clear: both;"></div>
                    <table id="cusTable">
                        <thead>
                        <th data-field="id">{:lang("ID")}</th>
                        <th data-field="mobile" data-formatter="textFormatter">{:lang("用户账号")}</th>
                        <th data-field="money" data-formatter="textFormatter">{:lang("金额")}</th>
                        <th data-field="principal" data-formatter="textFormatter">{:lang("本金")}</th>
                        <th data-field="gray">{:lang("利息")}</th>
                        <th data-field="rate">{:lang("利率")}</th>
                        <th data-field="days">{:lang("周期（天）")}</th>
                        <th data-field="status">{:lang("状态")}</th>
                        <th data-field="create_time">{:lang("存入时间")}</th>
                        <th data-field="operate">{:lang("操作")}</th>
                        </thead>
                    </table>
                </div>
            </div>
            <!-- End Example Pagination -->
        </div>
    </div>
</div>
<!-- End Panel Other -->
<script src="/static/admin/js/jquery.min.js?v=2.1.4"></script>
<script src="/static/admin/js/bootstrap.min.js?v=3.3.6"></script>
<script src="/static/admin/js/content.min.js?v=1.0.0"></script>
<script src="/static/admin/js/plugins/bootstrap-table/bootstrap-table.min.js"></script>
<script src="/static/admin/js/plugins/bootstrap-table/bootstrap-table-mobile.min.js"></script>
<script src="/static/admin/js/plugins/bootstrap-table/locale/bootstrap-table-zh-CN.min.js"></script>
<script src="/static/admin/js/plugins/suggest/bootstrap-suggest.min.js"></script>
<script src="/static/admin/js/plugins/layer/laydate/laydate.js"></script>
<script src="/static/admin/js/plugins/sweetalert/sweetalert.min.js"></script>
<script src="/static/admin/js/plugins/layer3/layer.js"></script>
<script src="/static/admin/js/layui/layui.js"></script>
<script type="text/javascript">
    function textFormatter(value, row, index) {
        if (row.is_xuni == 1) {
            return "<span style='color:red'>"+value+"</span>";
        }
        return "<span>"+value+"</span>";
    }
    function initTable() {
        //先销毁表格
        $('#cusTable').bootstrapTable('destroy');
        //初始化表格,动态从服务器加载数据
        $("#cusTable").bootstrapTable({
            method: "get",  //使用get请求到服务器获取数据
            url: "./index", //获取数据的地址
            striped: true,  //表格显示条纹
            pagination: true, //启动分页
            pageSize: 10,  //每页显示的记录数
            pageNumber:1, //当前第几页
            pageList: [5, 10, 15, 20, 25],  //记录数可选列表
            sidePagination: "server", //表示服务端请求
            paginationFirstText: "{:lang('首页')}",
            paginationPreText: "{:lang('上一页')}",
            paginationNextText: "{:lang('下一页')}",
            paginationLastText: "{:lang('尾页')}",
            queryParamsType : "undefined",
            queryParams: function queryParams(params) {   //设置查询参数
                params.searchText = $('#realname').val();
                params.days = $('#days').val();
                params.searchStatus = $('#status').val();
                params.startTime = $('#start_time').val();
                params.endTime = $('#end_time').val();
                params.is_xuni = $('#is_xuni').val();
                return params;
            },
            onLoadSuccess: function(res){  //加载成功时执行
                if(111 == res.code){
                    window.location.reload();
                }
                layer.msg("{:lang('加载成功')}", {time : 1000});
                $("#stats").html(res.stat_text);
            },
            onLoadError: function(){  //加载失败时执行
                layer.msg("{:lang('加载数据失败')}");
            }
        });
    }

    $(document).ready(function () {
        layui.use('laydate', function(){
            var laydate = layui.laydate;
            laydate.render({
                elem: '#start_time'
                ,trigger: 'click'
            });
            laydate.render({
                elem: '#end_time'
                ,trigger: 'click'
            });
        });
        //调用函数，初始化表格
        initTable();
        //当点击查询按钮的时候执行
        $("#search").bind("click", initTable);
    });

    function checkStatus(id, status){
        layer.confirm('确认转出?', {icon: 3, title:'提示'}, function(index){
            //do something
            $.getJSON("{:url('yuebao/checkStatus')}", {'id' : id, 'status': status}, function(res){
                if(1 == res.code){
                    layer.alert(res.msg, {title: "{:lang('友情提示')}", icon: 1, closeBtn: 0}, function(inx){
                        layer.close(inx);
                        initTable();
                    });
                }else if(111 == res.code){
                    window.location.reload();
                }else{
                    layer.alert(res.msg, {title: "{:lang('友情提示')}", icon: 2});
                }
            });
            layer.close(index);
        })
    }
</script>
</body>
</html>
