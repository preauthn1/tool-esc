{include file="header" /}
<style>
    .layui-form-label {
        width: 120px !important;
    }
    .layui-input-block {
        margin-left: 150px !important;
    }
    .layui-form-item .layui-input-inline {
        margin-left: 20px;
        width: 250px;
    }
</style>
<div class="ibox float-e-margins">
    <div class="ibox-content">
        <form class="layui-form" lay-filter="investTimeForm">
            <input type="hidden" name="id" value="{$info.id|default=''}">

            <div class="layui-form-item">
                <label class="layui-form-label">{:lang('时间范围')}：</label>
                <div class="layui-input-inline">
                    <input type="text" class="layui-input" id="ID-laydate-range-time" name="session" placeholder=" - ">
                </div>
            </div>

            <div class="layui-form-item">
                <label class="layui-form-label">{:lang("广告库存类型")}</label>
                <div class="layui-input-inline">
                    {foreach name="level_types" item="vo"}
                        <input type="checkbox" name="level_type" value="{$key}" title="{$vo}" {if isset($info.level_types) && in_array($key, explode(',', $info.level_types))}checked{/if}>
                    {/foreach}
                </div>
            </div>

            <div class="layui-form-item">
                <label class="layui-form-label">{:lang('排序')}：</label>
                <div class="layui-input-inline">
                    <input id="end_time" type="text" class="layui-input" name="sort"
                        value="{$info.sort|default='0'}" lay-verify="required">
                </div>
            </div>

            <div class="hr-line-dashed"></div>
            <div class="layui-form-item">
                <div class="layui-input-block">
                    <button class="layui-btn" lay-submit lay-filter="submitBtn">{:lang('提交')}</button>
                </div>
            </div>
        </form>
    </div>
</div>
<script type="text/javascript">
    layui.use(['form', 'laydate'], function(){
        var form = layui.form,
            laydate = layui.laydate;

        // 时间范围
        laydate.render({
            elem: '#ID-laydate-range-time',
            type: 'time',
            range: true,
            value: '{$info.start_time} - {$info.end_time}'
        });

        //监听提交
        form.on('submit(submitBtn)', function(data){
            console.log(data.field); // 调试用，查看提交的数据
            var loadIndex = layer.load(2, {shade: [0.3, '#fff']});

            var level_types = [];
            $("input:checkbox[name=level_type]:checked").each(function(i) {
              level_types[i] = $(this).val();
            })
            data.field.level_types = level_types.join(',')
            $.ajax({
                url: "{:url('taskSession/edit')}",
                type: 'POST',
                dataType: 'json',
                data: data.field,
                success: function(res) {
                    layer.close(loadIndex);
                    if (res.code == 1) {
                        parent.layer.msg(res.msg);
                        parent.location.reload();
                        var index = parent.layer.getFrameIndex(window.name);
                        parent.layer.close(index);
                    } else {
                        layer.msg(res.msg);
                    }
                },
                error: function() {
                    layer.close(loadIndex);
                    layer.msg('{:lang("网络错误")}');
                }
            });
            return false;
        });
    });
</script>
{include file="footer" /}
