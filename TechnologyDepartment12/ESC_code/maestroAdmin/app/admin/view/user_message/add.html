{include file="header" /}
<style>
    .layui-form-label {
        box-sizing: content-box;
    }
</style>
<div class="row" style="background-color: white">
    <form class="layui-form" id="commentForm" method="post" action="{:url('user_message/add')}">
        <div class="layui-form-item">
            <label class="layui-form-label">发送方式</label>
            <div class="layui-form">
                <input type="radio" name="batch_edit_type"
                       lay-filter="batch_edit_type"
                       value="1" title="按等级" checked="checked">
                <input type="radio" name="batch_edit_type"
                       lay-filter="batch_edit_type"
                       value="2" title="指定会员下级">
            </div>
        </div>
        <div class="layui-form-item batch_edit_type_1">
            <div class="layui-form-item">
                <label class="layui-form-label">接收对象</label>
                <div class="layui-form">
                    <div class="layui-input-block">
                        {foreach name="levels" item="vo" key="k"}
                        <input type="checkbox" name="level_id[{$k}]" lay-skin="primary" title="{$vo.level_name}" value="{$vo.level_id}">
                        {/foreach}
                        <br>
                        <tip style="color: red">Tips：将同时发送给选中分组和指定会员。指定会员账号，请用英文逗号“,”分隔。
                        </tip>
                    </div>
                </div>
            </div>
            <div class="layui-form-item">
                <label class="layui-form-label">指定会员</label>
                <div class="layui-input-block">
                    <textarea name="specify_member" rows="5" class="layui-textarea"
                              placeholder="会员账号请用英文逗号“,”分隔"></textarea>
                </div>
            </div>
        </div>
        <div class="layui-form-item batch_edit_type_2" hidden>
            <div class="layui-inline">
                <label class="layui-form-label">指定账号</label>
                <div class="layui-input-inline" style="float: right">
                    <input type="text" id="account_2" name="account" class="layui-input"
                           onblur="calculateCount(2)">
                    <tip>下级总数：<span style="font-weight: bolder;color: red"
                                        id="junior_count_2">0</span>个
                    </tip>
                </div>
            </div>
        </div>
        <div class="layui-form-item">
            <input type="hidden" name="is_pop" value="0" title="否" checked>
            <label class="layui-form-label">是否弹窗</label>
            <div class="layui-input-block">
                <div class="layui-form">
                    <input type="radio" name="is_pop" value="0" title="否" checked>
                    <input type="radio" name="is_pop" value="1" title="是">
                </div>
            </div>
        </div>

        <div class="layuimini-main" id="app">
            <div class="layui-tab layui-tab-brief" lay-filter="docDemoTabBrief">
                <ul class="layui-tab-title">
                    <li class="layui-this">标题</li>
                    <li>内容</li>
                </ul>
                <div class="layui-tab-content">
                    <div class="layui-tab-item layui-show">
                        <div class="layui-form-item">
                            <label class="layui-form-label">标题原文</label>
                            <div class="layui-input-block">
                                <input type="text" id="title" name="title" class="layui-input" lay-verify="required"
                                       placeholder="请输入通知消息的标题信息" value="">
                            </div>
                        </div>
                    </div>
                    <div class="layui-tab-item">
                        <div class="layui-form-item">
                            <label class="layui-form-label">内容原文</label>
                            <div class="layui-input-block">
                                    <textarea id="content" name="content" rows="5"
                                              class="layui-textarea editor"></textarea>
                            </div>

                        </div>
                    </div>
                </div>
            </div>
        </div>
        <div class="form-group">
            <div class="col-sm-4 col-sm-offset-6">
                <button class="btn btn-primary" type="submit">{:lang("提交")}</button>
            </div>
        </div>
    </form>
</div>
<script>
    var index = '';

    function calculateCount(num = 2) {
        layui.use(["jquery"], function () {
            let $ = layui.jquery;
            let accountElement = document.getElementById('account_' + num);
            $.ajax({
                url: "{:url('member/lower_level_count')}",
                type: "GET", // type ---> 请求方式
                data: {
                    user_name: accountElement.value,//开始时间
                },
                async: true, // async----> 同步：false，异步：true
                success: function (result) { //返回接受信息
                    if (result.code == 1) {
                        $("#junior_count_" + num).html(result.data);
                    } else {
                        layer.msg(result.msg, {'time': 1000, icon: 5});
                    }
                }
            });
        })
    }


    function showStart(){
        index = layer.load(0, {shade: false});
        return true;
    }

    function showSuccess(res){
        layer.ready(function(){
            layer.close(index);
            if(1 == res.code){
                layer.alert(res.msg, {title: "{:lang('友情提示')}", icon: 1, closeBtn: 0}, function(){
                    // window.location.href = res.data;
                    var index = parent.layer.getFrameIndex(window.name); // 先得到当前 iframe 层的索引
                    parent.layer.close(index);
                });
            }else if(111 == res.code){
                window.location.reload();
            }else{
                layer.msg(res.msg, {anim: 6});
            }
        });
    }

    $(document).ready(function () {
        var options = {
            beforeSubmit:showStart,
            success:showSuccess
        };

        $('#commentForm').submit(function(){
            $(this).ajaxSubmit(options);
            return false;
        });

        layui.use(['form'], function () {
            var form = layui.form
            form.on("radio(batch_edit_type)", function (data) {
                if (this.value == 1) {
                    $("input[name='batch_edit_type'][value='1']").prop('checked', true);
                    $('.batch_edit_type_1').show();
                    $('.batch_edit_type_2').hide();
                    form.render('radio');
                } else if (this.value == 2) {
                    $("input[name='batch_edit_type'][value='2']").prop('checked', true);
                    $('.batch_edit_type_2').show();
                    $('.batch_edit_type_1').hide();
                    form.render('radio');
                } else {

                }
                form.render($('#batch_edit_type'));

            });
            form.render($('#batch_edit_type'));
        })
    });
</script>
{include file="footer" /}
