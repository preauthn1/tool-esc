{include file="header" /}
    <!-- Panel Other -->
    <div class="ibox float-e-margins">
        <div class="ibox-title">
            <h5>{:lang("订单列表")}</h5>
        </div>
        <div class="ibox-content">
            <!--搜索框开始-->
            <form id='commentForm' role="form" method="post" class="form-inline pull-right">
                <div class="content clearfix m-b">
                    <div class="form-group">
                        <label>{:lang("选择时间")}：</label>
                        <input type="text" class="form-control" id="start_time" name="start_time" value="" placeholder="yyyy-MM-dd" lay-key="1" autocomplete="off">
                        -
                        <input type="text" class="form-control" id="end_time" name="end_time" value="" placeholder="yyyy-MM-dd" lay-key="2" autocomplete="off">
                    </div>
                    <div class="form-group">
                        <label>{:lang("手机号")}：</label>
                        <input type="text" class="form-control" id="ordersn" name="ordersn">
                    </div>
                    <div class="form-group">
                        <button class="btn btn-primary" type="button" style="margin-top:5px" id="search"><strong>{:lang('搜索')}</strong>
                        </button>
                    </div>
                </div>
            </form>
            <!--搜索框结束-->
            <div class="example-wrap">
                <div class="example">
                    <table id="cusTable">
                        <thead>
                        <th data-field="user_id">{:lang("用户ID")}</th>
                        <th data-field="mobile">{:lang("手机号")}</th>
                        <th data-field="goods.retail_price">{:lang("参与金额")}</th>
                        <th data-field="goods.return_bonus">{:lang("佣金")}</th>
                        <th data-field="create_time">{:lang("申请时间")}</th>
                        <th data-field="status">{:lang("状态")}</th>
                        <th data-field="operate">{:lang("操作")}</th>
                        </thead>
                    </table>
                </div>
            </div>
            <!-- End Example Pagination -->
        </div>
    </div>
    
{include file="footer" /}
<script type="text/javascript">
    index_url = "{:url('grab')}"
    $(document).ready(function () {
        layui.use('laydate', function(){
            var laydate = layui.laydate;
            laydate.render({
                elem: '#start_time'
                ,trigger: 'click'
            });
            laydate.render({
                elem: '#end_time'
                ,trigger: 'click'
            });
        });
        initTable();
        //当点击查询按钮的时候执行
        $("#search").bind("click", initTable);
    });
    function queryParams(params) {   //设置查询参数
        params.searchText = $('#ordersn').val()
        return params;
    }

</script>
<style>
    .operateBox{
        padding: 10px 15px;
    }
</style>
<div id="operateTmplate" style="display: none;">
    <div class="operateBox">
        <div class="form-group">
            <label>{:lang('商品列表')}</label>
            <select class="form-control" id='goods_id' name='goods_id'>
                {volist name='goods_list' id='row'}
                <option value="{$row.goods_id}" data-pric="">({$row.retail_price|i18n_number_format}) {$row.goods_name}</option>
                {/volist}
            </select>
        </div>
    </div>
</div>
<script>
function grab(id){
    layer.open({
        title:"分配商品订单",
        type:1,
        content:$("#operateTmplate"),
        area: ['400px', '280px'],
        btn: ['分配', '取消'],
        yes:function(index, layero){
            var goods_id = layero.find("#goods_id").val();
            if (!goods_id) {
                layer.msg('请选择商品');
                return;
            }
            $.getJSON("{:url('order/grab')}", {id : id, goods_id:goods_id, act:'grab'}, function(res){
                if(1 == res.code){
                    layer.close(index);
                    layer.alert(res.msg, {title: "{:lang('友情提示')}", icon: 1, closeBtn: 0}, function(inx){
                        layer.close(inx);
                        initTable();
                    });
                }else if(111 == res.code){
                    window.location.reload();
                }else{
                    layer.msg(res.msg);
                }
            });
        }
    });
}
// 拒绝回购
$(document).on('click', '.grabEvent', function() {
    var id = $(this).data('id');
    grab(id)
})
</script>
