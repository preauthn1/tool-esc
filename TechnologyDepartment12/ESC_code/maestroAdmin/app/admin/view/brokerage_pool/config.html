{include file="header" /}
<div style="padding: 20px;">
    <table id="commissionTable" class="layui-table">
        <thead>
            <tr>
                <th>达成团队活跃人数</th>
                <th>领取金额</th>
                <th>操作</th>
            </tr>
        </thead>
        <tbody>
            <!-- 回显数据 -->
            {volist name="brokerage_pool_config" id="config"}
            <tr>
                <td><input type="number" class="layui-input" name="active_num[]" value="{$config.active_num}" placeholder="请输入人数"></td>
                <td><input type="number" class="layui-input" name="amount[]" value="{$config.amount}" placeholder="请输入金额"></td>
                <td><button class="layui-btn layui-btn-danger" onclick="deleteRow(this)">删除</button></td>
            </tr>
            {/volist}
        </tbody>
    </table>
    <button id="addRowBtn" class="layui-btn layui-btn-normal" style="margin-top: 10px;">添加一行</button>
    <button id="saveBtn" class="layui-btn" style="margin-top: 10px;">保存</button>
</div>

<script>
    layui.use(['jquery'], function () {
        var $ = layui.jquery;

        // 添加一行
        $('#addRowBtn').on('click', function () {
            const newRow = `
                <tr>
                    <td><input type="number" class="layui-input" name="active_num[]" placeholder="请输入人数"></td>
                    <td><input type="number" class="layui-input" name="amount[]" placeholder="请输入金额"></td>
                    <td><button class="layui-btn layui-btn-danger" onclick="deleteRow(this)">删除</button></td>
                </tr>`;
            $('#commissionTable tbody').append(newRow);
        });

        // 保存数据
        $('#saveBtn').on('click', function () {
            const data = [];
            $('#commissionTable tbody tr').each(function () {
                const activeNum = $(this).find('input[name="active_num[]"]').val();
                const amount = $(this).find('input[name="amount[]"]').val();
                if (activeNum && amount) {
                    data.push({ active_num: activeNum, amount: amount });
                }
            });

            $.ajax({
                url: '{:url("config/index")}',
                type: "POST",
                data: { brokerage_pool_config: JSON.stringify(data) },
                success: function (res) {
                    if (res.code === 1) {
                        layer.msg('保存成功', { icon: 1 });
                    } else {
                        layer.msg('保存失败: ' + res.msg, { icon: 2 });
                    }
                },
                error: function () {
                    layer.msg('请求失败', { icon: 2 });
                }
            });
        });
    });

    // 删除一行
    function deleteRow(button) {
        $(button).closest('tr').remove();
    }
</script>
{include file="footer" /}
