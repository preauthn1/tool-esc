{include file="header" /}
    <!-- Panel Other -->
    <div class="ibox float-e-margins">
        <div class="ibox-title">
            <h5>{$title|lang}</h5>
        </div>
        <div class="ibox-content">
            <form id='commentForm' role="form" method="post" class="form-inline pull-right">
                <div class="content clearfix m-b">
                    <div class="form-group">
                        <label>{:lang("选择IP类型")}：</label>
                        <select class="form-control" id="ip_type" name="ip_type">
                            <option value="0" selected>注册IP</option>
                            <option value="1">登录IP</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>{:lang("选择时间")}：</label>
                        <input type="text" class="form-control" id="start_time" name="startTime" placeholder="yyyy-MM-dd" lay-key="1" autocomplete="off">
                        -
                        <input type="text" class="form-control" id="end_time" name="endTime" placeholder="yyyy-MM-dd" lay-key="2" autocomplete="off">
                    </div>
                    <div class="form-group">
                        <button class="btn btn-primary" type="button" style="margin-top:5px" id="search"><strong>{:lang('搜索')}</strong></button>
                    </div>
                </div>
            </form>
            <div class="example-wrap">
                <div class="example">
                    <table id="cusTable">
                        <thead>
                            <th data-field="ip_address">{:lang("IP地址")}</th>
                            <th data-field="ip_local">{:lang("地区信息")}</th>
                            <th data-field="total">{:lang("用户数")}</th>
                        </thead>
                    </table>
                </div>
            </div>
            <!-- End Example Pagination -->
        </div>
    </div>
    
<script type="text/javascript">
    index_url = '{:url("iprank")}';
    function queryParams(params) {   //设置查询参数
        params.startTime = $('#start_time').val(); 
        params.endTime = $('#end_time').val();
        params.ip_type = $('#ip_type').val();
        return params;
    }
    $(document).ready(function () {
        layui.use('laydate', function(){
            var laydate = layui.laydate;
            laydate.render({
                elem: '#start_time'
                ,trigger: 'click'
            });
            laydate.render({
                elem: '#end_time'
                ,trigger: 'click'
            });
        });
        initTable();
        $("#search").on("click", function(){
            initTable();
        });
    });
</script>
{include file="footer" /}
