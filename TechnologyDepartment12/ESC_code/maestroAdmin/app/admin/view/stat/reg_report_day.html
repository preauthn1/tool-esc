{include file="header" /}
    <!-- Panel Other -->
    <div class="ibox float-e-margins">
        <div class="ibox-title">
            <h5>{:lang("注册详情报表")}</h5>
        </div>
        <div class="ibox-content">
            <!--搜索框开始-->
            <form id='commentForm' role="form" method="post" class="form-inline" target="_blank">
                <div class="content clearfix m-b">
                    <div class="form-group">
                        <label>{:lang("选择时间")}：</label>
                        <input type="text" class="form-control" id="start_time" value="{$date}" name="date" placeholder="yyyy-MM-dd" lay-key="1" autocomplete="off">
                    </div>
                    <div class="form-group">
                        <label>{:lang("是否充值")}：</label>
                        <select class="form-control" name="is_recharge" id="is_recharge" >
                            <option value="">所有</option>
                            <option value="1">是</option>
                            <option value="0">否</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>{:lang("充值来源")}：</label>
                        <select class="form-control" name="recharge_type" id="recharge_type" >
                            <option value="">所有</option>
                            <option value="1">手动补单</option>
                            <option value="2">合约</option>
                            <option value="3">三方</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <input type="hidden" value="1" name="export"/>
                        <button class="btn btn-primary" type="button" style="margin-top:5px" id="search"><strong>查 询</strong></button>
                        <a class="btn btn-info" href="{:url('reg_report')}" style="margin-top:5px"><strong>返回</strong></a>
                        <button class="btn btn-danger" type="submit" style="margin-top:5px" id="export"><strong>导出</strong></button>
                    </div>
                </div>
            </form>
            <!--搜索框结束-->
            <div class="example-wrap">
                <div class="example">
                    <table id="cusTable">
                        <thead>
                            <tr>
                                <th data-field="id">{:lang("用户ID")}</th>
                                <th data-field="true_name">{:lang("姓名")}</th>
                                <th data-field="leader1">{:lang("上级ID")}</th>
                                <th data-field="second_leader_id">{:lang("初级ID")}</th>
                                <th data-field="user_name">{:lang("账户")}</th>
                                <th data-field="top_leader_remark">{:lang("顶级代理")}</th>
                                <th data-field="create_time">{:lang("注册时间")}</th>
                                <th data-field="recharge">{:lang("充值金额")}</th>
                                <th data-field="tree_level">{:lang("等级")}</th>
                            </tr>
                        </thead>
                    </table>
                </div>
            </div>
            <!-- End Example Pagination -->
        </div>
    </div>
<script type="text/javascript">
    index_url = "{:url('reg_report_day')}"
    $(document).ready(function () {
        layui.use('laydate', function(){
            var laydate = layui.laydate;
            laydate.render({
                elem: '#start_time'
                ,trigger: 'click'
            });
        });
        initTable();
        //当点击查询按钮的时候执行
        $("#search").bind("click", initTable);
    });
    function queryParams(params) {   //设置查询参数
        params.date = $('#start_time').val()
        params.is_recharge = $('#is_recharge').val()
        params.recharge_type = $('#recharge_type').val()
        return params;
    }
</script>
{include file="footer" /}
