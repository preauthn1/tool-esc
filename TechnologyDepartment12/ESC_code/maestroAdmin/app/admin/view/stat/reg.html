{include file="header" /}
    <!-- Panel Other -->
    <div class="ibox float-e-margins">
        <div class="ibox-title">
            <h5>{$title|lang}</h5>
        </div>
        <div class="ibox-content">
            <form id='commentForm' role="form" method="post" class="form-inline pull-right">
                <div class="content clearfix m-b">
                    <div class="form-group">
                        <label>{:lang("选择时间")}：</label>
                        <input type="text" class="form-control" id="start_time" name="startTime" placeholder="yyyy-MM-dd" value="{:getDateStr()}" lay-key="1" autocomplete="off">
                        -
                        <input type="text" class="form-control" id="end_time" name="endTime" placeholder="yyyy-MM-dd" value="{:getDateStr()}" lay-key="2" autocomplete="off">
                    </div>
                    <div class="form-group">
                        <button class="btn btn-primary" type="button" style="margin-top:5px" id="search"><strong>{:lang('搜索')}</strong></button>
                    </div>
                </div>
            </form>
            <div class="example-wrap">
                <div class="example">
                    <div id="combineChart" class="chart-height" style='height: 500px'></div>
                </div>
            </div>
            <!-- End Example Pagination -->
        </div>
    </div>
<script src="/static/admin/js/plugins/echarts/echarts-all.js"></script>
{include file="footer" /}
<script type="text/javascript">
var myChart = null;
function get_chart_option() {
    layer.load();
    $.ajax({
        url:'{:url("get_reg_option")}',
        type:"POST",
        dataType:"JSON",
        data:$("#commentForm").serializeArray(),
        success:function(res){
            layer.closeAll("loading");
            if (res.code === 1) {
                $("#combineChart").parents(".widget").removeClass("hidden")
                if (!myChart && typeof(myChart) !== "undefined" && myChart !== 0){
                    myChart = echarts.init(document.getElementById('combineChart'));
                }
                myChart.clear();
                myChart.setOption(res.data);
            }else{
                $("#combineChart").parents(".widget").addClass("hidden")
                layer.msg(res.msg);
            }
        }
    });
}
$("#search").on('click', function(){
    get_chart_option();
    return false;
});
get_chart_option();
    $(document).ready(function () {
        layui.use('laydate', function(){
            var laydate = layui.laydate;
            laydate.render({
                elem: '#start_time'
                ,trigger: 'click'
            });
            laydate.render({
                elem: '#end_time'
                ,trigger: 'click'
            });
        });
    });
</script>
