<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>充值/提现统计</title>
    <link rel="shortcut icon" href="{$admin_icon|toMedia}">
    <link href="/static/admin/css/bootstrap.min.css?v=3.3.6" rel="stylesheet">
    <link href="/static/admin/css/font-awesome.min.css?v=4.4.0" rel="stylesheet">
    <link href="/static/admin/css/animate.min.css" rel="stylesheet">
    <link href="/static/admin/css/plugins/iCheck/custom.css" rel="stylesheet">
    <link href="/static/admin/css/style.min.css?v=4.1.0" rel="stylesheet">
</head>
<body class="gray-bg">
<div class="wrapper wrapper-content animated fadeInRight">
    <div class="row">
        <div class="col-sm-12">
            <div class="ibox float-e-margins">
                <div class="ibox-title">
                    <h5>{:lang("充值/提现统计")}</h5>
                </div>
                <div class="ibox-content">
                    <form class="form-horizontal m-t" id="commentForm" method="post" action="{:url('stat/index')}">
                        <div class="form-group">
                            <label class="col-sm-3 control-label">{:lang("用户手机号")}：</label>
                            <div class="input-group col-sm-4">
                                <input id="mobile" type="text" class="form-control" value="" placeholder="可不填" name="mobile">
                                <span class="help-block">输入手机号查询下级所有代理的充值跟提现总额</span>
                            </div>
                        </div>
                        <div class="form-group">
                            <label class="col-sm-3 control-label">{:lang("开始时间")}：</label>
                            <div class="input-group col-sm-4">
                                <input id="start" type="date" class="form-control" value="{:date('Y-m-01')}" name="start" required aria-required="true">
                            </div>
                        </div>
                        <div class="form-group">
                            <label class="col-sm-3 control-label">{:lang("结束时间")}：</label>
                            <div class="input-group col-sm-4">
                                <input id="end" type="date" class="form-control" value="{:date('Y-m-d')}" name="end" required aria-required="true">
                            </div>
                        </div>
                        <div class="form-group">
                            <label class="col-sm-3 control-label">{:lang("充值数据")}：</label>
                            <div class="input-group col-sm-4">
                                <p class="form-control-static" id="recharge">成功：<span class="text text2 label label-success">0</span> 失败：<span class="text text3 label label-danger">0</span></p>
                            </div>
                        </div>
                        <div class="form-group">
                            <label class="col-sm-3 control-label">{:lang("提现数据")}：</label>
                            <div class="input-group col-sm-4">
                                <p class="form-control-static" id="withdraw">成功：<span class="text text2 label label-success">0</span> 失败：<span class="text text3 label label-danger">0</span></p>
                            </div>
                        </div>
                        <div class="form-group">
                            <label class="col-sm-3 control-label">{:lang("人数统计")}：</label>
                            <div class="input-group col-sm-4">
                                <p class="form-control-static">
                                    充值人数：<span class="label label-success" id="recharge_count">0</span>
                                    提现人数：<span class="label label-danger" id="withdraw_count">0</span>
                                    注册人数：<span class="label label-info" id="reg_count">0</span>
                                </p>
                            </div>
                        </div>
                        <div id="zs" style="display: none;">
                            <div class="form-group">
                                <label class="col-sm-3 control-label"></label>
                                <div class="input-group col-sm-4">
                                    <h3>直属数据</h3>
                                </div>
                            </div>
                            <div class="form-group">
                                <label class="col-sm-3 control-label">{:lang("充值数据")}：</label>
                                <div class="input-group col-sm-4">
                                    <p class="form-control-static" id="zs_recharge">成功：<span class="text text2 label label-success">0</span> 失败：<span class="text text3 label label-danger">0</span></p>
                                </div>
                            </div>
                            <div class="form-group">
                                <label class="col-sm-3 control-label">{:lang("提现数据")}：</label>
                                <div class="input-group col-sm-4">
                                    <p class="form-control-static" id="zs_withdraw">成功：<span class="text text2 label label-success">0</span> 失败：<span class="text text3 label label-danger">0</span></p>
                                </div>
                            </div>
                            <div class="form-group">
                                <label class="col-sm-3 control-label">{:lang("人数统计")}：</label>
                                <div class="input-group col-sm-4">
                                    <p class="form-control-static">
                                        充值人数：<span class="label label-success" id="zs_recharge_count">0</span>
                                        提现人数：<span class="label label-danger" id="zs_withdraw_count">0</span>
                                    </p>
                                </div>
                            </div>
                        </div>
                        <div class="form-group">
                            <div class="col-sm-4 col-sm-offset-6">
                                <button class="btn btn-primary" type="submit">查询</button>
                            </div>
                        </div>
                    </form>
                </div>
            </div>

        </div>
    </div>
</div>
<script src="/static/admin/js/jquery.min.js?v=2.1.4"></script>
<script src="/static/admin/js/bootstrap.min.js?v=3.3.6"></script>
<script src="/static/admin/js/content.min.js?v=1.0.0"></script>
<script src="/static/admin/js/plugins/validate/jquery.validate.min.js"></script>
<script src="/static/admin/js/plugins/validate/messages_zh.min.js"></script>
<script src="/static/admin/js/plugins/iCheck/icheck.min.js"></script>
<script src="/static/admin/js/plugins/layer/layer.min.js"></script>
<script src="/static/admin/js/jquery.form.js"></script>

<script type="text/javascript">

    var index = '';
    function showStart(){
        index = layer.load(0, {shade: false});
        return true;
    }

    function showSuccess(res){
        layer.ready(function(){
            layer.close(index);
            if(1 == res.code){
                $(".text").text(0);
                var recharge = res.data.recharge;
                $.each(recharge, function(i) {
                    $("#recharge").find(".text" + i).text(recharge[i]);
                });
                var withdraw = res.data.withdraw;
                $.each(withdraw, function(i) {
                    $("#withdraw").find(".text" + i).text(withdraw[i]);
                });
                $("#recharge_count").text(res.data.recharge_count);
                $("#withdraw_count").text(res.data.withdraw_count);
                $("#reg_count").text(res.data.reg_count);

                if ($("#mobile").val() != '') {
                    $("#zs").show();
                    var recharge = res.data.zs.recharge;
                    $.each(recharge, function(i) {
                        $("#zs_recharge").find(".text" + i).text(recharge[i]);
                    });
                    var withdraw = res.data.zs.withdraw;
                    $.each(withdraw, function(i) {
                        $("#zs_withdraw").find(".text" + i).text(withdraw[i]);
                    });
                    $("#zs_recharge_count").text(res.data.zs.recharge_count);
                    $("#zs_withdraw_count").text(res.data.zs.withdraw_count);
                }else{
                    $("#zs").hide();
                }
            }else if(111 == res.code){
                window.location.reload();
            }else{
                layer.msg(res.msg, {anim: 6});
            }
        });
    }

    $(document).ready(function(){
        // 编辑管理员
        var options = {
            beforeSubmit:showStart,
            success:showSuccess
        };

        $('#commentForm').submit(function(){
            $(this).ajaxSubmit(options);
            return false;
        });
    });

    // 表单验证
    $.validator.setDefaults({
        highlight: function(e) {
            $(e).closest(".form-group").removeClass("has-success").addClass("has-error")
        },
        success: function(e) {
            e.closest(".form-group").removeClass("has-error").addClass("has-success")
        },
        errorElement: "span",
        errorPlacement: function(e, r) {
            e.appendTo(r.is(":radio") || r.is(":checkbox") ? r.parent().parent().parent() : r.parent())
        },
        errorClass: "help-block m-b-none",
        validClass: "help-block m-b-none"
    });

</script>
</body>
</html>
