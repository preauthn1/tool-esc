{include file="header" /}
<style>
    .operateBox{
        padding: 10px 15px;
    }
</style>
<!-- Panel Other -->
<div class="ibox float-e-margins">
    <div class="ibox-title">
        <h5>{:lang("充值订单详情")}</h5>
    </div>
    <div class="ibox-content">
        <!--搜索框开始-->
        <form id='commentForm' role="form" method="post" class="form-inline pull-right" target="_blank" style="display:none;" onkeydown="if (event.keyCode == 13) { return false; }">
            <div class="content clearfix m-b">
                <input type="text" class="form-control" id="user_id" name="user_id" value="{$user_id}">
                <div class="form-group">
                    <label>{:lang("选择时间")}：</label>
                    <input type="text" class="form-control" id="start_time" name="startTime" placeholder="yyyy-MM-dd"
                           lay-key="1" value="{$startTime}" autocomplete="off">
                    -
                    <input type="text" class="form-control" id="end_time" name="endTime" placeholder="yyyy-MM-dd"
                           lay-key="2" value="{$endTime}" autocomplete="off">
                </div>
                <div class="form-group">
                    <label>{:lang("搜索")}：</label>
                    <input type="text" class="form-control" id="searchText" name="searchText"
                           placeholder="用户名/订单号">
                </div>
                <div class="form-group">
                    <input type="hidden" value="1" name="export"/>
                    <button class="btn btn-primary" type="button" style="margin-top:5px" id="search"><strong>{:lang('搜索')}</strong>
                    </button>
                    <!--                    <button class="btn btn-danger" type="submit" style="margin-top:5px" id="export"><strong>{:lang("导出")}</strong>-->
                    <!--                    </button>-->
                </div>
            </div>
        </form>
        <div class="clearfix"></div>
        <div id="toolbar">
            <div id="stats" style='float: left; padding: 2px 12px'></div>
        </div>
        <!--搜索框结束-->
        <div class="example-wrap">
            <div class="example">
                <table id="cusTable" data-toolbar="#toolbar">
                    <thead>
                    <th data-field="id">ID</th>
                    <th data-field="userinfo" data-formatter="userInfoFormatter">{:lang("用户信息")}</th>
                    <th data-field="recharge_amount" data-formatter="rechargeAmountFormatter">{:lang("充值金额")}</th>
                    <th data-field="create_time" data-formatter="createTimeFormatter">{:lang("充值时间")}</th>
                    <th data-field="status_text">{:lang("状态")}</th>
                    <th data-field="operate">{:lang("操作")}</th>
                    </thead>
                </table>
            </div>
        </div>
        <!-- End Example Pagination -->
    </div>
</div>

<div id="operateTmplate" style="display: none;">
    <div class="operateBox">
        <div class="form-group">
            <label>快捷理由</label>
            <select class="form-control" onchange="$(this).parent().siblings().find('.remark').val($(this).val())">
                <option value="">无</option>
                {if condition="isset($remark)"}
                {volist name='remark' id='text'}
                <option value="{$text}">{$text}</option>
                {/volist}
                {/if}
            </select>
        </div>
        <div class="form-group">
            <label>审核理由</label>
            <input type="text" name="remark" class="form-control remark" value=""/>
        </div>
    </div>
</div>
{include file="footer" /}
<script type="text/javascript">
    var $table = $('#cusTable');
    var $remove = $("#remove");
    var repeatIPFlag = 0;

    function setRepeatIPFlag() {
        repeatIPFlag = 1;
        initTable();
    }

    // 用户信息
    function userInfoFormatter(value, row, index) {
        var html = "";
        html += "<p style='color: #1aa094; cursor: pointer;'>用户：" + row.uid + "/" + row.user_name + "</a>";
        html += "<p>订单号：" + row.order_id + "</p>";
        html += "<p>三方订单号：" + row.trade_no + "</p>";

        if (Object.keys(row.top_leader).length > 0) {
            html += "<p style='color: #1aa094; cursor: pointer;' lay-on='show-money-log'" +
                " data-user_name='"+row.top_leader.user_name+"' data-user_id='"+row.top_leader.id+"'" +
                ">顶级代理：" + row.top_leader.id + "/" +row.top_leader.user_name + (row.top_leader.remark? "（"+row.top_leader.remark+"）": '')+"</p>";
        }
        return "<span>" + html + "</span>";
    }

    // 充值金额
    function rechargeAmountFormatter(value, row, index) {
        var html = "";
        let channel_name = '未知';
        if (row.pay_id) {
            let config = row.channel.config
            switch (config.coin) {
                case 'MXN':
                    channel_name = '<span style="color: purple;">' + config.coin + '</span>'
                    break;
                // case 'TRX':
                //     channel_name = '<span style="color: green;">' + row.channel.name + '</span>'
                //     break;
                // case 'BEP20-USDT':
                //     channel_name = '<span style="color: orange">' + row.channel.name + '</span>'
                //     break;
                // case 'BNB':
                //     channel_name = '<span style="color: orangered;">' + row.channel.name + '</span>'
                //     break;
                default:
            }
        }
        let is_first = row.is_first ? '<span style="color: #33e16eba;">首充</span>' : '<span style="color: #c8c2b6">累充</span>';
        html += "<p>币种/首充：" + channel_name + "/" + is_first + "</a>";
        html += "<p>原始金额：" + row.original_money + "</p>";
        html += "<p>汇率：" + row.exchange_rate + "</p>";
        html += "<p>充值金额：" + row.money + "</p>";
        html += "<p>类型：" + (row.type=='3'?'三方充值':(row.type=='2')?'合约充值':'手动补单') + "</p>";
        return "<span>" + html + "</span>";
    }

    // 充值时间
    function createTimeFormatter(value, row, index) {
        var html = "";
        html += "<p>账户类型：基础账户</a>";
        html += "<p>创建时间：" + row.create_time + "</p>";
        html += "<p>充值时间：" + (row.pay_time ? row.pay_time : '') + "</p>";
        html += "<p>备注信息：" + (row.remark ? row.remark : '') + "</p>";
        return "<span>" + html + "</span>";
    }


    function initTable() {
        //先销毁表格
        $table.bootstrapTable('destroy');
        //初始化表格,动态从服务器加载数据
        $table.bootstrapTable({
            method: "get",  //使用get请求到服务器获取数据
            url: '{:url("day_recharge")}', //获取数据的地址
            striped: true,  //表格显示条纹
            pagination: true, //启动分页
            pageSize: 10,  //每页显示的记录数
            pageNumber: 1, //当前第几页
            pageList: [10, 30, 50, 100, 500],  //记录数可选列表
            sidePagination: "server", //表示服务端请求
            paginationFirstText: "{:lang('首页')}",
            paginationPreText: "{:lang('上一页')}",
            paginationNextText: "{:lang('下一页')}",
            paginationLastText: "{:lang('尾页')}",
            queryParamsType: "undefined",
            queryParams: function queryParams(params) {   //设置查询参数
                params.startTime = $('#start_time').val();
                params.endTime = $('#end_time').val();
                params.user_id = $('#user_id').val();
                return params;
            },
            onLoadSuccess: function (res) {  //加载成功时执行
                if (111 == res.code) {
                    window.location.reload();
                }
                var stathtml = '';
                if (res.stat) {
                    $.each(res.stat, function (i, v) {
                        stathtml += '<span class="label label-success">' + v.text + '：' + v.total + '</span> ';
                    })
                }
                $("#stats").html(stathtml);
                layer.msg("{:lang('加载成功')}", {time: 1000});
            },
            onLoadError: function () {  //加载失败时执行
                layer.msg("{:lang('加载数据失败')}");
            }
        });
    }

    $(document).ready(function () {
        layui.use(['laydate', 'util'], function () {
            var laydate = layui.laydate;
            var util = layui.util;
            laydate.render({
                elem: '#start_time'
                , trigger: 'click'
            });
            laydate.render({
                elem: '#end_time'
                , trigger: 'click'
            });
        });
        //调用函数，初始化表格
        initTable();
        //当点击查询按钮的时候执行
        $("#search").bind("click", initTable);
    });

    function checkStatus(id, status) {
        var status_text = ['', '', '成功', '失败', '自动出款']
        if (status == 4) {
            $("#operateTmplate").find(".channel-input").show();
        } else {
            $("#operateTmplate").find(".channel-input").hide();
        }
        layer.open({
            title: "审核确认框",
            type: 1,
            content: $("#operateTmplate"),
            area: ['400px', status == 4 ? '380px' : '280px'],
            btn: ['确认审核' + status_text[status], '取消'],
            yes: function (index, layero) {
                var remark = layero.find(".remark").val();
                var channel = layero.find("#channel").val();
                if (!remark) {
                    layer.msg('请填写备注');
                    return;
                }
                $.getJSON("{:url('withdraw/checkStatus')}", {
                    'id': id,
                    'status': status,
                    remark: remark,
                    channel: channel
                }, function (res) {
                    if (1 == res.code) {
                        layer.close(index);
                        layer.alert(res.msg, {title: "{:lang('友情提示')}", icon: 1, closeBtn: 0}, function (inx) {
                            layer.close(inx);
                            initTable();
                        });
                    } else if (111 == res.code) {
                        window.location.reload();
                    } else {
                        layer.msg(res.msg);
                    }
                });
            }
        });
    }

    function withdrawDel(id){
        layer.confirm('确认删除此提现申请?', {icon: 3, title:'提示'}, function(index){
            //do something
            $.getJSON("{:url('withdraw/withdrawDel')}", {'id' : id}, function(res){
                if(1 == res.code){
                    layer.alert(res.msg, {title: "{:lang('友情提示')}", icon: 1, closeBtn: 0}, function(){
                        initTable();
                    });
                }else if(111 == res.code){
                    window.location.reload();
                }else{
                    layer.alert(res.msg, {title: "{:lang('友情提示')}", icon: 2});
                }
            });
            layer.close(index);
        })
    }
</script>
