{include file="header" /}
    <div class="ibox float-e-margins">
        <div class="ibox-title">
            <h5>{:lang("数据统计")}</h5>
        </div>
        <div class="ibox-content">
            <!--搜索框开始-->
            <form id='commentForm' role="form" method="post" class="form-inline" action="">
                <div class="content clearfix m-b">
                    <div class="form-group">
                        <label>{:lang("选择时间")}：</label>
                        <input type="text" class="form-control" id="start_time" value="{$startTime}" name="startTime" placeholder="yyyy-MM-dd" lay-key="1" autocomplete="off">
                        -
                        <input type="text" class="form-control" id="end_time" value="{$endTime}" name="endTime" placeholder="yyyy-MM-dd" lay-key="2" autocomplete="off">
                    </div>
                    <div class="form-group">
                        <button class="btn btn-primary" type="submit" style="margin-top:5px" id="search"><strong>查 询</strong></button>
                    </div>
                </div>
            </form>
            <!--搜索框结束-->
            <div class="example-wrap">
                <div class="example">
                    <table class="table table-bordered">
                        <thead>
                            <tr>
                                <th class="text-center">{:lang("日期")}</th>
                                <th class="text-center">{:lang("注册人数")}</th>
                                <th class="text-center">{:lang("充值人数")}</th>
                                <th class="text-center">{:lang("未充值人数")}</th>
                                <th class="text-center">{:lang("操作")}</th>
                            </tr>
                        </thead>
                        <tbody>
                            {volist name='list' id='row'}
                            <tr>
                                <td class="text-center">{$row.date}</td>
                                <td class="text-center">{$row.reg}</td>
                                <td class="text-center">{$row.recharge}</td>
                                <td class="text-center">{$row.no_recharge}</td>
                                <td class="text-center"><a href="{:url('reg_report_day', ['date' => $row.date])}" class="btn btn-info btn-xs"><i class="fa fa-info"></i> 详情</a></td>
                            </tr>
                            {/volist}
                        </tbody>
                    </table>
                </div>
            </div>
            <!-- End Example Pagination -->
        </div>
    </div>
{include file="footer" /}
<script>
$(document).ready(function () {
    layui.use('laydate', function(){
        var laydate = layui.laydate;
        laydate.render({
            elem: '#start_time'
            ,trigger: 'click'
        });
        laydate.render({
            elem: '#end_time'
            ,trigger: 'click'
        });
    });
});
</script>
