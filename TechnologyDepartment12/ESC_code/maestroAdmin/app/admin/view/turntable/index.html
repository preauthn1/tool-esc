<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>系统设置</title>
    <link rel="shortcut icon" href="{$admin_icon|toMedia}">
    <link href="/static/admin/css/bootstrap.min.css?v=3.3.6" rel="stylesheet">
    <link href="/static/admin/css/font-awesome.min.css?v=4.4.0" rel="stylesheet">
    <link href="/static/admin/css/animate.min.css" rel="stylesheet">
    <link href="/static/admin/css/plugins/iCheck/custom.css" rel="stylesheet">
    <link href="/static/admin/css/style.min.css?v=4.1.0" rel="stylesheet">
    <link href="/static/admin/js/plugins/bootstrap-tagsinput/bootstrap-tagsinput.css" rel="stylesheet">
    <link href="/static/admin/js/layui/css/layui.css" rel="stylesheet">
</head>
<body class="gray-bg">
<div class="wrapper wrapper-content animated fadeInRight">
    <div class="row">
        <div class="col-sm-12">
            <div class="ibox float-e-margins">
                <div class="ibox-title">
                    <h5>{:lang("抽奖配置")}</h5>
                </div>
                <form class="form-horizontal" id="commentForm" method="post" action="{:url('turntable/index')}">
                    <div id="myTabContent" class="tab-content ibox-content">
                        <input name="id" value="{$turntable['id']}" hidden>
                        <div class="form-group">
                            <label class="col-sm-3 control-label">{:lang("抽奖开关")}：</label>
                            <div class="input-group col-sm-4">
                                <div class="layui-form">
                                    <input type="radio" name="status" value="1" title="开启" {if $turntable['status'] ==
                                    1}checked{/if}>
                                    <input type="radio" name="status" value="2" title="关闭" {if $turntable['status'] ==
                                    2}checked{/if}>
                                </div>
                                <p class="help-block">status：是否启用抽奖（前端是否展示抽奖入口）。</p>
                            </div>
                        </div>
                        <div class="form-group">
                            <label class="col-sm-3 control-label">{:lang("转盘形式")}：</label>
                            <div class="input-group col-sm-4">
                                <div class="layui-form">
                                    <input type="radio" name="type" value="1" title="转盘抽奖" {if $turntable['type'] ==
                                    1}checked{/if}>
                                    <input type="radio" name="type" value="2" title="红包抽奖" {if $turntable['type'] ==
                                    2}checked{/if}>
                                </div>
                                <p class="help-block">type：抽奖形式，1.转盘抽奖，2.红包抽奖</p>
                            </div>
                        </div>
                        <div class="form-group">
                            <label class="col-sm-3 control-label">{:lang("抽奖奖品设置")}：</label>
                            <div class="input-group col-sm-4">
                                <div class="layui-form">
                                    <input type="radio" lay-filter="prize" name="prize" value="1" title="全局" {if
                                           $turntable['prize'] == 1}checked{/if}>
                                    <input type="radio" lay-filter="prize" name="prize" value="2" title="局部" {if
                                           $turntable['prize'] == 2}checked{/if}>
                                </div>
                                <p class="help-block">
                                    prize：抽奖奖品设置：全局是所有vip统一设置，在本页面下方设置奖品；局部是针对vip设置不同奖品，在vip配置菜单设置。</p>
                            </div>
                        </div>
                        <div class="form-group">
                            <label class="col-sm-3 control-label">{:lang("到账账户")}：</label>
                            <div class="input-group col-sm-4">
                                <div class="layui-form">
                                    <input type="radio" name="capital_type" value="1" title="基础账户" {if $turntable['capital_type'] == 1}checked{/if}>
                                    <input type="radio" name="capital_type" value="5" title="佣金账户" {if $turntable['capital_type'] == 5}checked{/if}>
                                    <input type="radio" name="capital_type" value="8" title="佣金池" {if $turntable['capital_type'] == 8}checked{/if}>
                                </div>
                                <p class="help-block">capital_type：抽奖赠送金额到什么账户，1.基础，5.佣金，8.佣金池</p>
                            </div>
                        </div>
                        <div class="form-group">
                            <label class="col-sm-3 control-label">{:lang("注册赠送抽奖次数")}：</label>
                            <div class="input-group col-sm-4">
                                <div class="layui-form">
                                    <input type="text" class="form-control" name="register_num"
                                           value="{$turntable['register_num']}">
                                </div>
                                <p class="help-block">register_num：注册赠送抽奖次数</p>
                            </div>

                        </div>
                        <div class="form-group">
                            <label class="col-sm-3 control-label">{:lang("邀请用户充值金额")}：</label>
                            <div class="input-group col-sm-4">
                                <div class="layui-form">
                                    <input type="text" class="form-control" name="invite_recharge"
                                           value="{$turntable['invite_recharge']}">
                                </div>
                                <p class="help-block">invite_recharge：邀请用户单次充值满多少送一次抽奖次数（每个下级充值只能获得一次）</p>
                            </div>
                        </div>
                        <div class="form-group prize-set">
                            <label class="col-sm-3 control-label">{:lang("奖品设置")}：</label>
                            <div class="input-group col-sm-4">
                                <a class="add-prize" href="{:url('prizeList')}?level_id=-1">
                                    <button class="btn btn-primary">{:lang('查看')}{:lang("编辑")}</button>
                                </a>
                            </div>
                        </div>
                        <div class="form-group">
                            <div class="col-sm-4 col-sm-offset-6">
                                <!--<input type="button" value="提交" class="btn btn-primary" id="postform"/>-->
                                <button class="btn btn-primary" >{:lang("提交")}</button>
                            </div>
                        </div>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
<script src="/static/admin/js/jquery.min.js?v=2.1.4"></script>
<script src="/static/admin/js/bootstrap.min.js?v=3.3.6"></script>
<script src="/static/admin/js/content.min.js?v=1.0.0"></script>
<script src="/static/admin/js/plugins/bootstrap-tagsinput/bootstrap-tagsinput.min.js"></script>
<script src="/static/admin/js/plugins/validate/jquery.validate.min.js"></script>
<script src="/static/admin/js/plugins/validate/messages_zh.min.js"></script>
<script src="/static/admin/js/plugins/iCheck/icheck.min.js"></script>
<script src="/static/admin/js/layui/layui.js"></script>
<script src="/static/admin/js/jquery.form.js"></script>
<script type="text/javascript">

    var index = '';

    function showStart() {
        index = layer.load(0, {shade: false});
        return true;
    }

    function showSuccess(res) {

        layer.ready(function () {
            layer.close(index);
            if (1 == res.code) {
                layer.alert(res.msg, {title: "{:lang('友情提示')}", icon: 1, closeBtn: 0}, function () {
                    window.location.href = res.data;
                });
            } else if (111 == res.code) {
                window.location.reload();
            } else {
                layer.msg(res.msg, {anim: 6});
            }
        });
    }

    function add(url){
        // 在此处输入 layer 的任意代码
        layer.open({
            type: 2,
            area: ['100%', '100%'],
            title: '添加/编辑',
            maxmin: true, // 允许全屏最小化
            anim: 0, // 0-6 的动画形式，-1 不开启
            content: url
        });
    }
    $(document).ready(function () {
        $(".add-prize").on('click', function (e) {
            if (e.currentTarget.href.indexOf('javascript') === -1) {
                add(e.currentTarget.href)
                return false;
            }
            return true;
        });
        layui.use('form', function () {
            var form = layui.form;
            // 监听radio变化
            form.on('radio(prize)', function (data) {
                let val = data.value;
                if (val == 1) {
                    $('.prize-set').show();
                } else {
                    $('.prize-set').hide();
                }
            });
        });
        if ('{$turntable.prize}' == '1') {
            $('.prize-set').show();
        } else {
            $('.prize-set').hide();
        }
    });
</script>
</body>
</html>
