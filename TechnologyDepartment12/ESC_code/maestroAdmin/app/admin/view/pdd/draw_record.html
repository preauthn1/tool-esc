{include file="header" /}
    <!-- Panel Other -->
    <div class="ibox float-e-margins">
        <div class="ibox-title">
            <h5>{$title|lang}</h5>
        </div>
        <div class="ibox-content">
            <!--搜索框开始-->
            <form id='commentForm' role="form" method="post" class="form-inline pull-right">
                <div class="content clearfix m-b">
                    <div class="form-group">
                        <label>{:lang("选择时间")}：</label>
                        <input type="text" class="form-control" id="start_time" name="startTime" value="{:getDateStr()}" placeholder="yyyy-MM-dd" lay-key="1" autocomplete="off">
                        -
                        <input type="text" class="form-control" id="end_time" name="endTime" value="{:getDateStr()}" placeholder="yyyy-MM-dd" lay-key="2" autocomplete="off">
                    </div>
                    <div class="form-group">
                        <label>{:lang("用户id")}：</label>
                        <input type="text" class="form-control" id="user_id" name="user_id" placeholder="用户ID">
                    </div>
                    <div class="form-group">
                        <label>{:lang("用户类型")}：</label>
                        <select class="form-control" id="is_xuni" name="is_xuni">
                            <option value="-1">{:lang("所有")}</option>
                            <option value="1">{:lang("虚拟用户")}</option>
                            <option value="0" selected>{:lang("真实用户")}</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <button class="btn btn-primary" type="button" style="margin-top:5px" id="search"><strong>{:lang('搜索')}</strong>
                        </button>
                    </div>
                </div>
            </form>
            <!--搜索框结束-->
            <div class="example-wrap">
                <div class="example">
                    <table id="cusTable"
                           data-total-field="total"
                           data-data-field="data">
                        <thead>
                        <th data-field="user_id">用户ID</th>
{/*                        <th data-field="record_id">奖品id</th>*/}
{/*                        <th data-field="name">奖品名称</th>*/}
                        <th data-field="amount">中奖金额</th>
                        <th data-field="value" data-formatter="valueFormatter">增加金额/进度</th>
                        <th data-field="type_str">抽奖类型</th>
                        <th data-field="progress" data-formatter="progressFormatter">抽奖进度</th>
                        <th data-field="is_receive_str">是否领取</th>
                        <th data-field="create_time">创建时间</th>
                        <th data-field="update_time">创建时间</th>
                        <th data-field="is_xuni_text">虚拟账户</th>
                        </thead>
                    </table>
                </div>
            </div>
            <!-- End Example Pagination -->
        </div>
    </div>
<script type="text/javascript">
    function progressFormatter(value, row, index) {
        if (row.type === 2) {
            return row.progress
        }
    }
    function valueFormatter(value, row, index) {
        if (row.type === 2) {
            return row.value
        }
    }

    index_url = '{:url("drawRecord")}';
    $(document).ready(function () {
        layui.use('laydate', function(){
            var laydate = layui.laydate;
            laydate.render({
                elem: '#start_time'
                ,trigger: 'click'
            });
            laydate.render({
                elem: '#end_time'
                ,trigger: 'click'
            });
        });
        initTable();
        //当点击查询按钮的时候执行
        $("#search").bind("click", initTable);
    });
    function queryParams(params) {   //设置查询参数
        params.user_id = $('#user_id').val()
        params.is_xuni = $('#is_xuni').val();
        params.startTime = $('#start_time').val();
        params.endTime = $('#end_time').val();
        return params;
    }
</script>
{include file="footer" /}
