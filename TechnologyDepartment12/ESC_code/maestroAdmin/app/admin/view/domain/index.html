{include file="header" /}
    <!-- Panel Other -->
    <div class="ibox float-e-margins">
        <div class="ibox-title">
            <h5>{$title|lang}</h5>
        </div>
        <div class="ibox-content">
            <div class="form-group clearfix col-sm-7">
                {if authCheck('bank/add')}
                <a href="{:url('add')}">
                    <button class="btn btn-outline btn-primary" type="button">{:lang("添加")}</button>
                </a>
                {/if}
            </div>
            <!--搜索框开始-->
            <form id='commentForm' role="form" method="post" class="form-inline pull-right">
                <div class="content clearfix m-b">
                    <div class="form-group">
                        <label>{:lang("网站标题")}：</label>
                        <input type="text" class="form-control" id="name" name="name" placeholder="{:lang('网站标题')}">
                    </div>
                    <div class="form-group">
                        <button class="btn btn-primary" type="button" style="margin-top:5px" id="search"><strong>{:lang('搜索')}</strong>
                        </button>
                    </div>
                </div>
            </form>
            <!--搜索框结束-->
            <div class="example-wrap">
                <div class="example">
                    <table id="cusTable">
                        <thead>
                        <th data-field="lang">{:lang("语言")}</th>
                        <th data-field="domain">{:lang("域名")}</th>
                        <th data-field="title">{:lang("网站标题")}</th>
                        <th data-field="logo">{:lang("LOGO")}</th>
                        <th data-field="status">{:lang("状态")}</th>
                        <th data-field="create_time">{:lang("添加时间")}</th>
                        <th data-field="update_time">{:lang("更新时间")}</th>
                        <th data-field="operate">{:lang("操作")}</th>
                        </thead>
                    </table>
                </div>
            </div>
            <!-- End Example Pagination -->
        </div>
    </div>
<script type="text/javascript">
    $(document).ready(function () {
        initTable();
        //当点击查询按钮的时候执行
        $("#search").bind("click", initTable);
    });
    function queryParams(params) {   //设置查询参数
        params.name = $('#name').val()
        return params;
    }
</script>
{include file="footer" /}
