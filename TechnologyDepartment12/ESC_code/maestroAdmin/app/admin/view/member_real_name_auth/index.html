{include file="header" /}
<style>
    .operateBox{
        padding: 10px 15px;
    }
</style>
<!-- Panel Other -->
<div class="ibox float-e-margins">
    <div class="ibox-title">
        <h5>{:lang("实名认证")}</h5>
    </div>
    <div class="ibox-content">
        <div id="toolbar">
            <button id="success" class="btn btn-success btn-xs" disabled>
                <i class="glyphicon glyphicon-check"></i> 批量审核成功
            </button>
            <button id="remove" class="btn btn-danger btn-xs" disabled>
                <i class="glyphicon glyphicon-remove"></i> 批量审核失败
            </button>
            <!--            <a href="javascript:void(0)" class="btn btn-outline btn-primary btn-xs"-->
            <!--               onclick="setRepeatIPFlag()">只看重复IP用户</a>-->
            <div id="stats" style=' float: right; padding: 2px 12px'></div>
        </div>
        <!--搜索框开始-->
        <form id='commentForm' role="form" method="post" class="form-inline pull-right">
            <div class="content clearfix m-b">
                <div class="form-group">
                    <label>用户ID：</label>
                    <input type="text" class="form-control" id="user_id" name="user_id" placeholder="用户ID">
                </div>
                <div class="form-group">
                    <label>真实姓名：</label>
                    <input type="text" class="form-control" id="real_name" name="real_name" placeholder="真实姓名">
                </div>
                <div class="form-group">
                    <button class="btn btn-primary" type="button" style="margin-top:5px" id="search"><strong>搜 索</strong>
                    </button>
                </div>
            </div>
        </form>
        <div class="clearfix"></div>
        <!--搜索框结束-->
        <div class="example-wrap">
            <div class="example">
                <table id="cusTable"  data-toolbar="#toolbar">
                    <thead>
                    <th data-checkbox="true" data-formatter="stateFormatter">ID</th>
                    <th data-field="userinfo" data-formatter="userInfoFormatter">{:lang('用户信息')}</th>
                    <th data-field="real_name">{:lang('真实姓名')}</th>
                    <th data-field="id_card">{:lang('身份证号')}</th>
                    <th data-field="id_card_front">{:lang('身份证正面')}</th>
                    <th data-field="id_card_back">{:lang('身份证背面')}</th>
                    <th data-field="hand_hold_photo">{:lang('手持身份证')}</th>
                    <th data-field="check_status" data-formatter="checkStatusFormatter">{:lang('状态')}</th>
                    <th data-field="operate">{:lang('操作')}</th>
                    </thead>
                </table>
            </div>
        </div>
        <!-- End Example Pagination -->
    </div>
</div>
<div id="operateTmplate" style="display: none;">
    <div class="operateBox">
        <div class="form-group">
            <label>快捷理由</label>
            <select class="form-control" onchange="$(this).parent().siblings().find('.remark').val($(this).val())">
                <option value="">无</option>
                {volist name='remark' id='text'}
                <option value="{$text}">{$text}</option>
                {/volist}
            </select>
        </div>
        <div class="form-group">
            <label>审核理由</label>
            <input type="text" name="remark" class="form-control remark" value=""/>
        </div>
    </div>
</div>
{include file="footer" /}
<script type="text/javascript">
    var $table = $('#cusTable');
    var $success = $("#success");
    var $remove = $("#remove");
    var $success_agent = $("#success_agent");

    // 用户信息
    function userInfoFormatter(value, row, index) {
        var html = "";
        html += "<p style='color: #1aa094; cursor: pointer;'>用户：" + row.user_id + "/" + (row.user?row.user.user_name:'') + "</a>";
        return "<span>" + html + "</span>";
    }

    // 审核状态
    function checkStatusFormatter(value, row, index) {
        var html = "";
        html += "<p>审核状态：" + row.status_text + "</p>";
        html += "<p>备注：" + row.remark + "</p>";
        html += "<p>操作员：" + row.admin_id + '/' + row.admin_name + "</p>";
        html += "<p>操作时间：" + row.check_time + "</p>";
        return "<span>" + html + "</span>";
    }

    function stateFormatter(value, row, index) {
        if (row.status !== 0) {
            return {
                disabled: true
            }
        }
        return value;
    }
    function initTable() {
        //先销毁表格
        $table.bootstrapTable('destroy');
        //初始化表格,动态从服务器加载数据
        $table.bootstrapTable({
            method: "get",  //使用get请求到服务器获取数据
            url: '{:url("index")}', //获取数据的地址
            striped: true,  //表格显示条纹
            pagination: true, //启动分页
            pageSize: 10,  //每页显示的记录数
            pageNumber: 1, //当前第几页
            pageList: [10, 30, 50, 100, 500],  //记录数可选列表
            sidePagination: "server", //表示服务端请求
            paginationFirstText: "{:lang('首页')}",
            paginationPreText: "{:lang('上一页')}",
            paginationNextText: "{:lang('下一页')}",
            paginationLastText: "{:lang('尾页')}",
            queryParamsType: "undefined",
            queryParams: function queryParams(params) {   //设置查询参数
                params.user_id = $('#user_id').val()
                params.real_name = $('#real_name').val()
                return params;
            },
            onLoadSuccess: function (res) {  //加载成功时执行
                if (111 == res.code) {
                    window.location.reload();
                }
                var stathtml = '';
                if (res.stat) {
                    $.each(res.stat, function (i, v) {
                        stathtml += '<span class="label label-success">' + v.text + '：' + v.total + '</span> ';
                    })
                }
                $("#stats").html(stathtml);
                layer.msg("{:lang('加载成功')}", {time: 1000});
            },
            onLoadError: function () {  //加载失败时执行
                layer.msg("{:lang('加载数据失败')}");
            }
        });
        $table.on('check.bs.table uncheck.bs.table ' + 'check-all.bs.table uncheck-all.bs.table', function () {
            $remove.prop('disabled', !$table.bootstrapTable('getSelections').length);
            $success.prop('disabled', !$table.bootstrapTable('getSelections').length);
            $success_agent.prop('disabled', !$table.bootstrapTable('getSelections').length);
        })
    }
    $(document).ready(function () {

        layui.use(['util', 'form'], function() {
            var util = layui.util;
            var form = layui.form;

            // checkbox 事件
            form.on('switch(changeStatus)', function(data){
                var elem = data.elem; // 获得 checkbox 原始 DOM 对象
                let type = elem.dataset.type
                let id = elem.dataset.id
                let val = elem.dataset.val

                // 发起请求
                let url = "{:url('changeStatus')}"
                index = layer.load(0);
                $.ajax({
                    type: 'POST',
                    url: url,
                    data: {
                        id:id,
                        type: type,
                        val: val
                    },
                    dataType: 'json',
                    success: function (res) {
                        layer.closeLast('loading');
                        // 循环语言
                        layer.msg(res.msg)
                    },
                    error: function (xhr, type) {
                        layer.closeLast('loading');
                    }
                });
            });
        });

        //调用函数，初始化表格
        initTable();
        //当点击查询按钮的时候执行
        $("#search").bind("click", initTable);

    });
    function onLoadSuccess(res) {
        $("#add").on('click',function (e){
            add(e.currentTarget.href)
            return false;
        });
        $("td a").on('click', function (e) {
            if (e.currentTarget.href.indexOf('javascript') === -1) {
                add(e.currentTarget.href)
                return false;
            }
            return true;
        });
    }
    function add(url){
        // 在此处输入 layer 的任意代码
        layer.open({
            type: 2,
            area: ['100%', '100%'],
            title: '添加/编辑',
            maxmin: true, // 允许全屏最小化
            anim: 0, // 0-6 的动画形式，-1 不开启
            content: url
        });
    }

    function checkStatus(id, status) {
        var status_text = ['', '成功', '失败']
        if (status == 4) {
            $("#operateTmplate").find(".channel-input").show();
        } else {
            $("#operateTmplate").find(".channel-input").hide();
        }
        layer.open({
            title: "审核确认框",
            type: 1,
            content: $("#operateTmplate"),
            area: ['400px', status == 4 ? '380px' : '280px'],
            btn: ['确认审核' + status_text[status], '取消'],
            yes: function (index, layero) {
                var remark = layero.find(".remark").val();
                var channel = layero.find("#channel").val();
                if (!remark) {
                    layer.msg('请填写备注');
                    return;
                }
                $.getJSON("{:url('MemberRealNameAuth/checkStatus')}", {
                    'id': id,
                    'status': status,
                    remark: remark,
                    channel: channel
                }, function (res) {
                    if (1 == res.code) {
                        layer.close(index);
                        layer.alert(res.msg, {title: "{:lang('友情提示')}", icon: 1, closeBtn: 0}, function (inx) {
                            layer.close(inx);
                            initTable();
                        });
                    } else if (111 == res.code) {
                        window.location.reload();
                    } else {
                        layer.msg(res.msg);
                    }
                });
            }
        });
    }
</script>
